<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ──────────────────────────────────────────────────────────────── */
    .modal-header {
      padding: 14px 18px 10px;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }
    .modal-header h3 {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .modal-header .subtitle {
      font-size: 11px;
      color: #888;
    }

    /* ── Scrollable content area ─────────────────────────────────────────────── */
    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
    }

    /* ── Bottom action bar ───────────────────────────────────────────────────── */
    .modal-footer {
      border-top: 1px solid #e0e0e0;
      padding: 10px 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #status {
      flex: 1;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 4px;
      min-height: 30px;
      line-height: 18px;
    }
    #status.empty   { background: none; color: transparent; }
    #status.info    { background: #e8f0fe; color: #1a73e8; }
    #status.success { background: #e6f4ea; color: #1e7e34; }
    #status.error   { background: #fce8e6; color: #c0392b; }

    /* ── File input ──────────────────────────────────────────────────────────── */
    label.field-label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="file"] {
      width: 100%;
      font-size: 12px;
      padding: 4px 0;
    }

    /* ── Column preview ──────────────────────────────────────────────────────── */
    .preview-box {
      margin-top: 14px;
      border: 1px solid #dadce0;
      border-radius: 5px;
      overflow: hidden;
      display: none;
    }
    .preview-box-header {
      background: #f1f3f4;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #666;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .preview-box-header .row-count {
      font-size: 12px;
      font-weight: bold;
      color: #333;
      text-transform: none;
      letter-spacing: 0;
    }
    .preview-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .preview-col {
      padding: 10px 12px;
      font-size: 12px;
      font-family: monospace;
      line-height: 1.8;
    }
    .preview-col:first-child {
      border-right: 1px solid #e0e0e0;
    }
    .preview-col-title {
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 5px;
      font-family: Arial, sans-serif;
    }
    .match   { color: #1e7e34; }
    .nomatch { color: #c0392b; }

    .ignored-cols {
      padding: 8px 12px;
      border-top: 1px solid #e0e0e0;
      font-size: 11px;
      font-family: monospace;
      color: #999;
      line-height: 1.7;
      background: #fafafa;
    }
    .ignored-cols-title {
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #aaa;
      font-family: Arial, sans-serif;
      margin-bottom: 3px;
    }

    /* ── Buttons ─────────────────────────────────────────────────────────────── */
    .btn-primary {
      padding: 9px 22px;
      background: #1a73e8;
      color: white;
      border: none;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-primary:hover    { background: #1557b0; }
    .btn-primary:disabled { background: #aaa; cursor: default; }
    .btn-secondary {
      padding: 9px 18px;
      background: #fff;
      color: #1a73e8;
      border: 1.5px solid #1a73e8;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-secondary:hover { background: #e8f0fe; }

    /* ════════════════════════════════════════════════════════════════════════════
       REVIEW PANEL
    ════════════════════════════════════════════════════════════════════════════ */
    #reviewPanel { display: none; }

    .review-hero {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .review-hero .check { font-size: 24px; color: #1e7e34; }
    .review-hero h3     { font-size: 15px; color: #1e7e34; margin: 0; }
    .review-hero .total { font-size: 12px; color: #666; margin-top: 1px; }

    .review-section { margin-bottom: 16px; }
    .review-section-title {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 7px;
    }

    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      background: #e8f0fe;
      color: #1a73e8;
    }
    .badge.status  { background: #fef7e0; color: #b06000; }
    .badge.warning { background: #fce8e6; color: #c0392b; }

    .divider {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 14px 0;
    }

    /* Location × Type table */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }
    th {
      background: #f1f3f4;
      padding: 6px 10px;
      text-align: right;
      font-weight: bold;
      white-space: nowrap;
      border-bottom: 1px solid #ddd;
    }
    th:first-child { text-align: left; }
    td {
      padding: 5px 10px;
      text-align: right;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
    }
    td:first-child {
      text-align: left;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #333;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8f9fa; }
    td.total-col, th.total-col {
      font-weight: bold;
      color: #333;
      border-left: 1px solid #ddd;
    }
    /* ── Health issues section ───────────────────────────────────────────────── */
    .health-section {
      margin-top: 14px;
      border: 1px solid #f5c6cb;
      border-radius: 5px;
      overflow: hidden;
    }
    .health-section.clean {
      border-color: #c3e6cb;
    }
    .health-section-title {
      padding: 7px 12px;
      font-size: 11px;
      font-weight: bold;
      background: #fce8e6;
      color: #c0392b;
    }
    .health-section.clean .health-section-title {
      background: #e6f4ea;
      color: #1e7e34;
    }
    .health-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 12px;
      font-size: 11px;
      border-top: 1px solid #f5e6e6;
    }
    .health-section.clean .health-item {
      border-top-color: #d4edda;
    }
    .health-icon { flex-shrink: 0; font-size: 13px; line-height: 1.4; }
    .health-location { font-weight: bold; color: #333; }
    .health-msg { color: #555; }

  </style>
</head>
<body>

  <!-- ════════════════════════════════════════════════════════════════════════════
       IMPORT FORM
  ════════════════════════════════════════════════════════════════════════════ -->
  <div id="importForm" style="display:flex;flex-direction:column;height:100vh;">

    <div class="modal-header">
      <h3>Import Scraper Data</h3>
      <div class="subtitle">Replaces all existing data in SCRAPERDATA. Columns are matched by header name — order doesn't matter.</div>
    </div>

    <div class="modal-body">
      <label class="field-label" for="fileInput">Select CSV File</label>
      <input type="file" id="fileInput" accept=".csv" onchange="handleFileSelect()" />

      <div class="preview-box" id="previewBox">
        <div class="preview-box-header">
          <span>Column Mapping</span>
          <span class="row-count" id="rowCountLabel"></span>
        </div>
        <div class="preview-columns">
          <div class="preview-col">
            <div class="preview-col-title match">✓ Matched</div>
            <div id="matchedList"></div>
          </div>
          <div class="preview-col">
            <div class="preview-col-title nomatch">✗ Missing (will be blank)</div>
            <div id="unmatchedList"></div>
          </div>
        </div>
        <div class="ignored-cols" id="ignoredCols" style="display:none;">
          <div class="ignored-cols-title">Ignored columns in file</div>
          <div id="ignoredList"></div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <div id="status" class="empty">&nbsp;</div>
      <button class="btn-primary" id="importBtn" onclick="runImport()" disabled>Import Data</button>
    </div>

  </div>

  <!-- ════════════════════════════════════════════════════════════════════════════
       REVIEW PANEL
  ════════════════════════════════════════════════════════════════════════════ -->
  <div id="reviewPanel" style="display:none;flex-direction:column;height:100vh;">

    <div class="modal-body">
      <div class="review-hero">
        <span class="check">✓</span>
        <div>
          <h3>Import Complete</h3>
          <div class="total" id="reviewTotal"></div>
        </div>
      </div>

      <div class="review-section">
        <div class="review-section-title">Vehicle Types</div>
        <div class="badge-row" id="reviewTypes"></div>
      </div>

      <div class="review-section">
        <div class="review-section-title">Status Values</div>
        <div class="badge-row" id="reviewStatuses"></div>
      </div>

      <hr class="divider">

      <div class="review-section">
        <div class="review-section-title">Breakdown by Location</div>
        <div id="reviewTable"></div>
      </div>

      <div id="healthSection" style="display:none;"></div>
    </div>

    <div class="modal-footer">
      <div id="statusReview" class="empty">&nbsp;</div>
      <button class="btn-secondary" onclick="resetImport()">Import Another File</button>
    </div>

  </div>

  <script>
    // Expected SCRAPERDATA column headers in order
    var EXPECTED_HEADERS = [
      'VIN', 'Stock', 'Type', 'Year', 'Make', 'Model', 'Trim',
      'Ext Color', 'Status', 'Price', 'Body Style', 'Fuel Type',
      'MSRP', 'Date In Stock', 'Street Address', 'Locality',
      'Postal Code', 'Region', 'Country', 'Location', 'Vechile URL'
    ];

    var parsedRows    = [];
    var columnMapping = [];

    // ── File select ───────────────────────────────────────────────────────────
    function handleFileSelect() {
      var file = document.getElementById('fileInput').files[0];
      if (!file) return;

      setStatus('Reading file...', 'info');
      document.getElementById('importBtn').disabled = true;
      document.getElementById('previewBox').style.display = 'none';
      parsedRows    = [];
      columnMapping = [];

      var reader    = new FileReader();
      reader.onload = function(e) {
        try {
          var result = parseCSV(e.target.result);
          if (result.length < 2) {
            setStatus('File appears empty or has no data rows.', 'error');
            return;
          }

          var fileHeaders      = result[0].map(function(h) { return h.trim(); });
          parsedRows           = result.slice(1);
          var fileHeadersLower = fileHeaders.map(function(h) { return h.toLowerCase(); });
          var expectedLower    = EXPECTED_HEADERS.map(function(h) { return h.toLowerCase(); });

          columnMapping = EXPECTED_HEADERS.map(function(expected) {
            return fileHeadersLower.indexOf(expected.toLowerCase());
          });

          var matched   = columnMapping.filter(function(i) { return i !== -1; });
          var unmatched = EXPECTED_HEADERS.filter(function(_, i) { return columnMapping[i] === -1; });
          var extraCols = fileHeaders.filter(function(h) {
            return expectedLower.indexOf(h.toLowerCase()) === -1;
          });

          // Populate matched list
          var matchedHtml = '';
          EXPECTED_HEADERS.forEach(function(name, i) {
            if (columnMapping[i] !== -1) {
              matchedHtml += '<span class="match">' + escHtml(name) + '</span><br>';
            }
          });
          document.getElementById('matchedList').innerHTML = matchedHtml || '<span style="color:#aaa">None</span>';

          // Populate unmatched list
          var unmatchedHtml = '';
          unmatched.forEach(function(name) {
            unmatchedHtml += '<span class="nomatch">' + escHtml(name) + '</span><br>';
          });
          document.getElementById('unmatchedList').innerHTML = unmatchedHtml || '<span style="color:#aaa">None — full match!</span>';

          // Ignored columns
          if (extraCols.length > 0) {
            document.getElementById('ignoredList').innerHTML =
              extraCols.map(function(h) { return escHtml(h); }).join('<br>');
            document.getElementById('ignoredCols').style.display = 'block';
          } else {
            document.getElementById('ignoredCols').style.display = 'none';
          }

          document.getElementById('rowCountLabel').textContent = parsedRows.length.toLocaleString() + ' data rows';
          document.getElementById('previewBox').style.display = 'block';

          if (matched.length === 0) {
            setStatus('No columns matched. Check that your file has the correct headers.', 'error');
          } else {
            setStatus(
              parsedRows.length.toLocaleString() + ' rows ready — ' +
              matched.length + ' columns matched' +
              (unmatched.length > 0 ? ', ' + unmatched.length + ' missing.' : '.'),
              'info'
            );
            document.getElementById('importBtn').disabled = false;
          }
        } catch(err) {
          setStatus('Error parsing file: ' + err.message, 'error');
        }
      };
      reader.onerror = function() { setStatus('Could not read file.', 'error'); };
      reader.readAsText(file);
    }

    // ── Import ────────────────────────────────────────────────────────────────
    function runImport() {
      if (parsedRows.length === 0 || columnMapping.length === 0) {
        setStatus('Please select a valid CSV file first.', 'error');
        return;
      }

      var btn = document.getElementById('importBtn');
      btn.disabled    = true;
      btn.textContent = 'Importing...';
      setStatus('Sending ' + parsedRows.length.toLocaleString() + ' rows to Google Sheets...', 'info');

      var mappedData = parsedRows.map(function(row) {
        return columnMapping.map(function(fileColIdx) {
          if (fileColIdx === -1) return '';
          var val = row[fileColIdx];
          return (val === undefined || val === null) ? '' : String(val);
        });
      });

      google.script.run
        .withSuccessHandler(function(result) {
          btn.textContent = 'Import Data';
          showReview(result);
        })
        .withFailureHandler(function(e) {
          setStatus('Error: ' + e.message, 'error');
          btn.disabled    = false;
          btn.textContent = 'Import Data';
        })
        .importScraperData(mappedData);
    }

    // ── Review panel ──────────────────────────────────────────────────────────
    function showReview(result) {
      var r = result.review;

      document.getElementById('reviewTotal').textContent =
        r.total.toLocaleString() + ' vehicles imported across ' +
        Object.keys(r.locationTypeCounts).length + ' location' +
        (Object.keys(r.locationTypeCounts).length === 1 ? '' : 's');

      // Types
      var typeKeys = Object.keys(r.typeCounts).sort();
      var knownTypes = ['New', 'PO', 'CPO', 'CPO-EL'];
      var typesEl  = document.getElementById('reviewTypes');
      typesEl.innerHTML = '';
      typeKeys.forEach(function(t) {
        var b = document.createElement('span');
        b.className   = 'badge' + (knownTypes.indexOf(t) === -1 ? ' warning' : '');
        b.textContent = t + ': ' + r.typeCounts[t].toLocaleString();
        typesEl.appendChild(b);
      });

      // Statuses
      var statusKeys = Object.keys(r.statusCounts).sort();
      var knownStatuses = ['ONLOT', 'OFFLOT'];
      var statusEl  = document.getElementById('reviewStatuses');
      statusEl.innerHTML = '';
      statusKeys.forEach(function(s) {
        var b = document.createElement('span');
        b.className   = 'badge status' + (knownStatuses.indexOf(s) === -1 ? ' warning' : '');
        b.textContent = s + ': ' + r.statusCounts[s].toLocaleString();
        statusEl.appendChild(b);
      });

      // Location × Type table
      var locations = Object.keys(r.locationTypeCounts).sort();
      var html = '<div class="table-wrap"><table>';
      html += '<tr><th>Location</th>';
      typeKeys.forEach(function(t) { html += '<th>' + escHtml(t) + '</th>'; });
      html += '<th class="total-col">Total</th></tr>';

      locations.forEach(function(loc) {
        var locData  = r.locationTypeCounts[loc];
        var locTotal = typeKeys.reduce(function(sum, t) { return sum + (locData[t] || 0); }, 0);
        html += '<tr><td title="' + escHtml(loc) + '">' + escHtml(loc) + '</td>';
        typeKeys.forEach(function(t) {
          html += '<td>' + (locData[t] ? locData[t].toLocaleString() : '') + '</td>';
        });
        html += '<td class="total-col">' + locTotal.toLocaleString() + '</td></tr>';
      });

      html += '</table></div>';
      document.getElementById('reviewTable').innerHTML = html;

      // ── Health issues ─────────────────────────────────────────────────────
      var healthEl = document.getElementById('healthSection');
      var issues   = result.healthIssues || [];
      if (issues.length === 0) {
        healthEl.style.display = 'block';
        healthEl.innerHTML =
          '<div class="health-section clean">' +
            '<div class="health-section-title">&#10003; Data Health: No issues detected</div>' +
          '</div>';
      } else {
        var hHtml = '<div class="health-section">' +
          '<div class="health-section-title">&#9888; Data Health: ' + issues.length +
          ' issue' + (issues.length === 1 ? '' : 's') + ' detected</div>';
        issues.forEach(function(issue) {
          var icon = issue.severity === 'error' ? '\uD83D\uDD34' : '\uD83D\uDFE1';
          hHtml += '<div class="health-item">' +
            '<span class="health-icon">' + icon + '</span>' +
            '<span><span class="health-location">' + escHtml(issue.location) + '</span>' +
            ' &mdash; <span class="health-msg">' + escHtml(issue.message) + '</span></span>' +
          '</div>';
        });
        hHtml += '</div>';
        healthEl.style.display = 'block';
        healthEl.innerHTML = hHtml;
      }

      document.getElementById('importForm').style.display  = 'none';
      document.getElementById('reviewPanel').style.display = 'flex';
    }

    function resetImport() {
      parsedRows    = [];
      columnMapping = [];

      document.getElementById('previewBox').style.display  = 'none';
      document.getElementById('matchedList').innerHTML     = '';
      document.getElementById('unmatchedList').innerHTML   = '';
      document.getElementById('ignoredList').innerHTML     = '';
      document.getElementById('ignoredCols').style.display = 'none';
      document.getElementById('importBtn').disabled        = true;
      document.getElementById('importBtn').textContent     = 'Import Data';
      setStatus('', 'empty');

      // File input can't be cleared by value — replace the element
      var old   = document.getElementById('fileInput');
      var clone = old.cloneNode(false);
      clone.onchange = handleFileSelect;
      old.parentNode.replaceChild(clone, old);

      document.getElementById('reviewPanel').style.display = 'none';
      document.getElementById('healthSection').style.display = 'none';
      document.getElementById('healthSection').innerHTML     = '';
      document.getElementById('importForm').style.display  = 'flex';
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function setStatus(msg, type) {
      var el       = document.getElementById('status');
      el.textContent = msg || '\u00a0';
      el.className   = type || 'empty';
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Minimal CSV parser — handles quoted fields, commas inside quotes,
    // and newlines inside quotes.
    function parseCSV(text) {
      var rows    = [];
      var row     = [];
      var field   = '';
      var inQuote = false;
      var i       = 0;

      text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

      while (i < text.length) {
        var ch = text[i];

        if (inQuote) {
          if (ch === '"') {
            if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
            else { inQuote = false; }
          } else {
            field += ch;
          }
        } else {
          if (ch === '"') {
            inQuote = true;
          } else if (ch === ',') {
            row.push(field); field = '';
          } else if (ch === '\n') {
            row.push(field); field = '';
            if (row.some(function(v) { return v !== ''; }) || rows.length === 0) {
              rows.push(row);
            }
            row = []; i++; continue;
          } else {
            field += ch;
          }
        }
        i++;
      }

      row.push(field);
      if (row.some(function(v) { return v !== ''; })) rows.push(row);

      return rows;
    }
  </script>
</body>
</html>
