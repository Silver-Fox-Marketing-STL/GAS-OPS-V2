<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: #333;
    background: #fff;
  }

  /* ── Map selector ───────────────────────────────────────────────────────── */
  .top-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid #e0e0e0;
  }
  .top-bar label { font-weight: bold; white-space: nowrap; }
  select {
    flex: 0 0 220px;
    padding: 6px 8px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  select:focus { outline: none; border-color: #1a73e8; }
  #entryCount { font-size: 12px; color: #888; }
  .order-note { font-size: 11px; color: #888; margin-left: auto; font-style: italic; }

  /* ── Add entry bar ──────────────────────────────────────────────────────── */
  .add-bar {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid #e0e0e0;
    background: #f8f9fa;
  }
  .add-field { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .add-field label { font-size: 11px; font-weight: bold; color: #555; white-space: nowrap; }
  .add-field input[type="text"] {
    padding: 6px 8px;
    font-size: 12px;
    font-family: monospace;
    border: 1px solid #ccc;
    border-radius: 4px;
    width: 100%;
  }
  .add-field input[type="text"]:focus { outline: none; border-color: #1a73e8; }
  .add-arrow { font-size: 16px; color: #bbb; padding-bottom: 7px; flex-shrink: 0; }
  .add-buttons { display: flex; gap: 6px; flex-shrink: 0; padding-bottom: 1px; }

  /* ── Status bar ─────────────────────────────────────────────────────────── */
  #status {
    font-size: 12px;
    padding: 5px 16px;
    height: 28px;
    line-height: 18px;
  }
  #status.empty   { background: none; }
  #status.info    { background: #e8f0fe; color: #1a73e8; }
  #status.success { background: #e6f4ea; color: #1e7e34; }
  #status.error   { background: #fce8e6; color: #c0392b; }

  /* ── Entries table ──────────────────────────────────────────────────────── */
  /* Height is set by JS — overflow-y: auto enables scroll once height is fixed */
  .table-wrap { overflow-y: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    background: #f1f3f4;
    padding: 7px 12px;
    text-align: left;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: #555;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  thead th.col-arrow   { width: 28px; padding: 7px 4px; }
  thead th.col-actions { text-align: center; width: 150px; white-space: nowrap; }
  tbody tr { border-bottom: 1px solid #f0f0f0; }
  tbody tr:last-child  { border-bottom: none; }
  tbody tr:hover { background: #fafafa; }
  td { padding: 5px 12px; vertical-align: middle; }
  td.col-input  { font-family: monospace; color: #444; }
  td.col-arrow  { color: #ccc; text-align: center; padding: 5px 4px; width: 28px; }
  td.col-output { font-family: monospace; font-weight: bold; color: #1a73e8; }
  td.col-actions { text-align: center; white-space: nowrap; width: 150px; }

  /* Inline edit row */
  tr.editing td { background: #f0f6ff; padding: 5px 8px; }
  .edit-input {
    width: 100%;
    padding: 4px 6px;
    font-size: 12px;
    font-family: monospace;
    border: 1px solid #1a73e8;
    border-radius: 3px;
  }
  .edit-input:focus { outline: none; }

  /* Empty / loading states */
  .state-row td { text-align: center; padding: 28px; color: #aaa; font-size: 12px; }

  /* ── Footer ─────────────────────────────────────────────────────────────── */
  .footer {
    display: flex;
    justify-content: flex-end;
    padding: 10px 16px;
    border-top: 1px solid #e0e0e0;
    background: #f8f9fa;
  }

  /* ── Buttons ─────────────────────────────────────────────────────────────── */
  button {
    padding: 6px 13px;
    font-size: 12px;
    font-weight: bold;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary         { background: #1a73e8; color: #fff; }
  .btn-primary:hover   { background: #1557b0; }
  .btn-secondary       { background: #fff; color: #333; border: 1px solid #ccc; }
  .btn-secondary:hover { background: #f1f3f4; }
  .btn-icon            { padding: 3px 8px; font-size: 12px; background: #f1f3f4; border: 1px solid #ddd; border-radius: 3px; color: #555; margin: 0 1px; }
  .btn-icon:hover      { background: #e2e5e9; }
  .btn-icon.del        { background: #fce8e6; color: #c0392b; border-color: #f5c6c2; }
  .btn-icon.del:hover  { background: #f5c6c2; }
  .btn-icon.save       { background: #e6f4ea; color: #1e7e34; border-color: #b7dfbe; }
  .btn-icon.save:hover { background: #b7dfbe; }
  button:disabled      { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

<div class="top-bar">
  <label for="mapSelect">Map:</label>
  <select id="mapSelect" onchange="onMapChange()">
    <option value="type">Type — vehicle condition</option>
    <option value="status">Status</option>
    <option value="price">Price</option>
    <option value="trim">Trim</option>
    <option value="global">Global (all columns)</option>
  </select>
  <span id="entryCount"></span>
  <span class="order-note">Rules match top-to-bottom — first match wins. Use ▲ ▼ to reorder.</span>
</div>

<div class="add-bar">
  <div class="add-field">
    <label>Raw value (from scraper)</label>
    <input type="text" id="addRaw" placeholder="e.g.  Certified Pre-Owned" />
  </div>
  <div class="add-arrow">→</div>
  <div class="add-field">
    <label>Normalized value</label>
    <input type="text" id="addNorm" placeholder="e.g.  CPO" />
  </div>
  <div class="add-buttons">
    <button class="btn-secondary" onclick="clearAddForm()">Clear</button>
    <button class="btn-primary"   onclick="addEntry()">+ Add</button>
  </div>
</div>

<div id="status" class="empty"></div>

<div class="table-wrap" id="tableWrap">
  <table>
    <thead>
      <tr>
        <th>Raw Value</th>
        <th class="col-arrow"></th>
        <th>Normalized Value</th>
        <th class="col-actions">Actions</th>
      </tr>
    </thead>
    <tbody id="entriesBody">
      <tr class="state-row"><td colspan="4">Loading…</td></tr>
    </tbody>
  </table>
</div>

<div class="footer" id="footer">
  <button class="btn-secondary" onclick="google.script.host.close()">Close</button>
</div>


<script>
  var currentMap  = 'type';
  var currentData = [];
  var editingRow  = null;

  // ── Height calculation ────────────────────────────────────────────────────
  // Explicitly set the table scroll area height based on actual element sizes.
  // This is necessary because GAS modal iframes don't propagate height: 100%
  // reliably to child elements, making CSS-only flex/overflow approaches fail.
  function sizeTable() {
    var ids    = ['status'];
    var classes = ['top-bar', 'add-bar', 'footer'];
    var used   = 0;
    ids.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) used += el.getBoundingClientRect().height;
    });
    classes.forEach(function(cls) {
      var el = document.querySelector('.' + cls);
      if (el) used += el.getBoundingClientRect().height;
    });
    var available = window.innerHeight - used - 2;
    document.getElementById('tableWrap').style.height = Math.max(available, 120) + 'px';
  }

  window.onresize = sizeTable;

  // ── Init ──────────────────────────────────────────────────────────────────
  window.onload = function() {
    sizeTable();
    loadEntries('type');
  };

  function onMapChange() {
    currentMap = document.getElementById('mapSelect').value;
    editingRow = null;
    clearAddForm();
    sizeTable();
    loadEntries(currentMap);
  }

  // ── Load ──────────────────────────────────────────────────────────────────
  function loadEntries(mapName) {
    setTbody('<tr class="state-row"><td colspan="4">Loading…</td></tr>');
    document.getElementById('entryCount').textContent = '';
    google.script.run
      .withSuccessHandler(renderEntries)
      .withFailureHandler(function(e) { setStatus(e.message, 'error'); })
      .getNormEntries(mapName);
  }

  function renderEntries(data) {
    currentData = data;
    var count   = data.length;
    document.getElementById('entryCount').textContent =
      count + (count === 1 ? ' entry' : ' entries');

    if (count === 0) {
      setTbody('<tr class="state-row"><td colspan="4">No entries yet for this map.</td></tr>');
      return;
    }

    var showOrder = true;
    var rows = '';
    data.forEach(function(entry, idx) {
      rows += (editingRow === entry.sheetRow)
        ? buildEditRow(entry)
        : buildViewRow(entry, idx, count, showOrder);
    });
    setTbody(rows);
  }

  // ── Row builders ──────────────────────────────────────────────────────────
  function buildViewRow(entry, idx, total, showOrder) {
    var actions = '';
    if (showOrder) {
      actions += mkBtn('▲', "moveEntry(" + entry.sheetRow + ",'up')",   'btn-icon', idx === 0,         'Move up');
      actions += mkBtn('▼', "moveEntry(" + entry.sheetRow + ",'down')", 'btn-icon', idx === total - 1, 'Move down');
    }
    actions += mkBtn('✏',  'startEdit('     + entry.sheetRow + ')', 'btn-icon',     false, 'Edit');
    actions += mkBtn('✕',  'confirmDelete(' + entry.sheetRow + ')', 'btn-icon del', false, 'Delete');

    return '<tr id="row-' + entry.sheetRow + '">' +
      '<td class="col-input"  title="' + esc(entry.input)  + '">' + esc(entry.input)  + '</td>' +
      '<td class="col-arrow">→</td>' +
      '<td class="col-output" title="' + esc(entry.output) + '">' + esc(entry.output) + '</td>' +
      '<td class="col-actions">' + actions + '</td>' +
      '</tr>';
  }

  function buildEditRow(entry) {
    return '<tr class="editing" id="row-' + entry.sheetRow + '">' +
      '<td><input class="edit-input" id="edit-raw-'  + entry.sheetRow + '" value="' + esc(entry.input)  + '" /></td>' +
      '<td class="col-arrow">→</td>' +
      '<td><input class="edit-input" id="edit-norm-' + entry.sheetRow + '" value="' + esc(entry.output) + '" /></td>' +
      '<td class="col-actions">' +
        mkBtn('✓ Save', 'saveEdit('   + entry.sheetRow + ')', 'btn-icon save', false, 'Save') +
        mkBtn('Cancel', 'cancelEdit()',                        'btn-icon',      false, 'Cancel') +
      '</td></tr>';
  }

  function mkBtn(label, onclick, cls, disabled, title) {
    return '<button class="' + cls + '" onclick="' + onclick + '"' +
      (disabled ? ' disabled' : '') + ' title="' + (title || '') + '">' + label + '</button>';
  }

  function startEdit(sheetRow) {
    editingRow = sheetRow;
    renderEntries(currentData);
    var el = document.getElementById('edit-raw-' + sheetRow);
    if (el) { el.focus(); el.select(); }
  }

  function cancelEdit() { editingRow = null; renderEntries(currentData); }

  // ── CRUD ──────────────────────────────────────────────────────────────────
  function addEntry() {
    var raw  = document.getElementById('addRaw').value.trim();
    var norm = document.getElementById('addNorm').value.trim();
    if (!raw || !norm) { setStatus('Both fields are required.', 'error'); return; }
    setStatus('Adding…', 'info');
    google.script.run
      .withSuccessHandler(function(data) {
        clearAddForm(); editingRow = null;
        renderEntries(data); setStatus('Entry added.', 'success');
      })
      .withFailureHandler(function(e) { setStatus(e.message, 'error'); })
      .addNormEntry(currentMap, raw, norm);
  }

  function saveEdit(sheetRow) {
    var newInput  = document.getElementById('edit-raw-'  + sheetRow).value.trim();
    var newOutput = document.getElementById('edit-norm-' + sheetRow).value.trim();
    if (!newInput || !newOutput) { setStatus('Both fields are required.', 'error'); return; }
    setStatus('Saving…', 'info');
    google.script.run
      .withSuccessHandler(function(data) {
        editingRow = null; renderEntries(data); setStatus('Entry updated.', 'success');
      })
      .withFailureHandler(function(e) { setStatus(e.message, 'error'); })
      .updateNormEntry(sheetRow, newInput, newOutput);
  }

  function confirmDelete(sheetRow) {
    var entry = null;
    for (var i = 0; i < currentData.length; i++) {
      if (currentData[i].sheetRow === sheetRow) { entry = currentData[i]; break; }
    }
    if (!entry) return;
    if (!confirm('Delete this entry?\n\n"' + entry.input + '"  →  "' + entry.output + '"')) return;
    setStatus('Deleting…', 'info');
    google.script.run
      .withSuccessHandler(function(data) {
        editingRow = null; renderEntries(data); setStatus('Entry deleted.', 'success');
      })
      .withFailureHandler(function(e) { setStatus(e.message, 'error'); })
      .deleteNormEntry(sheetRow);
  }

  function moveEntry(sheetRow, direction) {
    google.script.run
      .withSuccessHandler(function(data) {
        editingRow = null; renderEntries(data); setStatus('', 'empty');
      })
      .withFailureHandler(function(e) { setStatus(e.message, 'error'); })
      .moveNormEntry(sheetRow, direction);
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function clearAddForm() {
    document.getElementById('addRaw').value  = '';
    document.getElementById('addNorm').value = '';
  }

  function setTbody(html) { document.getElementById('entriesBody').innerHTML = html; }

  function setStatus(msg, type) {
    var el = document.getElementById('status');
    el.textContent = msg || '';
    el.className   = type || 'empty';
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
