<!-- ════════════════════════════════════════════════════════════════════════════
     VIN LOGS — the run log for a dealer (or every dealer) and what you can do
     to a run: commit it to the VIN log, roll it back, delete it, push it to
     Pipedrive, or add VINs to the log by hand.

     Rebuild increment 8a (docs/rebuild-order-desk-design.md): job-ticket idiom
     — runs as a shared .table-u, actions as ruled sections, ink outlines
     instead of cards. Every element id the JS reads is unchanged; the JS
     differs from the previous version only in the HTML it emits and in its
     user-facing strings.
════════════════════════════════════════════════════════════════════════════ -->
<div class="view" id="view-vinlog" data-layout="data" hidden>
  <div class="vl-wrap app-measure">

    <!-- ── Head: which dealer, where the log stands ─────────────────────── -->
    <div class="vl-head">
      <div class="vl-field">
        <label for="vinlogDealerSelect">Dealer</label>
        <select id="vinlogDealerSelect">
          <option value="">-- Loading dealers... --</option>
        </select>
      </div>
      <div id="latestOrderRow">
        Latest order in the log <span id="latestOrderSpan" class="tag tone-neutral">&mdash;</span>
      </div>
    </div>

    <div class="layout">

      <!-- ── Runs ──────────────────────────────────────────────────────── -->
      <div class="col-main">
        <div id="runsSection">
          <h3>Order runs</h3>
          <div id="runsContainer"><div class="loading">Loading runs&hellip;</div></div>
        </div>
      </div>

      <!-- ── Actions on the selected run + manual entry ─────────────────── -->
      <div class="col-side">

        <div id="actionPanel">
          <div class="vl-sec">
            <div class="vl-sec-h">Selected run</div>
            <div class="run-detail" id="runDetail"></div>
            <div class="action-btns">
              <button type="button" class="btn-primary" id="commitBtn"   onclick="commitRun()">Commit to VIN log</button>
              <button type="button" class="btn-danger"  id="rollbackBtn" onclick="rollbackRun()">Roll back</button>
            </div>
          </div>

          <!-- Pipedrive push / retry (shown for finalized runs — i.e. those with a deal id) -->
          <div id="pushPanel">
            <div class="vl-sec-h">Pipedrive</div>
            <div class="push-modes">
              <label><input type="radio" name="vlPushMode" value="create" checked onchange="onVlPushModeChange()"> Create new deal</label>
              <label><input type="radio" name="vlPushMode" value="link" onchange="onVlPushModeChange()"> Link existing deal</label>
            </div>
            <input type="text" id="vlPushDealId" placeholder="Existing deal ID" style="display:none;" />
            <button type="button" class="btn-primary" id="vlPushBtn" onclick="pushSelectedRun()">Push to Pipedrive</button>
          </div>
        </div>

        <!-- Manual entry (dealer mode only — the toggle is hidden for All dealers) -->
        <button type="button" id="manualToggle" onclick="toggleManualPanel()">
          Add VINs by hand <span class="arrow">&#9662;</span>
        </button>

        <div id="manualPanel">
          <label for="manualOrderId">Order number</label>
          <input type="text" id="manualOrderId" placeholder="e.g. 47350" />
          <div class="hint">The Pipedrive deal id or order number this entry belongs to.</div>

          <label for="manualVins">VINs</label>
          <textarea id="manualVins" placeholder="One VIN or stock number per line" oninput="updateVinlogVinCount()"></textarea>
          <div id="vinlogVinCount">0 VINs</div>

          <button type="button" class="btn-primary" id="manualSubmitBtn" onclick="submitManual()">Add to VIN log</button>
        </div>

        <div class="side-bottom">
          <div id="vinlogStatus" class="empty"></div>
        </div>

      </div>

    </div>
  </div>

  <!-- VIN list popup — fixed overlay, shown by showVinPopup(idx) -->
  <div id="vlVinPopup" onclick="if(event.target===this)closeVinPopup()">
    <div class="vl-popup-card">
      <p class="vl-popup-title" id="vlVinPopupTitle">VINs</p>
      <textarea id="vlVinPopupText" readonly></textarea>
      <div class="vl-popup-actions">
        <button type="button" class="btn-secondary" id="vlVinCopyBtn" onclick="vlCopyVins()">Copy</button>
        <button type="button" class="btn-secondary" onclick="closeVinPopup()">Close</button>
      </div>
    </div>
  </div>

</div>

<style>
  #view-vinlog * { box-sizing: border-box; }
  #view-vinlog {
    font-family: var(--font-body); font-size: var(--fs-body);
    height: 100%; overflow-y: auto;
    background: var(--bg); color: var(--text);
  }
  #view-vinlog .vl-wrap { padding: 18px 28px 40px; }

  /* ── Head ────────────────────────────────────────────────────────────── */
  #view-vinlog .vl-head {
    display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 20px; align-items: end;
    padding-bottom: 10px; border-bottom: var(--rule);
  }
  #view-vinlog .vl-field label { display: block; font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); margin: 0 0 4px; }
  /* The dealer picker is the loudest control on the view. CustomSelect hides
     the native <select> and paints a .cs-btn in its place, so the size has to
     be set on BOTH or it never shows. */
  #view-vinlog .vl-field select { font-family: var(--font-head); font-size: 20px; font-weight: 700; padding: 6px 10px; }
  #view-vinlog .vl-field .cs-field .cs-btn { font-family: var(--font-head); font-size: 20px; font-weight: 700; }
  #view-vinlog select, #view-vinlog input[type="text"], #view-vinlog textarea {
    width: 100%; padding: 8px; font-size: var(--fs-body); font-family: var(--font-body);
    border: 1px solid var(--border-2); border-radius: var(--radius-sm);
    background: var(--bg); color: var(--text);
  }
  #view-vinlog select:focus, #view-vinlog input[type="text"]:focus, #view-vinlog textarea:focus {
    outline: none; border-color: var(--text); box-shadow: var(--focus-ring);
  }
  #view-vinlog #latestOrderRow { display: none; padding-bottom: 6px; font-size: var(--fs-sm); color: var(--text-2); }
  #view-vinlog #latestOrderRow .tag { margin-left: 4px; font-variant-numeric: tabular-nums; }

  /* ── Two columns: runs | actions ─────────────────────────────────────── */
  #view-vinlog .layout { display: grid; grid-template-columns: 3fr 2fr; gap: 28px; align-items: start; padding-top: 16px; }
  #view-vinlog .col-main, #view-vinlog .col-side { min-width: 0; }

  /* ── Runs table ──────────────────────────────────────────────────────── */
  #view-vinlog #runsSection { display: none; flex-direction: column; min-width: 0; }
  #view-vinlog #runsSection h3 {
    font-family: var(--font-head); font-size: 16px; font-weight: 700; color: var(--text);
    margin: 0 0 8px; line-height: 1.2;
  }
  #view-vinlog #runsContainer { max-height: clamp(300px, 56vh, 700px); overflow: auto; border-bottom: 1px solid var(--border); }
  #view-vinlog #runsTable { table-layout: fixed; }
  #view-vinlog #runsTable td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
  /* Per-dealer: Timestamp / Deal ID / VINs / Status / ✕.
     All-dealers adds Dealer. Fixed widths so the columns don't jitter as the
     band widens; the SPLIT:* badge sits on its own line under the timestamp. */
  #view-vinlog #runsTable th:nth-child(1), #view-vinlog #runsTable td:nth-child(1) { width: 30%; }
  #view-vinlog #runsTable th:nth-child(2), #view-vinlog #runsTable td:nth-child(2) { width: 16%; }
  #view-vinlog #runsTable th:nth-child(3), #view-vinlog #runsTable td:nth-child(3) { width: 24%; }
  #view-vinlog #runsTable th:nth-child(4), #view-vinlog #runsTable td:nth-child(4) { width: 22%; }
  #view-vinlog #runsTable th:nth-child(5), #view-vinlog #runsTable td:nth-child(5) { width: 8%; text-align: right; }
  #view-vinlog #runsTable.with-dealer th:nth-child(1), #view-vinlog #runsTable.with-dealer td:nth-child(1) { width: 22%; }
  #view-vinlog #runsTable.with-dealer th:nth-child(2), #view-vinlog #runsTable.with-dealer td:nth-child(2) { width: 29%; }
  #view-vinlog #runsTable.with-dealer th:nth-child(3), #view-vinlog #runsTable.with-dealer td:nth-child(3) { width: 10%; }
  #view-vinlog #runsTable.with-dealer th:nth-child(4), #view-vinlog #runsTable.with-dealer td:nth-child(4) { width: 17%; }
  #view-vinlog #runsTable.with-dealer th:nth-child(5), #view-vinlog #runsTable.with-dealer td:nth-child(5) { width: 16%; text-align: left; }
  #view-vinlog #runsTable.with-dealer th:nth-child(6), #view-vinlog #runsTable.with-dealer td:nth-child(6) { width: 7%; text-align: right; }
  #view-vinlog #runsTable tbody tr { cursor: pointer; }
  #view-vinlog #runsTable tbody tr.selected td { background: var(--surface); }
  #view-vinlog #runsTable tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  #view-vinlog #runsTable td.vl-x-cell { padding-left: 0; padding-right: 6px; }
  #view-vinlog .vl-dim { color: var(--text-muted); }
  /* Billing-split note — its own line under the timestamp so it never fights
     the stamp for width (a block child breaks the line inside the nowrap cell). */
  #view-vinlog .vl-note-badge { display: block; width: fit-content; margin-top: 3px; }

  /* In-row controls read as text, not chrome. */
  #view-vinlog .vl-show-vins-btn {
    background: none; border: 0; padding: 0; margin-left: 8px;
    font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 600;
    color: var(--accent); cursor: pointer; line-height: 1.4;
  }
  #view-vinlog .vl-show-vins-btn:hover { text-decoration: underline; }
  #view-vinlog .vl-delete-btn {
    background: none; border: 0; padding: 2px 4px;
    font-family: var(--font-body); font-size: var(--fs-sm); line-height: 1;
    color: var(--text-3); cursor: pointer;
  }
  #view-vinlog .vl-delete-btn:hover { color: var(--danger); }
  #view-vinlog .vl-delete-btn:disabled { opacity: .5; cursor: default; }

  #view-vinlog .empty-msg { color: var(--text-3); font-size: var(--fs-sm); padding: 14px 0; }
  #view-vinlog .loading   { color: var(--text-3); font-size: var(--fs-sm); padding: 14px 0; }

  /* ── Action panel — ruled sections, no cards ─────────────────────────── */
  #view-vinlog #actionPanel { display: none; }
  #view-vinlog .vl-sec-h {
    font-family: var(--font-head); font-size: 16px; font-weight: 700; color: var(--text);
    padding-bottom: 5px; margin-bottom: 8px; border-bottom: 1px solid var(--text);
  }
  #view-vinlog .run-detail { font-size: var(--fs-sm); line-height: 1.8; color: var(--text-2); font-variant-numeric: tabular-nums; }
  #view-vinlog .run-detail strong { color: var(--text); font-weight: 600; }
  #view-vinlog .action-btns { display: flex; gap: 10px; margin-top: 12px; }
  #view-vinlog .action-btns button { flex: 1; }

  #view-vinlog #pushPanel { display: none; margin-top: 18px; }
  #view-vinlog .push-modes { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 8px; }
  #view-vinlog .push-modes label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: var(--fs-sm); color: var(--text-2); cursor: pointer;
  }
  #view-vinlog .push-modes input[type="radio"] { width: auto; margin: 0; cursor: pointer; accent-color: var(--accent); }
  #view-vinlog #vlPushDealId { font-family: var(--font-mono); letter-spacing: .02em; margin-bottom: 8px; }
  #view-vinlog #vlPushBtn { width: 100%; }

  /* ── Manual entry — a ruled form under its own heading ───────────────── */
  #view-vinlog #manualToggle {
    display: none; width: 100%; margin-top: 22px; padding: 10px 0;
    background: none; border: 0; border-top: var(--rule);
    font-family: var(--font-head); font-size: 16px; font-weight: 700; color: var(--text);
    text-align: left; cursor: pointer;
  }
  #view-vinlog #manualToggle:hover { color: var(--accent); }
  #view-vinlog #manualToggle .arrow { float: right; font-size: 13px; color: var(--text-2); transition: transform .15s ease; }
  #view-vinlog #manualToggle.open .arrow { transform: rotate(180deg); }
  #view-vinlog #manualPanel { display: none; padding: 2px 0 6px; }
  #view-vinlog #manualPanel label { display: block; font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); margin: 12px 0 4px; }
  #view-vinlog #manualPanel .hint { margin-top: 4px; font-size: var(--fs-hint); color: var(--text-3); }
  #view-vinlog #manualOrderId { font-family: var(--font-mono); letter-spacing: .02em; }
  #view-vinlog #manualVins {
    min-height: 150px; max-height: 320px; resize: vertical;
    font-family: var(--font-mono); font-size: 12px; line-height: 1.7;
  }
  #view-vinlog #vinlogVinCount { margin-top: 4px; text-align: right; font-size: var(--fs-hint); color: var(--text-3); font-variant-numeric: tabular-nums; }
  #view-vinlog #manualSubmitBtn { width: 100%; margin-top: 12px; }

  /* ── Status line — setVinlogStatus REPLACES className, so every base rule
     has to hang off the id alone. ─────────────────────────────────────── */
  #view-vinlog .side-bottom { margin-top: 18px; }
  #view-vinlog #vinlogStatus {
    min-height: 18px; padding: 5px 0 5px 10px;
    font-size: var(--fs-sm); border-left: 3px solid transparent;
  }
  #view-vinlog #vinlogStatus.error   { border-left-color: var(--danger);  color: var(--danger); }
  #view-vinlog #vinlogStatus.success { border-left-color: var(--success); color: var(--success); }
  #view-vinlog #vinlogStatus.info    { border-left-color: var(--accent);  color: var(--accent); }
  #view-vinlog #vinlogStatus.empty   { border-left-color: transparent;    color: var(--text-2); }

  /* ── VIN popup — an ink outline (--shadow-lg IS the 1px outline) ─────── */
  #vlVinPopup {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.45);   /* scrim — intentional literal, same as SharedUtils' dialog backdrop */
    align-items: center; justify-content: center;
  }
  #vlVinPopup .vl-popup-card {
    width: 380px; max-height: 70vh; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
    background: var(--bg); color: var(--text); box-shadow: var(--shadow-lg);
  }
  #vlVinPopup .vl-popup-title { margin: 0; font-family: var(--font-head); font-size: 18px; font-weight: 700; color: var(--text); }
  #vlVinPopup #vlVinPopupText {
    flex: 1; min-height: 150px; resize: none; padding: 8px;
    font-family: var(--font-mono); font-size: 12px; line-height: 1.8;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  #vlVinPopup .vl-popup-actions { display: flex; gap: 8px; justify-content: flex-end; }

  /* ── Mobile (data-viewport="mobile") — one column; the table scrolls in
     its own box (the shell no longer carries this view's stacking). ───── */
  :root[data-viewport="mobile"] #view-vinlog .vl-wrap { padding: 14px 16px 40px; }
  :root[data-viewport="mobile"] #view-vinlog .vl-head { grid-template-columns: 1fr; align-items: start; gap: 10px; }
  :root[data-viewport="mobile"] #view-vinlog .layout { grid-template-columns: 1fr; gap: 20px; }
  :root[data-viewport="mobile"] #view-vinlog #runsContainer { overflow-x: auto; max-height: 52vh; }
  :root[data-viewport="mobile"] #view-vinlog #runsTable { table-layout: auto; min-width: 520px; }
  :root[data-viewport="mobile"] #vlVinPopup .vl-popup-card { width: 92vw; max-width: 380px; }
</style>

<script>
    var selectedRun = null;
    var manualPanelOpen = false;
    var vinlogDealersLoaded   = false;
    var pendingPreselectKey   = null;  // set by cross-view jumps before dealers load

    // ── Init (lazy — first nav into the view) ────────────────────────────────
    // Dealer list comes from the shared AppData bootstrap (one server call per
    // session instead of a second getActiveDealersForUI execution).
    function initVinlogView() {
      // Listeners FIRST: AppData.get fires synchronously once the App's
      // prefetch has landed (always, by the time you leave Home), and the
      // callback dispatches the initial All-Dealers 'change' — registering the
      // listener afterwards left the runs list empty on first visit
      // (Sep 2026 screenshot audit).
      registerVinlogListeners();

      AppData.get(function(data, err) {
        if (!data) {
          document.getElementById('vinlogDealerSelect').innerHTML = '<option value="">Error loading dealers</option>';
          setVinlogStatus('Could not load dealer list: ' + (err && err.message ? err.message : 'unknown error'), 'error');
          return;
        }
        var sel = document.getElementById('vinlogDealerSelect');
        sel.innerHTML = '<option value="">-- All Dealers --</option>';
        data.dealers.forEach(function(d) {
          var opt = document.createElement('option');
          opt.value = d.key; opt.text = d.name;
          sel.appendChild(opt);
        });
        vinlogDealersLoaded = true;
        if (pendingPreselectKey) {
          var key = pendingPreselectKey;
          pendingPreselectKey = null;
          vinlogPreselectDealer(key);
        } else {
          sel.dispatchEvent(new Event('change'));   // initial All-Dealers load
        }
      });
    }

    window.VIEW_INITS = window.VIEW_INITS || {};
    VIEW_INITS['view-vinlog'] = initVinlogView;

    // Cross-view jump support (Run Order → "Update VIN Log"): selects the
    // dealer and fires the normal change flow. If the dealer list is still
    // loading, the key is stashed and applied when the load completes.
    function vinlogPreselectDealer(key) {
      if (!key) return;
      if (!vinlogDealersLoaded) { pendingPreselectKey = key; return; }
      var sel = document.getElementById('vinlogDealerSelect');
      sel.value = key;
      sel.dispatchEvent(new Event('change'));
    }

    function registerVinlogListeners() {
      document.getElementById('vinlogDealerSelect').addEventListener('change', function() {
      var key = this.value;
      selectedRun = null;
      hideActionPanel();
      setVinlogStatus('', 'empty');
      resetManualPanel();

      if (!key) {
        // All Dealers — show the full run log; latest-order + manual entry
        // need a specific dealer, so those stay hidden.
        document.getElementById('latestOrderRow').style.display = 'none';
        document.getElementById('manualToggle').style.display = 'none';
        loadRuns('');
        return;
      }

      loadRuns(key);
      loadLatestOrderId(key);

      document.getElementById('manualToggle').style.display = 'block';
      });
    }

    // ── Latest order number ─────────────────────────────────────────────────
    function loadLatestOrderId(dealerKey) {
      var row = document.getElementById('latestOrderRow');
      var span = document.getElementById('latestOrderSpan');
      row.style.display = 'block';
      span.textContent = '…';

      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.latestOrderId) {
            span.textContent = result.latestOrderId;
            // Pre-fill the manual order field with the next suggested number.
            // Only pre-fill if it looks purely numeric (Pipedrive sequential IDs).
            // Pipedrive IDs are non-sequential so we don't auto-increment those —
            // for numeric-looking values we suggest +1 as a convenience hint only.
            var val = String(result.latestOrderId).trim();
            var asNum = parseInt(val, 10);
            if (!isNaN(asNum) && String(asNum) === val) {
              document.getElementById('manualOrderId').value = String(asNum + 1);
              document.getElementById('manualOrderId').placeholder = 'e.g. ' + String(asNum + 1);
            } else {
              document.getElementById('manualOrderId').value = '';
              document.getElementById('manualOrderId').placeholder = val + ' (copy or enter new)';
            }
          } else {
            span.textContent = 'none';
            document.getElementById('manualOrderId').value = '';
          }
        })
        .withFailureHandler(function(e) {
          span.textContent = '—';
          setVinlogStatus('Could not read latest order ID: ' + e.message, 'error');
        })
        .getLatestOrderId(dealerKey);
    }

    // ── Load runs for selected dealer ───────────────────────────────────────
    function loadRuns(dealerKey) {
      var section = document.getElementById('runsSection');
      section.style.display = 'flex';  // flex column — runs list fills the left column and scrolls
      document.getElementById('runsContainer').innerHTML = '<div class="loading">Loading runs…</div>';

      google.script.run
        .withSuccessHandler(function(runs) { renderRunsTable(runs); })
        .withFailureHandler(function(e) {
          document.getElementById('runsContainer').innerHTML =
            '<div class="empty-msg">Error loading runs: ' + e.message + '</div>';
        })
        .getRunsForDealer(dealerKey);
    }

    function renderRunsTable(runs) {
      var container = document.getElementById('runsContainer');
      var allMode = !document.getElementById('vinlogDealerSelect').value;
      if (!runs || runs.length === 0) {
        container.innerHTML = '<div class="empty-msg">' +
          (allMode ? 'No runs found.' : 'No runs found for this dealer.') + '</div>';
        return;
      }

      var html = '<table id="runsTable" class="table-u' + (allMode ? ' with-dealer' : '') + '"><thead><tr>' +
        '<th>Timestamp</th>' + (allMode ? '<th>Dealer</th>' : '') +
        '<th>Deal ID</th><th>VINs</th><th>Status</th><th></th>' +
        '</tr></thead><tbody>';

      runs.forEach(function(run, idx) {
        // The raw RUN_LOG col-W value is a snake_case key and .tag uppercases
        // whatever it is given, so 'rolled_back' would print ROLLED_BACK.
        var status = run.status || 'pending';
        var tone = status === 'committed' ? 'tone-success'
                 : status === 'rolled_back' ? 'tone-neutral'
                 : 'tone-warning';
        var statusLabel = status === 'rolled_back' ? 'Rolled back' : status;
        // Billing-split runs write two rows sharing a timestamp — the SPLIT:*
        // note badge is what tells them apart (e.g. SPLIT:PRIMARY / SPLIT:SPRINTER).
        var noteBadge = (run.note && run.note.indexOf('SPLIT:') === 0)
          ? '<span class="tag tone-info vl-note-badge">' + escHtml(run.note) + '</span>'
          : '';
        var vinCell = run.vinCount +
          (run.producedVins && run.producedVins.length
            ? ' <button type="button" class="vl-show-vins-btn" onclick="event.stopPropagation();showVinPopup(' + idx + ')">Show VINs</button>'
            : '');
        html += '<tr data-idx="' + idx + '" onclick="selectRun(' + idx + ', this)">' +
          '<td>' + run.timestamp + noteBadge + '</td>' +
          (allMode ? '<td title="' + escHtml(run.dealerName || run.dealerKey || '') + '">' +
            escHtml(run.dealerName || run.dealerKey || '—') + '</td>' : '') +
          '<td class="mono">' + (run.dealId || '<span class="vl-dim">—</span>') + '</td>' +
          '<td>' + vinCell + '</td>' +
          '<td><span class="tag ' + tone + '">' + escHtml(statusLabel) + '</span></td>' +
          '<td class="vl-x-cell"><button type="button" class="vl-delete-btn" title="Delete this run" onclick="event.stopPropagation();deleteRunRow(' + idx + ', this)">✕</button></td>' +
          '</tr>';
      });

      html += '</tbody></table>';
      container.innerHTML = html;
      container._runs = runs;
    }

    function selectRun(idx, row) {
      var prev = document.querySelector('#runsTable tr.selected');
      if (prev) prev.classList.remove('selected');
      row.classList.add('selected');
      selectedRun = document.getElementById('runsContainer')._runs[idx];
      showActionPanel(selectedRun);
    }

    // ── Action panel ────────────────────────────────────────────────────────
    function showActionPanel(run) {
      var panel       = document.getElementById('actionPanel');
      var detail      = document.getElementById('runDetail');
      var commitBtn   = document.getElementById('commitBtn');
      var rollbackBtn = document.getElementById('rollbackBtn');
      var status      = run.status || 'pending';

      var allMode = !document.getElementById('vinlogDealerSelect').value;
      detail.innerHTML =
        (allMode && run.dealerName ? '<strong>Dealer:</strong> ' + escHtml(run.dealerName) + '<br>' : '') +
        '<strong>Timestamp:</strong> ' + run.timestamp + '<br>' +
        '<strong>Deal ID:</strong> '   + (run.dealId || '—') + '<br>' +
        '<strong>VINs:</strong> '      + run.vinCount + ' vehicle' + (run.vinCount === 1 ? '' : 's');

      if (run.note && run.note.indexOf('SPLIT:') === 0) {
        detail.innerHTML += '<br><strong>Billing group:</strong> ' + run.note;
      }

      if (run.vinCount === 0) {
        detail.innerHTML += '<br><em style="color:var(--danger)">No VINs recorded for this run.</em>';
      }

      // Test runs (col-D deal id === 'test') can never be committed to the VIN log
      // — the backend throws for them. Flag it and keep Commit disabled.
      var isTest = vinlogIsTestRun_(run);
      if (isTest) {
        detail.innerHTML += '<br><em style="color:var(--text-muted)">Test run — cannot be committed to the VIN log.</em>';
      }

      if (status === 'pending') {
        commitBtn.disabled   = isTest || (run.vinCount === 0);
        rollbackBtn.disabled = true;
      } else if (status === 'committed') {
        commitBtn.disabled   = true;
        rollbackBtn.disabled = false;
      } else if (status === 'rolled_back') {
        commitBtn.disabled   = !isTest ? false : true;   // a test run can't re-commit
        rollbackBtn.disabled = true;
      }

      panel.style.display = 'block';
      setVinlogStatus('', 'empty');
      updatePushPanel(run);
    }

    // True when the run's col-D deal id marks it a test run.
    function vinlogIsTestRun_(run) {
      return !!(run && run.dealId && String(run.dealId).trim().toLowerCase() === 'test');
    }

    // The Pipedrive push action is offered only for finalized runs (those that
    // carry a Deal ID — RUN_LOG never has a finalized row without one).
    function updatePushPanel(run) {
      var pushPanel = document.getElementById('pushPanel');
      var hasDeal = !!(run && run.dealId);
      pushPanel.style.display = hasDeal ? 'block' : 'none';
      if (!hasDeal) return;
      // Reset controls to defaults each time a run is selected.
      var createRadio = document.querySelector('input[name="vlPushMode"][value="create"]');
      if (createRadio) createRadio.checked = true;
      document.getElementById('vlPushDealId').value = '';
      document.getElementById('vlPushDealId').style.display = 'none';
      var btn = document.getElementById('vlPushBtn');
      btn.disabled = false;
      btn.textContent = 'Push to Pipedrive';
    }

    function onVlPushModeChange() {
      var checked = document.querySelector('input[name="vlPushMode"]:checked');
      var mode = checked ? checked.value : 'create';
      document.getElementById('vlPushDealId').style.display = (mode === 'link') ? 'block' : 'none';
    }

    function pushSelectedRun() {
      if (!selectedRun) return;
      // The run's own dealer — the select is '' in All-Dealers mode.
      var dealerKey = selectedRun.dealerKey || document.getElementById('vinlogDealerSelect').value;
      var checked = document.querySelector('input[name="vlPushMode"]:checked');
      var mode = checked ? checked.value : 'create';
      var existingDealId = '';
      if (mode === 'link') {
        existingDealId = document.getElementById('vlPushDealId').value.trim();
        if (!existingDealId) {
          setVinlogStatus('Enter the existing Deal ID to link.', 'error');
          return;
        }
      }

      var btn = document.getElementById('vlPushBtn');
      btn.disabled = true; btn.textContent = 'Pushing...';
      setVinlogStatus('Pushing run to Pipedrive...', 'info');

      google.script.run
        .withSuccessHandler(function(res) {
          res = res || {};
          btn.textContent = 'Push to Pipedrive';
          if (res.ok) {
            btn.disabled = true;   // idempotent done — keep disabled to discourage re-push
            toast(res.message || 'Pushed to Pipedrive.', 'success');
            setVinlogStatus((res.message || 'Pushed to Pipedrive.') +
              (res.dealId != null ? ' (deal #' + res.dealId + ')' : ''), 'success');
          } else {
            // The push button IS the retry control here, so re-enable it only when
            // the failure is retryable. A deactivated mapped product (stage
            // 'inactive_product', retryable:false) blocks before any deal is made —
            // keep the button disabled and nudge toward fixing the mapping.
            var msg = res.message || 'Pipedrive push failed.';
            if (res.stage === 'inactive_product') {
              msg += ' Fix the product mapping in Dealer Rules → Pipedrive, then push again.';
            } else if (res.retryable) {
              msg += ' You can retry.';
            }
            btn.disabled = !res.retryable;
            toast(res.message || 'Pipedrive push failed.', 'error');
            setVinlogStatus(msg, 'error');
          }
        })
        .withFailureHandler(function(e) {
          btn.disabled = false; btn.textContent = 'Push to Pipedrive';
          toast('Pipedrive push error: ' + e.message, 'error');
          setVinlogStatus('Pipedrive push error: ' + e.message + ' — you can retry.', 'error');
        })
        .pushRunToPipedrive(dealerKey, selectedRun.rowIndex, mode, existingDealId || null);
    }

    function hideActionPanel() {
      document.getElementById('actionPanel').style.display = 'none';
      document.getElementById('pushPanel').style.display = 'none';
      selectedRun = null;
    }

    // ── Commit ──────────────────────────────────────────────────────────────
    function commitRun() {
      if (!selectedRun) return;
      if (!selectedRun.dealId) {
        setVinlogStatus('This run has no Deal ID. Cannot commit without a Deal ID.', 'error');
        return;
      }
      // Defense-in-depth: test runs aren't committable (the button is disabled, but
      // never call the backend for one — it throws).
      if (vinlogIsTestRun_(selectedRun)) {
        setVinlogStatus('This is a test run — it cannot be committed to the VIN log.', 'error');
        return;
      }

      // The run's own dealer — the select is '' in All-Dealers mode.
      var sel = document.getElementById('vinlogDealerSelect');
      var dealerKey  = selectedRun.dealerKey || sel.value;
      var dealerName = selectedRun.dealerName || sel.options[sel.selectedIndex].text;
      var btn = document.getElementById('commitBtn');
      btn.disabled = true; btn.textContent = 'Committing...';
      setVinlogStatus('Writing ' + selectedRun.vinCount + ' VINs to log...', 'info');

      google.script.run
        .withSuccessHandler(function(result) {
          setVinlogStatus('Committed ' + result.committed + ' VINs to the ' +
            dealerName + ' VIN log.', 'success');
          btn.textContent = 'Commit to VIN log';
          loadRuns(sel.value);                          // reload whatever view mode is showing
          if (sel.value) loadLatestOrderId(sel.value);  // latest-order row is dealer-mode only
        })
        .withFailureHandler(function(e) {
          setVinlogStatus('Commit failed: ' + e.message, 'error');
          btn.disabled = false; btn.textContent = 'Commit to VIN log';
        })
        .commitRunToVINLog(dealerKey, selectedRun.rowIndex, selectedRun.dealId, selectedRun.producedVins, selectedRun.timestamp);
    }

    // ── Rollback ────────────────────────────────────────────────────────────
    function rollbackRun() {
      if (!selectedRun) return;

      // The run's own dealer — the select is '' in All-Dealers mode.
      var sel = document.getElementById('vinlogDealerSelect');
      var dealerKey  = selectedRun.dealerKey || sel.value;
      var dealerName = selectedRun.dealerName || sel.options[sel.selectedIndex].text;
      var btn = document.getElementById('rollbackBtn');

      btn.disabled = true; btn.textContent = 'Rolling back...';
      setVinlogStatus('Looking up committed_at timestamp...', 'info');

      google.script.run
        .withSuccessHandler(function(committedAt) {
          if (!committedAt) {
            setVinlogStatus('Could not find committed entries for this run in the VIN log.', 'error');
            btn.disabled = false; btn.textContent = 'Roll back';
            return;
          }
          setVinlogStatus('Removing entries from VIN log...', 'info');

          google.script.run
            .withSuccessHandler(function(result) {
              setVinlogStatus('Rolled back ' + result.removed + ' entries from the ' +
                dealerName + ' VIN log.', 'success');
              btn.textContent = 'Roll back';
              loadRuns(sel.value);                          // reload whatever view mode is showing
              if (sel.value) loadLatestOrderId(sel.value);  // latest-order row is dealer-mode only
            })
            .withFailureHandler(function(e) {
              setVinlogStatus('Rollback failed: ' + e.message, 'error');
              btn.disabled = false; btn.textContent = 'Roll back';
            })
            .rollbackRunFromVINLog(dealerKey, selectedRun.rowIndex, selectedRun.dealId, committedAt);
        })
        .withFailureHandler(function(e) {
          setVinlogStatus('Error fetching committed_at: ' + e.message, 'error');
          btn.disabled = false; btn.textContent = 'Roll back';
        })
        .getCommittedAt(dealerKey, selectedRun.dealId);
    }

    // ── Delete (soft: RUN_LOG col W = 'deleted'; committed runs roll back first) ──
    function deleteRunRow(idx, btn) {
      var run = document.getElementById('runsContainer')._runs[idx];
      if (!run) return;
      var sel = document.getElementById('vinlogDealerSelect');
      var dealerKey  = run.dealerKey || sel.value;
      var dealerName = run.dealerName || sel.options[sel.selectedIndex].text;

      var msg = 'Delete the ' + run.timestamp + ' run (Deal ' + (run.dealId || '—') + ') for ' + dealerName + '?';
      if (run.status === 'committed') {
        msg += '\n\nThis run is committed — its ' + run.vinCount + ' VIN' + (run.vinCount === 1 ? '' : 's') +
               ' will also be removed from the VIN log.';
      }
      appConfirm(msg, { title: 'Delete run?', okLabel: 'Delete', tone: 'danger' }).then(function(ok) {
        if (!ok) return;

        btn.disabled = true;
        setVinlogStatus('Deleting run...', 'info');
        google.script.run
          .withSuccessHandler(function(result) {
            setVinlogStatus('Deleted run' + (result.removed ? ' and removed ' + result.removed + ' VINs from the ' + dealerName + ' VIN log' : '') + '.', 'success');
            if (selectedRun && selectedRun.rowIndex === run.rowIndex) hideActionPanel();
            loadRuns(sel.value);
            if (sel.value) loadLatestOrderId(sel.value);
          })
          .withFailureHandler(function(e) {
            setVinlogStatus('Delete failed: ' + e.message, 'error');
            btn.disabled = false;
          })
          .deleteRun(dealerKey, run.rowIndex, run.dealId, run.timestamp);
      });
    }

    // ── Manual entry ────────────────────────────────────────────────────────
    function toggleManualPanel() {
      manualPanelOpen = !manualPanelOpen;
      var toggle = document.getElementById('manualToggle');
      var panel  = document.getElementById('manualPanel');
      toggle.classList.toggle('open', manualPanelOpen);
      panel.style.display = manualPanelOpen ? 'block' : 'none';
    }

    function resetManualPanel() {
      manualPanelOpen = false;
      document.getElementById('manualToggle').classList.remove('open');
      document.getElementById('manualPanel').style.display = 'none';
      document.getElementById('manualOrderId').value = '';
      document.getElementById('manualVins').value = '';
      document.getElementById('vinlogVinCount').textContent = '0 VINs';
    }

    function updateVinlogVinCount() {
      var raw  = document.getElementById('manualVins').value;
      var vins = parseVins(raw);
      var n    = vins.length;
      document.getElementById('vinlogVinCount').textContent = n + ' VIN' + (n === 1 ? '' : 's');
    }

    function parseVins(raw) {
      return raw.split(/[\n,]+/)
        .map(function(v) { return v.trim().toUpperCase(); })
        .filter(function(v) { return v !== ''; });
    }

    function submitManual() {
      var dealerKey = document.getElementById('vinlogDealerSelect').value;
      if (!dealerKey) { setVinlogStatus('Select a dealer first.', 'error'); return; }

      var orderId = document.getElementById('manualOrderId').value.trim();
      if (!orderId) { setVinlogStatus('Enter an order number before submitting.', 'error'); return; }

      var vins = parseVins(document.getElementById('manualVins').value);
      if (vins.length === 0) { setVinlogStatus('Enter at least one VIN or stock number.', 'error'); return; }

      var btn = document.getElementById('manualSubmitBtn');
      btn.disabled = true; btn.textContent = 'Adding ' + vins.length + ' VIN' + (vins.length === 1 ? '' : 's') + '...';
      setVinlogStatus('Writing to VIN log...', 'info');

      google.script.run
        .withSuccessHandler(function(result) {
          setVinlogStatus('Added ' + result.committed + ' VIN' + (result.committed === 1 ? '' : 's') +
            ' to the VIN log under order ' + orderId + '.', 'success');
          btn.disabled = false; btn.textContent = 'Add to VIN log';
          // Clear the textarea but keep the order number in case user wants to add more
          document.getElementById('manualVins').value = '';
          document.getElementById('vinlogVinCount').textContent = '0 VINs';
          loadLatestOrderId(dealerKey); // refresh latest order display
        })
        .withFailureHandler(function(e) {
          setVinlogStatus('Failed: ' + e.message, 'error');
          btn.disabled = false; btn.textContent = 'Add to VIN log';
        })
        .manualCommitToVINLog(dealerKey, orderId, vins);
    }

    function setVinlogStatus(msg, type) {
      var el = document.getElementById('vinlogStatus');
      el.textContent = msg; el.className = type || 'empty';
    }

    function showVinPopup(idx) {
      var runs = document.getElementById('runsContainer')._runs;
      var run = runs[idx];
      var vins = run.producedVins || [];
      document.getElementById('vlVinPopupTitle').textContent =
        'VINs – Deal ' + (run.dealId || '—') + ' (' + vins.length + ')';
      document.getElementById('vlVinPopupText').value = vins.join('\n');
      document.getElementById('vlVinCopyBtn').textContent = 'Copy';
      document.getElementById('vlVinPopup').style.display = 'flex';
    }

    function closeVinPopup() {
      document.getElementById('vlVinPopup').style.display = 'none';
    }

    function vlCopyVins() {
      var ta = document.getElementById('vlVinPopupText');
      ta.select();
      try { document.execCommand('copy'); } catch (_e) {}
      var btn = document.getElementById('vlVinCopyBtn');
      btn.textContent = 'Copied';
      setTimeout(function() { btn.textContent = 'Copy'; }, 1600);
    }
</script>
