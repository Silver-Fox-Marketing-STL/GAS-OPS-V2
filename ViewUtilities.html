<!-- ════════════════════════════════════════════════════════════════════════════
     UTILITIES VIEW — maintenance actions (moved off the Home page)
════════════════════════════════════════════════════════════════════════════ -->
<div class="view" id="view-utilities" hidden>
  <div class="util-scroll">

    <div class="util-intro">One-off maintenance actions. Each runs on the server and reports back here.</div>

    <div class="util-group">
      <div class="util-group-label">Data &amp; Reference</div>
      <div class="util-list">
        <button class="util-btn" onclick="runUtility(this, 'fillScraperDateTime')">&#8635; Update Scraper Timestamp</button>
        <button class="util-btn" onclick="runUtility(this, 'appRefreshNormReference')">&#128270; Refresh Norm/Field Reference</button>
        <button class="util-btn" onclick="runUtility(this, 'appOpenRunLog')">&#128202; View Run Log</button>
      </div>
    </div>

    <div class="util-group">
      <div class="util-group-label">Cleanup</div>
      <div class="util-list">
        <button class="util-btn danger" onclick="confirmUtility(this, 'appEraseAllQRFolders', 'Clear the QR folders for ALL active dealers?')">&#129529; Clear QR Folders</button>
        <button class="util-btn danger" onclick="confirmUtility(this, 'appCleanUpOutputDocs', 'Trash output docs older than 30 days?')">&#128465; Clean Up Old Output Docs</button>
      </div>
    </div>

  </div>
</div>

<style>
  #view-utilities .util-scroll { height: 100%; overflow-y: auto; padding: 22px 26px; }
  #view-utilities .util-intro { font-size: 12.5px; color: #777; margin-bottom: 22px; }
  #view-utilities .util-group { margin-bottom: 24px; }
  #view-utilities .util-group-label {
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #888;
    margin-bottom: 10px;
  }
  #view-utilities .util-list { display: flex; flex-wrap: wrap; gap: 10px; }
  #view-utilities .util-btn {
    padding: 10px 16px;
    background: #fff;
    color: #444;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 12.5px;
    font-weight: bold;
    cursor: pointer;
  }
  #view-utilities .util-btn:hover:not(:disabled) { background: #f1f3f4; border-color: #999; }
  #view-utilities .util-btn:disabled { opacity: 0.45; cursor: default; }
  #view-utilities .util-btn.danger { border-color: #e0b4b0; color: #b03a2e; }
  #view-utilities .util-btn.danger:hover:not(:disabled) { background: #fbeae8; border-color: #c0392b; }
</style>

<script>
  // Runs a server utility and toasts its {message}. The button is disabled
  // while the call is in flight so double-clicks can't double-run it.
  function runUtility(btn, serverFn) {
    var original = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = 'Working…';
    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false;
        btn.innerHTML = original;
        toast((result && result.message) ? result.message : 'Done.',
              (result && result.ok === false) ? 'error' : 'success');
      })
      .withFailureHandler(function(e) {
        btn.disabled = false;
        btn.innerHTML = original;
        toast('Error: ' + e.message, 'error');
      })[serverFn]();
  }

  // Destructive utilities get a confirm first.
  function confirmUtility(btn, serverFn, prompt) {
    if (confirm(prompt)) runUtility(btn, serverFn);
  }
</script>
