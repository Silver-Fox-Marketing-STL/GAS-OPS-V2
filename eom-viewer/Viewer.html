<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    /* ══════════════════════════════════════════════════════════════════════
       DESIGN TOKENS — DELIBERATE COPY of the main app's SharedUtils token
       blocks, PALETTE-ONLY and trimmed: structural themes (top-rail, luna) and
       the axis/measure/shell tokens are dropped — this standalone page has no
       app shell for them to style. Re-sync BY HAND when the main app's palettes
       change; NOT checksum-guarded (unlike EomReportRenderer.html). Every id
       here must appear in Theme.themes below (and vice versa).
       ══════════════════════════════════════════════════════════════════════ */
    :root {
      color-scheme: light;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      --bg: #ffffff;
      --surface: #f7f5f2;
      --surface-2: #efeae4;
      --surface-3: #e7e1da;
      --text: #221a14;
      --text-2: #5c544c;
      --text-3: #8d8d92;
      --text-muted: #a9a6a2;
      --border: #e7e1da;
      --border-2: #d9d3cd;
      --accent: #fd410d;
      --accent-hover: #d8350a;
      --accent-active: #a52b0f;
      --accent-weak: rgba(253,65,13,.08);
      --accent-weak-2: rgba(253,65,13,.15);
      --on-accent: #ffffff;
      --success: #1e7e34; --success-weak: #e6f4ea; --on-success: #ffffff;
      --danger:  #c0392b; --danger-weak:  #fce8e6; --on-danger:  #ffffff;
      --warning: #b8860b; --warning-weak: #fff7e0; --warning-strong: #8a6400;
      --info:    #2563a8; --info-weak:    #e7eef7;
      --radius-sm: 5px;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow: 0 2px 10px rgba(34,9,1,.10);
      --shadow-lg: 0 6px 24px rgba(34,9,1,.16);
      --focus-ring: 0 0 0 3px rgba(253,65,13,.30);
      --font-head: 'Poppins', 'Montserrat', Arial, sans-serif;
      --font-body: 'Montserrat', Arial, sans-serif;
      --fs-body: 13px;
      --fs-sm: 12px;
      --fs-hint: 11px;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #121214;
      --surface: #1c1c1f;
      --surface-2: #26262a;
      --surface-3: #313137;
      --text: #f2f2f3;
      --text-2: #c4c4c8;
      --text-3: #9a9aa0;
      --text-muted: #6e6e74;
      --border: #3a3a40;
      --border-2: #4a4a51;
      --accent: #fd410d;
      --accent-hover: #ff8f71;
      --accent-active: #a52b0f;
      --accent-weak: rgba(253,65,13,.14);
      --accent-weak-2: rgba(253,65,13,.24);
      --on-accent: #ffffff;
      --success: #4caf6a; --success-weak: rgba(76,175,106,.16); --on-success: #0c1f12;
      --danger:  #ef5350; --danger-weak:  rgba(239,83,80,.16);  --on-danger:  #1f0c0b;
      --warning: #ffc817; --warning-weak: rgba(255,200,23,.15); --warning-strong: #ffd75a;
      --info:    #6ea8e6; --info-weak:    rgba(110,168,230,.16);
      --shadow: 0 2px 12px rgba(0,0,0,.45);
      --shadow-lg: 0 8px 28px rgba(0,0,0,.55);
      --focus-ring: 0 0 0 3px rgba(253,65,13,.45);
    }

    :root[data-theme="midnight"] {
      color-scheme: dark;
      --bg: #000000; --surface: #0a0a0a; --surface-2: #141414; --surface-3: #1c1c1c;
      --text: #ffffff; --text-2: #dcdcdc; --text-3: #b0b0b0; --text-muted: #8a8a8a;
      --border: #5e5e5e; --border-2: #6a6a6a;
      --accent: #ff5a2c; --accent-hover: #ff8a64; --accent-active: #d8350a;
      --accent-weak: rgba(255,90,44,.18); --accent-weak-2: rgba(255,90,44,.30); --on-accent: #000000;
      --success: #34d058; --success-weak: rgba(52,208,88,.18);  --on-success: #00130a;
      --danger:  #ff6b63; --danger-weak:  rgba(255,107,99,.18); --on-danger:  #130303;
      --warning: #ffc233; --warning-weak: rgba(255,194,51,.18); --warning-strong: #ffd766;
      --info:    #6cb6ff; --info-weak:    rgba(108,182,255,.18);
      --shadow: 0 2px 12px rgba(0,0,0,.7); --shadow-lg: 0 8px 30px rgba(0,0,0,.8);
      --focus-ring: 0 0 0 3px rgba(255,90,44,.6);
    }

    :root[data-theme="encarta"] {
      color-scheme: light;
      --bg: #ffffff;
      --surface: #c0c0c0;
      --surface-2: #d6d2ca;
      --surface-3: #ebe9e3;
      --text: #000000; --text-2: #1d1d1d; --text-3: #3f3f3f; --text-muted: #5e5e5e;
      --border: #808080;
      --border-2: #404040;
      --accent: #000080;
      --accent-hover: #1084d0;
      --accent-active: #00006a;
      --accent-weak: #cdd9ee;
      --accent-weak-2: #aac1e3;
      --on-accent: #ffffff;
      --success: #007a1f; --success-weak: #cfe7cf; --on-success: #ffffff;
      --danger:  #a40000; --danger-weak:  #efcfcf; --on-danger:  #ffffff;
      --warning: #7a5c00; --warning-weak: #efe4bc; --warning-strong: #4f3c00;
      --info:    #000080; --info-weak:    #d2dbef;
      --radius-sm: 0; --radius: 0; --radius-lg: 0;
      --shadow: inset -1px -1px #404040, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
      --shadow-lg: inset -1px -1px #404040, inset 1px 1px #ffffff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
      --focus-ring: 0 0 0 1px #000080;
      --font-head: Tahoma, 'MS Sans Serif', Geneva, Verdana, sans-serif;
      --font-body: Tahoma, 'MS Sans Serif', Geneva, Verdana, sans-serif;
    }

    :root[data-theme="slate-icons"] {
      color-scheme: light;
      --bg: #ffffff; --surface: #f1f5f9; --surface-2: #e6edf3; --surface-3: #dae3ec;
      --text: #0f1e2e; --text-2: #3f5163; --text-3: #647688; --text-muted: #93a3b3;
      --border: #d8e0e8; --border-2: #c2ccd6;
      --accent: #2563eb; --accent-hover: #1d4fc4; --accent-active: #173f9c;
      --accent-weak: rgba(37,99,235,.08); --accent-weak-2: rgba(37,99,235,.16); --on-accent: #ffffff;
      --success: #1e7e34; --success-weak: #e6f4ea; --on-success: #ffffff;
      --danger:  #c0392b; --danger-weak:  #fce8e6; --on-danger:  #ffffff;
      --warning: #b8860b; --warning-weak: #fff7e0; --warning-strong: #8a6400;
      --info:    #2563a8; --info-weak:    #e7eef7;
      --shadow: 0 2px 10px rgba(15,30,46,.10); --shadow-lg: 0 6px 24px rgba(15,30,46,.16);
      --focus-ring: 0 0 0 3px rgba(37,99,235,.30);
    }

    :root[data-theme="sage"] {
      color-scheme: light;
      --bg: #fbfdfb; --surface: #eef4ee; --surface-2: #e2ece2; --surface-3: #d4e2d4;
      --text: #1c2a20; --text-2: #44574a; --text-3: #6a7c6f; --text-muted: #97a59b;
      --border: #d7e3d7; --border-2: #c0d0c0;
      --accent: #2f8f5b; --accent-hover: #25744a; --accent-active: #1c5a39;
      --accent-weak: rgba(47,143,91,.10); --accent-weak-2: rgba(47,143,91,.18); --on-accent: #ffffff;
      --success: #1e7e34; --success-weak: #e6f4ea; --on-success: #ffffff;
      --danger:  #c0392b; --danger-weak:  #fce8e6; --on-danger:  #ffffff;
      --warning: #9a7400; --warning-weak: #f3ecd0; --warning-strong: #6f5400;
      --info:    #2f6a8f; --info-weak:    #e1ebf2;
      --shadow: 0 2px 10px rgba(28,42,32,.10); --shadow-lg: 0 6px 24px rgba(28,42,32,.16);
      --focus-ring: 0 0 0 3px rgba(47,143,91,.32);
    }

    :root[data-theme="gruvbox-rail"] {
      color-scheme: dark;
      --bg: #282828; --surface: #3c3836; --surface-2: #504945; --surface-3: #665c54;
      --text: #ebdbb2; --text-2: #d5c4a1; --text-3: #bdae93; --text-muted: #928374;
      --border: #504945; --border-2: #665c54;
      --accent: #fe8019; --accent-hover: #ff9b47; --accent-active: #d65d0e;
      --accent-weak: rgba(254,128,25,.16); --accent-weak-2: rgba(254,128,25,.26); --on-accent: #1d1407;
      --success: #b8bb26; --success-weak: rgba(184,187,38,.18); --on-success: #141600;
      --danger:  #fb4934; --danger-weak:  rgba(251,73,52,.18);  --on-danger:  #1d0603;
      --warning: #fabd2f; --warning-weak: rgba(250,189,47,.18); --warning-strong: #ffd152;
      --info:    #8ec07c; --info-weak:    rgba(142,192,124,.18);
      --shadow: 0 2px 12px rgba(0,0,0,.5); --shadow-lg: 0 8px 28px rgba(0,0,0,.6);
      --focus-ring: 0 0 0 3px rgba(254,128,25,.5);
    }
  </style>
  <script>
    // Pre-paint: restore the saved theme BEFORE any body markup renders (no
    // FOUC). localStorage only — theme choice never touches the server, so the
    // 3-function public surface of Code.gs stays intact. A stale/unknown id
    // simply matches no palette block -> base light tokens; Theme.apply()
    // normalizes the attribute at init.
    try {
      var vwSavedTheme = localStorage.getItem('eomViewerTheme');
      if (vwSavedTheme) document.documentElement.setAttribute('data-theme', vwSavedTheme);
    } catch (e) {}
  </script>
  <!-- Shared report renderer (BYTE-COPY of the main app's EomReportRenderer.html;
       brings both its CSS and eomrRenderReport). Keep the two files identical. -->
  <?!= include_('EomReportRenderer') ?>
  <style>
    body { margin: 0; font-family: var(--font-body, Arial, Helvetica, sans-serif); background: var(--bg); color: var(--text); }
    .vw-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--surface-2); color: var(--text); border-bottom: 1px solid var(--border); padding: 12px 20px; }
    .vw-brand { font-family: var(--font-head, inherit); font-weight: 800; font-size: 16px; letter-spacing: -0.2px; }
    .vw-sub { color: var(--text-3); font-size: 12px; margin-top: 2px; }
    .vw-body { display: flex; gap: 16px; padding: 16px; max-width: 1680px; margin: 0 auto; align-items: flex-start; }
    .vw-list { flex: 0 0 230px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; }
    .vw-item { display: block; width: 100%; text-align: left; background: none; border: none; border-radius: var(--radius-sm); padding: 8px 10px; cursor: pointer; font: inherit; color: inherit; }
    .vw-item:hover { background: var(--accent-weak); }
    .vw-item.active { background: var(--accent-weak-2); }
    .vw-item-month { display: block; font-weight: 700; }
    .vw-item-sub { display: block; font-size: 11px; color: var(--text-3); margin-top: 1px; }
    .vw-sec { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 8px 10px 2px; }
    .vw-sec:first-child { padding-top: 2px; }
    .vw-refresh { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: var(--radius-sm); font: inherit; font-size: 11px; font-weight: 600; padding: 2px 10px; cursor: pointer; margin-left: 8px; }
    .vw-refresh:hover { background: var(--accent-weak); color: var(--text); }
    .vw-main { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
    .vw-title { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
    .vw-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .vw-pubinfo { color: var(--text-3); font-size: 12px; }
    .vw-check { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm, 12px); font-weight: 600; color: var(--text-2); cursor: pointer; white-space: nowrap; }
    .vw-hint { color: var(--text-3); }
    .vw-err { color: var(--danger, #b3261e); }
    @media (max-width: 720px) { .vw-body { flex-direction: column; } .vw-list { flex: none; width: 100%; box-sizing: border-box; } }

    /* Theme picker — markup/CSS ported from the main app (App.html), with the
       menu opening DOWNWARD (the picker sits in a top header here). */
    .vw-theme { position: relative; flex: 0 0 170px; }
    .theme-btn {
      width: 100%; min-width: 0;
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); color: var(--text-2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-family: var(--font-body); font-size: 12.5px; font-weight: 600;
      padding: 4px 8px; cursor: pointer; text-align: left;
    }
    .theme-btn:hover { color: var(--text); border-color: var(--border-2); }
    .theme-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    #themeBtnLabel { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .theme-caret { font-size: 9px; color: var(--text-3); flex-shrink: 0; }
    .theme-menu {
      position: absolute; z-index: 60; left: 0; right: 0;
      top: calc(100% + 4px);
      margin: 0; padding: 4px; list-style: none;
      background: var(--surface); border: 1px solid var(--border-2);
      border-radius: var(--radius); box-shadow: var(--shadow-lg);
      max-height: 60vh; overflow-y: auto;
    }
    .theme-menu[hidden] { display: none; }
    .theme-menu li {
      padding: 6px 9px; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap;
    }
    .theme-menu li:hover,
    .theme-menu li:focus { outline: none; background: var(--accent-weak); }
    .theme-menu li[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
  </style>
</head>
<body>
  <header class="vw-head">
    <div>
      <div class="vw-brand">Silver Fox — EOM Reports</div>
      <div class="vw-sub">Monthly billing reports</div>
    </div>
    <div class="vw-theme">
      <button type="button" id="themeBtn" class="theme-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Theme">
        <span id="themeBtnLabel">Theme</span>
        <span class="theme-caret" aria-hidden="true">&#9662;</span>
      </button>
      <ul id="themeMenu" class="theme-menu" role="listbox" aria-label="Theme" hidden></ul>
    </div>
  </header>
  <div class="vw-body">
    <aside class="vw-list" id="vwList"><p class="vw-hint">Loading…</p></aside>
    <main class="vw-main" id="vwMain"><p class="vw-hint">Select a month.</p></main>
  </div>

  <script>
    // Standalone viewer glue (vw* prefix). Self-contained esc — no SharedUtils here.
    function escHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    var vwReports = [];
    var vwPayload = null;   // parsed report.json of the open month (for live split re-render)
    function vwEl(id) { return document.getElementById(id); }

    // ── Theme — trimmed port of the main app's SharedUtils Theme object.
    // PALETTE-ONLY themes (no axes/reflectAxes/UiPrefs); persistence is
    // localStorage instead of google.script.run.saveThemePreference, so this
    // adds ZERO server calls (the 3-function public surface is a security
    // boundary). Picker methods copied verbatim from SharedUtils.
    var Theme = {
      themes: [
        { id: 'light',        label: 'Light' },
        { id: 'dark',         label: 'Dark' },
        { id: 'midnight',     label: 'Midnight HC' },
        { id: 'encarta',      label: 'Encarta' },
        { id: 'sage',         label: 'Sage' },
        { id: 'slate-icons',  label: 'Slate' },
        { id: 'gruvbox-rail', label: 'Gruvbox' }
      ],
      has: function(id) {
        for (var i = 0; i < this.themes.length; i++) { if (this.themes[i].id === id) return true; }
        return false;
      },
      current: function() {
        var t = document.documentElement.getAttribute('data-theme');
        return this.has(t) ? t : 'light';   // unknown/empty → safe default
      },
      apply: function(id, persist) {
        var t = this.has(id) ? id : 'light';
        document.documentElement.setAttribute('data-theme', t);
        this.syncPicker(t);
        if (persist) { try { localStorage.setItem('eomViewerTheme', t); } catch (e) {} }
      },
      set: function(id) { this.apply(id, true); },
      initPicker: function() {
        var btn  = document.getElementById('themeBtn');
        var menu = document.getElementById('themeMenu');
        if (!btn || !menu) return;
        var self = this;
        menu.innerHTML = this.themes.map(function(t) {
          return '<li role="option" tabindex="-1" data-theme-id="' + escHtml(t.id) + '">' +
                 escHtml(t.label) + '</li>';
        }).join('');

        btn.addEventListener('click', function(e) { e.stopPropagation(); self._toggleMenu(); });
        btn.addEventListener('keydown', function(e) {
          if (e.key === 'ArrowDown') { e.preventDefault(); self._openMenu(); self._focusItem(0, true); }
        });
        menu.addEventListener('click', function(e) {
          var li = e.target.closest && e.target.closest('li[data-theme-id]');
          if (!li) return;
          self.set(li.getAttribute('data-theme-id'));   // apply + persist + syncPicker
          self._closeMenu(); btn.focus();
        });
        menu.addEventListener('keydown', function(e) {
          var items = menu.querySelectorAll('li[data-theme-id]');
          var idx = Array.prototype.indexOf.call(items, document.activeElement);
          if (e.key === 'ArrowDown')    { e.preventDefault(); self._focusItem(idx + 1); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); self._focusItem(idx - 1); }
          else if (e.key === 'Home')    { e.preventDefault(); self._focusItem(0); }
          else if (e.key === 'End')     { e.preventDefault(); self._focusItem(items.length - 1); }
          else if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            var cur = document.activeElement;
            if (cur && cur.getAttribute('data-theme-id')) {
              self.set(cur.getAttribute('data-theme-id')); self._closeMenu(); btn.focus();
            }
          }
          else if (e.key === 'Escape') { self._closeMenu(); btn.focus(); }
          else if (e.key === 'Tab')    { self._closeMenu(); }
        });
        document.addEventListener('click', function() { self._closeMenu(); });   // outside click closes

        this.syncPicker(this.current());
      },
      _menuOpen: function() {
        var m = document.getElementById('themeMenu');
        return !!m && !m.hasAttribute('hidden');
      },
      _toggleMenu: function() {
        if (this._menuOpen()) this._closeMenu();
        else { this._openMenu(); this._focusItem(0, true); }
      },
      _openMenu: function() {
        var m = document.getElementById('themeMenu'), b = document.getElementById('themeBtn');
        if (m) m.removeAttribute('hidden');
        if (b) b.setAttribute('aria-expanded', 'true');
      },
      _closeMenu: function() {
        var m = document.getElementById('themeMenu'), b = document.getElementById('themeBtn');
        if (m) m.setAttribute('hidden', '');
        if (b) b.setAttribute('aria-expanded', 'false');
      },
      _focusItem: function(idx, preferSelected) {
        var m = document.getElementById('themeMenu');
        if (!m) return;
        var items = m.querySelectorAll('li[data-theme-id]');
        if (!items.length) return;
        if (preferSelected) {
          for (var i = 0; i < items.length; i++) {
            if (items[i].getAttribute('aria-selected') === 'true') { idx = i; break; }
          }
        }
        if (idx < 0) idx = items.length - 1;
        if (idx >= items.length) idx = 0;
        items[idx].focus();
      },
      syncPicker: function(t) {
        var label = document.getElementById('themeBtnLabel');
        var menu  = document.getElementById('themeMenu');
        if (!menu) return;
        var items = menu.querySelectorAll('li[data-theme-id]');
        var text = t;
        for (var i = 0; i < items.length; i++) {
          var match = items[i].getAttribute('data-theme-id') === t;
          items[i].setAttribute('aria-selected', match ? 'true' : 'false');
          if (match) text = items[i].textContent;
        }
        if (label) label.textContent = text;
      }
    };

    function vwInit() {
      Theme.initPicker();
      Theme.apply(Theme.current(), false);   // normalize a stale stored id -> light
      google.script.run
        .withSuccessHandler(vwOnBoot)
        .withFailureHandler(function (e) { vwEl('vwList').innerHTML = '<p class="vw-err">' + escHtml((e && e.message) || String(e)) + '</p>'; })
        .getViewerBootstrap();
    }

    function vwOnBoot(res) {
      if (!res || !res.ok) { vwEl('vwList').innerHTML = '<p class="vw-err">' + escHtml((res && res.error) || 'Could not load.') + '</p>'; return; }
      vwReports = res.reports || [];
      // "Current" = a live pull of the EOM Merge stage (section only appears when
      // the viewer project has Pipedrive configured). Separate from the archive.
      var html = '';
      if (res.current) {
        html += '<div class="vw-sec">Current</div>'
          + '<button type="button" class="vw-item" id="vwCurItem" onclick="vwOpenCurrent()">'
          + '<span class="vw-item-month">EOM Merge — live</span>'
          + '<span class="vw-item-sub">the stage as it is right now</span></button>'
          + '<div class="vw-sec">Published</div>';
      }
      if (!vwReports.length) {
        vwEl('vwList').innerHTML = html + '<p class="vw-hint">No published reports yet.</p>';
        vwEl('vwMain').innerHTML = '<p class="vw-hint">Nothing published yet — check back once a report has been finalized.</p>';
        return;
      }
      html += '<div id="vwMonths">';
      vwReports.forEach(function (r, i) {
        html += '<button type="button" class="vw-item" onclick="vwOpen(' + i + ')">'
          + '<span class="vw-item-month">' + escHtml(r.monthLabel) + '</span>'
          + '<span class="vw-item-sub">' + escHtml(r.orgCount || '0') + ' orgs · ' + escHtml(r.dealCount || '0') + ' deals</span></button>';
      });
      vwEl('vwList').innerHTML = html + '</div>';
      vwOpen(0);   // newest month by default
    }

    // Marks one sidebar item active: a month index, 'current', or null (none).
    function vwMarkActive(which) {
      var cur = vwEl('vwCurItem');
      if (cur) cur.classList.toggle('active', which === 'current');
      var items = document.querySelectorAll('#vwMonths .vw-item');
      for (var k = 0; k < items.length; k++) items[k].classList.toggle('active', k === which);
    }

    function vwOpen(i) {
      var r = vwReports[i]; if (!r) return;
      vwMarkActive(i);
      var main = vwEl('vwMain');
      vwPayload = null;
      main.innerHTML = '<p class="vw-hint">Loading ' + escHtml(r.monthLabel) + '…</p>';
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.ok) { main.innerHTML = '<p class="vw-err">' + escHtml((res && res.error) || 'Could not load.') + '</p>'; return; }
          try {
            var p = JSON.parse(res.json);
            main.innerHTML = '<div class="vw-title">' + escHtml(r.monthLabel) + '</div>'
              + '<div class="vw-toolbar"><div class="vw-pubinfo">Published ' + escHtml(r.publishedAt || '') + '</div>'
              + '<label class="vw-check"><input type="checkbox" id="vwSplit" onchange="vwRender()"> Split by contact</label></div>'
              + '<div id="vwReport"></div>';
            vwPayload = p;
            vwEl('vwSplit').checked = !!(p.meta && p.meta.splitContacts);
            vwRender();
          } catch (e) { vwPayload = null; main.innerHTML = '<p class="vw-err">Report data could not be read.</p>'; }
        })
        .withFailureHandler(function (e) { main.innerHTML = '<p class="vw-err">' + escHtml((e && e.message) || String(e)) + '</p>'; })
        .getReportJson(r.monthKey);
    }

    // Re-renders the open month with the current split-by-contact choice.
    function vwRender() {
      if (!vwPayload) return;
      vwEl('vwReport').innerHTML = eomrRenderReport(vwPayload.group, vwPayload.meta, { splitContacts: vwEl('vwSplit').checked });
    }

    // Live pull of the EOM Merge stage — same render path as an archived month.
    function vwOpenCurrent() {
      vwMarkActive('current');
      var main = vwEl('vwMain');
      vwPayload = null;
      main.innerHTML = '<p class="vw-hint">Pulling the EOM Merge stage from Pipedrive…</p>';
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.ok) { main.innerHTML = '<p class="vw-err">' + escHtml((res && res.error) || 'Could not load.') + '</p>'; return; }
          try {
            var p = JSON.parse(res.json);
            main.innerHTML = '<div class="vw-title">Current — EOM Merge</div>'
              + '<div class="vw-toolbar"><div class="vw-pubinfo">Live from Pipedrive · pulled ' + escHtml((p.meta && p.meta.generatedAt) || '')
              + '<button type="button" class="vw-refresh" onclick="vwOpenCurrent()">&#8635; Refresh</button></div>'
              + '<label class="vw-check"><input type="checkbox" id="vwSplit" onchange="vwRender()"> Split by contact</label></div>'
              + '<div id="vwReport"></div>';
            if (!p.group || !p.group.length) {
              var stName = (p.meta && p.meta.stageName) || 'EOM Merge';
              vwEl('vwReport').innerHTML = '<p class="vw-hint">No deals are in the &ldquo;' + escHtml(stName)
                + '&rdquo; stage (id ' + escHtml((p.meta && p.meta.stageId) || '?') + ') right now.</p>';
              return;
            }
            vwPayload = p;
            vwRender();
          } catch (e) { vwPayload = null; main.innerHTML = '<p class="vw-err">Report data could not be read.</p>'; }
        })
        .withFailureHandler(function (e) { main.innerHTML = '<p class="vw-err">' + escHtml((e && e.message) || String(e)) + '</p>'; })
        .getCurrentReport();
    }

    vwInit();
  </script>
</body>
</html>
