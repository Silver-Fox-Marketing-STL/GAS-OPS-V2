<!-- ════════════════════════════════════════════════════════════════════════════
     HOME VIEW — status strip + HUD dashboard
     (all-time / today / this-week stat tiles + per-dealer focus card)
     (The Workflows launcher cards were removed July 2026 — redundant with the
      sidebar/Start nav.)
════════════════════════════════════════════════════════════════════════════ -->
<div class="view" id="view-home" data-layout="data" hidden>
  <div class="home-scroll app-measure">

    <div class="home-status" id="homeStatus">
      <span class="dot">&#9679;</span>
      <span id="homeStatusText">Loading dashboard&hellip;</span>
    </div>

    <div class="home-hud" id="homeHud">

      <div class="home-hud-band" id="homeSchedule" hidden>
        <div class="home-hud-head">
          <div class="home-sched-day" id="homeSchedDay"></div>
          <div class="home-hud-title">To print today</div>
        </div>
        <div class="home-sched-cards" id="homeSchedRows">
          <div class="home-muted">Loading schedule&hellip;</div>
        </div>
      </div>

      <div class="home-hud-col">
        <div class="home-hud-head">
          <div class="home-hud-title">Stats</div>
          <span id="homeDraftsChip" class="tag tone-info" onclick="navTo('view-run')" title="Resume from the Drafts strip in Run Order" hidden></span>
          <button class="btn-secondary" id="homeRefresh" onclick="loadHomeHud(true)">Refresh</button>
        </div>

        <div class="home-statgroup hero">
          <div class="home-sub-label">Today <span class="home-today-totals" id="homeTodayTotals"></span></div>
          <div class="home-tiles" id="homeToday">
            <div class="home-muted">Loading stats&hellip;</div>
          </div>
        </div>

        <div class="home-statgroup">
          <div class="home-sub-label">This week</div>
          <div class="home-tiles" id="homeWeek"></div>
        </div>

        <div class="home-statgroup quiet">
          <div class="home-sub-label">All time</div>
          <div class="home-tiles" id="homeAllTime"></div>
        </div>
      </div>

      <div class="home-hud-col">
        <div class="home-hud-head">
          <div class="home-hud-title">Dealer focus</div>
        </div>
        <div class="home-focus">
          <div class="home-focus-pick">
            <select id="homeDealerSelect"><option value="">-- Select a dealer --</option></select>
          </div>
          <div class="home-focus-body" id="homeDealerBody">
            <div class="home-muted">Pick a dealer to see inventory, run stats, and open orders.</div>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>

<style>
  /* EXPERIMENT (exp/ui-playground): Home as a job ticket. The day name is the
     one big element; everything under it is ruled rows of tabular figures.
     No panels, no tiles, no shadows — ink rules carry the structure. */
  #view-home .home-scroll {
    box-sizing: border-box;
    height: 100%;
    overflow-y: auto;
    padding: 22px 32px 36px;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-areas: "status" "hud";
    align-content: start;
  }
  #view-home .home-status { grid-area: status; justify-self: start; }
  #view-home .home-hud { grid-area: hud; }

  /* Import freshness — one plain line, no pill. */
  #view-home .home-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: var(--fs-sm);
    color: var(--text-2);
    margin-bottom: 14px;
  }
  #view-home .home-status .dot { color: var(--text-muted); font-size: 9px; }
  #view-home .home-status.fresh .dot { color: var(--success); }
  #view-home .home-status.stale .dot { color: var(--warning); }

  /* Two columns: stats (wider) | dealer focus. The ticket spans both. */
  #view-home .home-hud {
    display: grid;
    grid-template-columns: 3fr 2fr;
    gap: 0 44px;
    align-items: start;
  }
  #view-home .home-hud-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 6px;
    margin-bottom: 4px;
    border-bottom: var(--rule);
  }
  #view-home .home-hud-title {
    font-family: var(--font-head);
    font-size: 22px;
    font-weight: 700;
    line-height: 1.1;
    color: var(--text);
  }
  #view-home .home-muted { font-size: var(--fs-sm); color: var(--text-3); padding: 8px 0; }

  /* ── The ticket: today's day name over the print list ── */
  #view-home .home-hud-band { grid-column: 1 / -1; margin-bottom: 30px; }
  #view-home .home-hud-band .home-hud-head {
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    padding-bottom: 8px;
    margin-bottom: 0;
    border-bottom: 3px solid var(--text);
  }
  #view-home .home-sched-day {
    font-family: var(--font-head);
    font-size: var(--fs-display);
    font-weight: 800;
    line-height: .95;
    letter-spacing: -.01em;
    color: var(--text);
  }
  #view-home .home-sched-day:empty { display: none; }
  #view-home .home-hud-band .home-hud-title {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-2);
    margin-top: 10px;
  }
  /* Dealer rows — a ruled list, one line per dealer. Shared by the ticket
     and the "Today" stat group (same markup, same idiom). */
  #view-home .home-sched-cards { display: block; }
  #view-home .home-sched-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }
  #view-home .home-sched-card .name { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; line-height: 1.3; }
  #view-home .home-sched-card .stats { font-size: var(--fs-sm); color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #view-home .home-sched-card .foot { display: flex; align-items: center; gap: 8px; }
  #view-home .home-sched-card .btn-secondary { padding: 4px 12px !important; }
  #view-home .home-sched-card .foot .btn-secondary { order: 2; }   /* button always on the right edge; tags sit before it */
  #view-home .home-sched-card.done-sched .name::before {   /* printed AND scheduled — checked off */
    content: "\2713";
    display: inline-block;
    width: 18px;
    color: var(--success);
    font-weight: 700;
  }
  #view-home .home-sched-inbox { cursor: pointer; }
  #view-home #homeDraftsChip { cursor: pointer; }
  #view-home #homeDraftsChip[hidden] { display: none !important; }   /* .tag's display beats UA [hidden] */
  #view-home .home-today-totals {
    font-family: var(--font-body);
    font-size: var(--fs-sm);
    font-weight: 500;
    color: var(--text-3);
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  /* ── Stat groups: a ruled heading, then figures in a row ── */
  #view-home .home-statgroup { margin-bottom: 22px; }
  #view-home .home-sub-label {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: var(--font-head);
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    padding-bottom: 4px;
    border-bottom: 1px solid var(--text);
  }
  #view-home .home-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
    gap: 0 18px;
  }
  #view-home #homeAllTime { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  #view-home .home-tile { padding: 10px 0 8px; border-bottom: 1px solid var(--border); }
  #view-home .home-tile .num {
    font-family: var(--font-head);
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  #view-home .home-tile.zero .num { color: var(--text-muted); font-weight: 500; }
  #view-home .home-tile .lbl { margin-top: 4px; font-size: var(--fs-sm); font-weight: 500; color: var(--text-3); }
  /* Priority: Today (accent figures) → This week → All time (smaller, quieter) */
  #view-home .home-statgroup.hero .home-tile .num { font-size: 34px; }
  #view-home .home-statgroup.hero .home-tile:not(.zero) .num { color: var(--accent); }
  #view-home .home-statgroup.quiet .home-tile .num { font-size: 22px; font-weight: 600; color: var(--text-2); }
  #view-home .home-statgroup.quiet .home-tile.zero .num { color: var(--text-muted); }

  /* ── Dealer focus: picker, then ruled sections ── */
  #view-home .home-focus { width: 100%; box-sizing: border-box; }
  #view-home .home-focus-pick { max-width: 100%; margin: 6px 0 2px; }
  #view-home .home-focus-pick select { width: 100%; }
  #view-home .home-focus-sec { padding: 12px 0; border-bottom: 1px solid var(--border); }
  #view-home .home-focus-sec .eomr-chip { background: var(--surface-2); color: var(--text); border-radius: 0; }
  #view-home .home-focus-h {
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  #view-home .home-chipline { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  #view-home .home-lastrun { font-size: var(--fs-body); color: var(--text-2); }
  #view-home .home-lastrun b { color: var(--text); }
  #view-home .home-lastrun .tag { margin-left: 4px; vertical-align: 1px; }
  #view-home .home-eom {
    font-family: var(--font-head);
    font-size: 34px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* themed root (overrides the interim .view light guard) */
  #view-home { background: var(--bg); color: var(--text); }

  /* ── Mobile: pin layout ancestors so wide content can't stretch the page ── */
  :root[data-viewport="mobile"] #view-home .home-scroll,
  :root[data-viewport="mobile"] #view-home .home-hud { min-width: 0; }
  :root[data-viewport="mobile"] #view-home .home-hud { grid-template-columns: 1fr; }
  :root[data-viewport="mobile"] #view-home .home-sched-card { flex-wrap: wrap; }
  :root[data-viewport="mobile"] #view-home .home-sched-card .name { flex-basis: 100%; }   /* name on its own line; figures + tags share the next */
</style>

<script>
  var homeSelectedDealer = '';   // session-remembered Dealer Focus pick (survives nav — hidden views keep JS state)
  var homeSummarySeq = 0;        // stale-response guard for getDealerSummary

  // Loads the HUD stats (one getHomeHud round-trip) and, if a dealer is picked,
  // reloads its summary in parallel. Re-runs on every visit to Home (VIEW_SHOWN)
  // so numbers stay current after a run. refresh=true (the Refresh button) also
  // bypasses the server-side print-schedule cache.
  function loadHomeHud(refresh) {
    var btn = document.getElementById('homeRefresh');
    if (btn) btn.disabled = true;
    homeLoadSchedule(refresh === true);   // parallel call — Pipedrive latency never blocks the stat tiles
    google.script.run
      .withSuccessHandler(function(res) {
        if (btn) btn.disabled = false;
        renderHomeStatus_(res && res.lastImport);
        renderHomeHud_(res || {});
      })
      .withFailureHandler(function(e) {
        if (btn) btn.disabled = false;
        document.getElementById('homeStatusText').textContent = 'Could not load dashboard: ' + e.message;
        document.getElementById('homeStatus').className = 'home-status stale';
        document.getElementById('homeToday').innerHTML =   /* Today is now the first stat group on screen */
          '<div class="home-muted">Could not load stats: ' + escHtml(e.message) + '</div>';
        document.getElementById('homeAllTime').innerHTML = '';
        document.getElementById('homeWeek').innerHTML = '';
      })
      .getHomeHud();
    if (homeSelectedDealer) loadHomeDealerSummary(homeSelectedDealer);   // parallel call is fine
  }

  // Status strip from getHomeHud().lastImport — date + time arrive as
  // pre-formatted display strings (META tab); render as-is, never new Date().
  function renderHomeStatus_(li) {
    var el = document.getElementById('homeStatus');
    var text = document.getElementById('homeStatusText');
    var date = String((li && li.date) || '').trim();
    var time = String((li && li.time) || '').trim();
    if (!date) {
      text.textContent = 'No scraper import recorded yet.';
      el.className = 'home-status stale';
      return;
    }
    text.textContent = 'Last scraper import: ' + date + (time ? ' ' + time : '');
    el.className = 'home-status ' + (homeDateIsToday_(date) ? 'fresh' : 'stale');
  }

  // Fresh = the import date string is today. Accepts yyyy/mm/dd, yyyy-mm-dd,
  // or locale m/d/yyyy (display values vary with sheet formatting).
  function homeDateIsToday_(dateStr) {
    var m = /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/.exec(dateStr);
    if (!m) {
      var us = /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/.exec(dateStr);
      if (!us) return false;
      m = [null, us[3], us[1], us[2]];
    }
    var t = new Date();
    return +m[1] === t.getFullYear() && +m[2] === t.getMonth() + 1 && +m[3] === t.getDate();
  }

  // One stat tile. Zero renders muted (class "zero"). Pass a pre-formatted
  // string via opts.raw for non-integers (avg VINs/run).
  function homeTile_(label, value, opts) {
    var n = Number(value) || 0;
    var display = (opts && opts.raw !== undefined) ? String(opts.raw) : n.toLocaleString();
    return '<div class="home-tile' + (n === 0 ? ' zero' : '') + '">' +
      '<div class="num">' + escHtml(display) + '</div>' +
      '<div class="lbl">' + escHtml(label) + '</div></div>';
  }

  function renderHomeHud_(res) {
    homeHudData = res;
    var at = res.allTime || {};
    document.getElementById('homeAllTime').innerHTML =
      homeTile_('Total runs', at.runs) +
      homeTile_('Total VINs', at.vins) +
      homeTile_('Avg VINs/Run', at.avgVinsPerRun,
                { raw: (Number(at.avgVinsPerRun) || 0).toLocaleString(undefined, { maximumFractionDigits: 1 }) }) +
      homeTile_('Committed', at.committed) +
      homeTile_('Pending', at.pending) +
      homeTile_('Rolled back', at.rolledBack);
    renderHomeBucket_('homeWeek', res.week);
    renderHomeToday_();   // Today is owned jointly with the schedule response

    // Saved Run Order drafts — chip jumps to the Run view's Drafts strip.
    var chip = document.getElementById('homeDraftsChip');
    var n = Number(res.draftCount) || 0;
    chip.textContent = n + ' draft' + (n === 1 ? '' : 's');
    chip.hidden = (n === 0);
  }

  function renderHomeBucket_(id, b) {
    b = b || {};
    document.getElementById(id).innerHTML =
      homeTile_('Runs', b.runs) +
      homeTile_('VINs produced', b.vins) +
      homeTile_('Dealers served', b.dealers) +
      homeTile_('Duplicates', b.dupes);
  }

  // ── Today's Print Schedule band + per-dealer Today stats ──────────────────
  // Two responses share the Today stat group: the schedule response owns it
  // (per-dealer printed cards) whenever the schedule is configured; getHomeHud's
  // aggregate tiles are the fallback. Both cache their data and either arrival
  // re-renders via renderHomeToday_ — so response order never matters.
  var homeHudData = null;      // last getHomeHud response
  var homeSchedData = null;    // last getPrintSchedule response
  var homeSchedDealers = [];   // Run Order buttons index into this (never interpolate a name into onclick — apostrophe trap)
  var homeSchedSeq = 0;        // stale-response guard (same idiom as homeSummarySeq)

  function homeLoadSchedule(refresh) {
    var seq = ++homeSchedSeq;
    google.script.run
      .withSuccessHandler(function(res) {
        if (seq !== homeSchedSeq) return;
        homeRenderSchedule_(res || { ok: false, configured: true });
      })
      .withFailureHandler(function() {
        if (seq !== homeSchedSeq) return;
        homeRenderSchedule_({ ok: false, configured: true });
      })
      .getPrintSchedule(refresh === true);
  }

  function homeInboxTag_(d) {
    return Number(d.pending)
      ? '<span class="tag tone-warning home-sched-inbox" onclick="navTo(\'view-vin-inbox\')" title="Open the VIN Inbox">' +
        Number(d.pending) + ' in inbox</span>'
      : '';
  }

  function homeRenderSchedule_(res) {
    homeSchedData = res;
    var band = document.getElementById('homeSchedule');
    var rows = document.getElementById('homeSchedRows');
    renderHomeToday_();
    if (!res.configured) { band.hidden = true; return; }   // Pipedrive / field not set up — stay quiet
    band.hidden = false;
    document.getElementById('homeSchedDay').textContent = res.day || '';
    homeSchedDealers = res.upNext || [];
    if (!res.ok) {
      rows.innerHTML = '<div class="home-muted">Schedule unavailable.</div>';
      return;
    }
    if (!homeSchedDealers.length) {
      var anyDone = (res.ranToday || []).some(function(d) { return d.scheduled; });
      rows.innerHTML = '<div class="home-muted">' +
        (anyDone ? 'All scheduled orders printed. &#10003;' : 'Nothing scheduled today.') + '</div>';
      return;
    }
    var html = '';
    homeSchedDealers.forEach(function(d, i) {
      html += '<div class="home-sched-card">' +
        '<div class="name">' + escHtml(d.name) + '</div>' +
        '<div class="foot">' +
          '<button class="btn-secondary" onclick="homeSchedRun_(' + i + ')">Run Order</button>' +
          homeInboxTag_(d) +
        '</div></div>';
    });
    rows.innerHTML = html;
  }

  // Today stat group: per-dealer printed cards (schedule configured) or the
  // aggregate tiles from getHomeHud (fallback / schedule not yet answered).
  function renderHomeToday_() {
    var el = document.getElementById('homeToday');
    var totalsEl = document.getElementById('homeTodayTotals');
    var s = homeSchedData;
    if (s && s.configured) {
      el.className = 'home-sched-cards';
      var t = s.totals;
      totalsEl.textContent = t
        ? t.runs + ' runs, ' + t.vins.toLocaleString() + ' VINs, ' + t.dupes + ' dupes'
        : '';
      var html = '';
      (s.ranToday || []).forEach(function(d) {
        html += '<div class="home-sched-card' + (d.scheduled ? ' done-sched' : '') + '">' +
          '<div class="name">' + escHtml(d.name) + '</div>' +
          '<div class="stats">' + d.runs + (d.runs === 1 ? ' run' : ' runs') +
            ', ' + Number(d.vins).toLocaleString() + ' VINs, ' + d.dupes + ' dupes</div>' +
          '<div class="foot">' +
            (d.scheduled ? '<span class="tag tone-success">&#10003; Scheduled</span>' : '') +
            homeInboxTag_(d) +
          '</div></div>';
      });
      el.innerHTML = html || '<div class="home-muted">No orders printed yet today.</div>';
    } else if (homeHudData) {
      el.className = 'home-tiles';
      totalsEl.textContent = '';
      renderHomeBucket_('homeToday', homeHudData.today);
    }
  }

  // Mirrors viCreateOrder (VIN Inbox → Run): land on Run first, then drive the
  // dealer select through the normal change flow. Empty VIN list = preselect only;
  // the un-finalized-run guard reverts the select on Cancel by itself.
  function homeSchedRun_(i) {
    var d = homeSchedDealers[i];
    if (!d) return;
    navTo('view-run');
    runPrefillFromInbox(d.key, []);
  }

  // ── Dealer Focus ───────────────────────────────────────────────────────────
  function loadHomeDealerSummary(dealerKey) {
    var body = document.getElementById('homeDealerBody');
    body.innerHTML = '<div class="home-muted">Loading dealer summary&hellip;</div>';
    var seq = ++homeSummarySeq;
    google.script.run
      .withSuccessHandler(function(res) {
        if (seq !== homeSummarySeq) return;   // a newer pick superseded this load
        if (!res || res.error) {
          toast('Dealer summary: ' + ((res && res.error) || 'no data returned'), 'error');
          body.innerHTML = '<div class="home-muted">Could not load this dealer&rsquo;s summary.</div>';
          return;
        }
        body.innerHTML = renderHomeDealerSummary_(res);
      })
      .withFailureHandler(function(e) {
        if (seq !== homeSummarySeq) return;
        toast('Dealer summary failed: ' + e.message, 'error');
        body.innerHTML = '<div class="home-muted">Could not load this dealer&rsquo;s summary.</div>';
      })
      .getDealerSummary(dealerKey);
  }

  function renderHomeDealerSummary_(d) {
    function chip(n, label) {   // count chip; zero count skips the <b> so it reads muted
      var v = (Number(n) || 0).toLocaleString();
      return '<span class="eomr-chip">' + (Number(n) ? '<b>' + v + '</b>' : v) + ' ' + escHtml(label) + '</span>';
    }
    var html = '';

    // Inventory (null = the dealer's scraper location is absent from the newest import)
    html += '<div class="home-focus-sec"><div class="home-focus-h">Inventory</div>';
    var inv = d.inventory;
    if (inv) {
      html += '<div class="home-chipline">';
      ['New', 'PO', 'CPO', 'CPO-EL', 'Other'].forEach(function(t) {
        html += chip(inv.byType && inv.byType[t], t);
      });
      html += chip(inv.total, 'total');
      html += '</div>';
      html += '<div class="home-muted">' +
        (Number(inv.onlot) || 0).toLocaleString() + ' on-lot &middot; ' +
        (Number(inv.offlot) || 0).toLocaleString() + ' off-lot &middot; ' +
        (Number(inv.noPrice) || 0).toLocaleString() + ' no price &middot; ' +
        (Number(inv.noStock) || 0).toLocaleString() + ' no stock &middot; as of ' + escHtml(inv.asOf) + '</div>';
    } else {
      html += '<div class="home-muted">No inventory data for this dealer&rsquo;s scraper location.</div>';
    }
    html += '</div>';

    // Run stats
    var rs = d.runStats || {};
    var bt = rs.byType || {};
    html += '<div class="home-focus-sec"><div class="home-focus-h">Run stats</div>';
    if (Number(rs.runs)) {
      html += '<div class="home-chipline">' +
        chip(rs.runs, 'runs') +
        '<span class="eomr-chip"><b>' + (Number(rs.vinsOrdered) || 0).toLocaleString() +
          ' &rarr; ' + (Number(rs.vinsProduced) || 0).toLocaleString() + '</b> ordered &rarr; produced</span>' +
        '<span class="eomr-chip"><b>' + (Number(rs.avgMatchPct) || 0) + '%</b> avg match</span>' +
        '</div>';
      html += '<div class="home-muted">By type: New ' + (Number(bt.new) || 0).toLocaleString() +
        ' &middot; PO ' + (Number(bt.po) || 0).toLocaleString() +
        ' &middot; CPO ' + (Number(bt.cpo) || 0).toLocaleString() +
        ' &middot; CPO-EL ' + (Number(bt.cpoEl) || 0).toLocaleString() + '</div>';
    } else {
      html += '<div class="home-muted">No runs recorded for this dealer yet.</div>';
    }
    html += '</div>';

    // Most recent run
    html += '<div class="home-focus-sec"><div class="home-focus-h">Most recent run</div>';
    var lr = d.lastRun;
    if (lr) {
      var st = String(lr.vinLogStatus || 'pending');
      var tone = st === 'committed' ? 'tone-success' : (st === 'rolled_back' ? 'tone-danger' : 'tone-neutral');
      html += '<div class="home-lastrun">' + escHtml(lr.ts) +
        ' &middot; order <b>' + escHtml(lr.orderId) + '</b>' +
        ' &middot; ' + (Number(lr.produced) || 0).toLocaleString() + ' produced' +
        '<span class="tag ' + tone + '">' + escHtml(st) + '</span></div>';
    } else {
      html += '<div class="home-muted">No runs yet.</div>';
    }
    html += '</div>';

    // EOM open orders (null = Pipedrive unconfigured/unreachable or no linked org)
    html += '<div class="home-focus-sec"><div class="home-focus-h">EOM open orders</div>';
    html += (d.eomOrders == null)
      ? '<div class="home-muted">&mdash; (EOM unavailable)</div>'
      : '<div class="home-eom">' + (Number(d.eomOrders) || 0).toLocaleString() + '</div>';
    html += '</div>';

    return html;
  }

  // ── Init (once, on first nav — dealers from the shared AppData bootstrap) ──
  function initHomeView() {
    var sel = document.getElementById('homeDealerSelect');
    AppData.get(function(data, err) {
      if (!data) {
        sel.innerHTML = '<option value="">Error loading dealers</option>';
        return;
      }
      sel.innerHTML = '<option value="">-- Select a dealer --</option>';
      data.dealers.forEach(function(d) {
        var opt = document.createElement('option');
        opt.value = d.key; opt.text = d.name;
        sel.appendChild(opt);
      });
      // (CustomSelect auto-refreshes on option changes via its own observer.)
    });
    sel.addEventListener('change', function() {
      homeSelectedDealer = this.value;
      if (homeSelectedDealer) loadHomeDealerSummary(homeSelectedDealer);
      else document.getElementById('homeDealerBody').innerHTML =
        '<div class="home-muted">Pick a dealer to see inventory, run stats, and open orders.</div>';
    });
  }

  window.VIEW_INITS = window.VIEW_INITS || {};
  VIEW_INITS['view-home'] = initHomeView;

  // Refresh on every visit to Home so stats reflect the latest run/import.
  window.VIEW_SHOWN = window.VIEW_SHOWN || {};
  VIEW_SHOWN['view-home'] = loadHomeHud;
</script>
