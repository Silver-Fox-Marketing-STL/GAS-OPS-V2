<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SilverFox desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <!-- Google Identity Services: the sign-in button + the ID token the API verifies. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Theme before first paint: saved choice, else the OS.
    try {
      var t = localStorage.getItem('desk.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" class="app-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
