<!-- ════════════════════════════════════════════════════════════════════════════
     VIN INBOX VIEW — office-side processing of Lot Scanner submissions.
     Reads the shared SF_LOT_SUBMISSIONS sheet via getVinSubmissions; groups
     pending submissions by order batch (legacy/blank-batch rows fall back to
     one group per dealer); lets the processor correct the OCR'd VIN
     (updateVinSubmissionStatus), discard bad reads, or jump a batch's valid
     VINs straight into Run Order ("Create order" → runPrefillFromInbox; the
     batch is offered for discard once that order finalizes). (escHtml/toast
     from SharedUtils; batch styling mirrors EomReportRenderer's .eomr-contact
     idiom.)
════════════════════════════════════════════════════════════════════════════ -->
<div class="view" id="view-vin-inbox" hidden>
  <div class="vi-scroll">
    <div class="vi-head">
      <h2 class="u-h2" style="margin:0;">VIN Inbox</h2>
      <div class="vi-head-actions">
        <button type="button" class="btn-ghost" id="viOcrBtn" onclick="viRunOcr()" hidden>Run OCR (<span id="viOcrCount">0</span> queued)</button>
        <button type="button" class="btn-ghost" onclick="viLoad()">&#8635; Refresh</button>
      </div>
    </div>
    <p class="u-hint" style="max-width:70ch;">Photos submitted from the Lot Scanner, grouped by dealer. Review/correct the read VIN, <strong>Discard</strong> bad reads — or <strong>Create order</strong> to jump the batch's valid VINs into Run Order.</p>
    <div id="viBody"><p class="u-hint">Loading&hellip;</p></div>
  </div>
</div>

<style>
  #view-vin-inbox { height: 100%; background: var(--bg); color: var(--text); }
  #view-vin-inbox .vi-scroll { height: 100%; overflow-y: auto; padding: var(--space-5) var(--space-6); }
  #view-vin-inbox .vi-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
  #view-vin-inbox .vi-head-actions { display: flex; align-items: center; gap: var(--space-2); }

  /* ponytail: .vi-batch deliberately mirrors EomReportRenderer's .eomr-contact
     (border/radius/summary hover/[open] rule/indented body) and the summary
     reuses the live .eomr-chips/.eomr-chip classes directly — EOM report
     restyles should propagate here by intent. */
  #view-vin-inbox .vi-batch { margin-top: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
  #view-vin-inbox .vi-batch > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: var(--space-3); padding: 12px 16px; }
  #view-vin-inbox .vi-batch > summary:hover { background: var(--surface-2); }
  #view-vin-inbox .vi-batch > summary::-webkit-details-marker { display: none; }
  #view-vin-inbox .vi-batch[open] > summary { border-bottom: 2px solid var(--text); }
  #view-vin-inbox .vi-caret { display: inline-block; flex-shrink: 0; color: var(--text-3); font-size: var(--fs-sm); transition: transform .15s ease; }
  #view-vin-inbox .vi-batch[open] > summary .vi-caret { transform: rotate(90deg); }
  #view-vin-inbox .vi-batch-title { display: flex; flex-direction: column; min-width: 0; }
  #view-vin-inbox .vi-dealer { font-family: var(--font-head); font-weight: 800; font-size: var(--fs-lg); letter-spacing: -0.2px; }
  #view-vin-inbox .vi-group-sub { font-weight: 400; font-size: var(--fs-hint); color: var(--text-3); margin-top: 2px; }
  #view-vin-inbox .vi-batch-actions { display: flex; gap: var(--space-2); flex-shrink: 0; }
  #view-vin-inbox .vi-batch-body { padding: var(--space-2) var(--space-4) var(--space-4) 34px; }

  #view-vin-inbox .vi-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: var(--space-2); }
  #view-vin-inbox .vi-card { display: flex; gap: var(--space-2); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2); }
  #view-vin-inbox .vi-card.miss { border-color: var(--warning); }
  #view-vin-inbox .vi-thumb { width: 72px; height: 72px; flex-shrink: 0; border-radius: var(--radius-sm); object-fit: cover; background: var(--surface-3); border: 1px solid var(--border); }
  #view-vin-inbox .vi-info { flex: 1; min-width: 0; }
  #view-vin-inbox .vi-vin { font-family: var(--font-mono, ui-monospace, monospace); font-weight: 700; word-break: break-all; }
  #view-vin-inbox .vi-tags { display: flex; gap: var(--space-2); margin: var(--space-1) 0; flex-wrap: wrap; }
  #view-vin-inbox .vi-veh { font-size: var(--fs-sm); color: var(--text-2); }
  #view-vin-inbox .vi-meta { font-size: var(--fs-hint); color: var(--text-3); margin-top: 2px; }
  #view-vin-inbox .vi-actions { display: flex; gap: var(--space-2); margin-top: var(--space-2); flex-wrap: wrap; }
  #view-vin-inbox .vi-actions input { flex: 1; min-width: 130px; padding: 6px; font-family: var(--font-mono, ui-monospace, monospace); text-transform: uppercase; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); }
  /* Buttons: don't shrink next to the flex:1 VIN input. */
  #view-vin-inbox .vi-actions button { flex-shrink: 0; }
  #view-vin-inbox .vi-empty { color: var(--text-3); margin-top: var(--space-5); }
</style>

<script>
  // (SPA single JS scope — symbols prefixed `vi`.)
  window.VIEW_SHOWN = window.VIEW_SHOWN || {};
  VIEW_SHOWN['view-vin-inbox'] = function () { viLoad(); };   // reload pending on every visit

  var viSubs = [], viGroupNames = [];

  function viLoad() {
    var body = document.getElementById('viBody');
    if (!body) return;
    body.innerHTML = '<p class="u-hint">Loading&hellip;</p>';
    google.script.run
      .withSuccessHandler(viRender)
      .withFailureHandler(function (e) {
        body.innerHTML = '<p class="vi-empty">Could not load submissions: ' + escHtml((e && e.message) || String(e)) + '</p>';
      })
      .getVinSubmissions();   // no filter = submitted only (drafts stay field-owned until Send to office)
  }

  function viRender(res) {
    var body = document.getElementById('viBody');
    if (!res || !res.ok) { body.innerHTML = '<p class="vi-empty">Error: ' + escHtml((res && res.error) || 'unknown') + '</p>'; viSubs = []; viRefreshOcrBtn(); return; }
    if (!res.configured) {
      body.innerHTML = '<p class="vi-empty">The submissions sheet isn’t linked yet. Set <code>LOT_SUBMISSIONS_SHEET_ID</code> in Code.gs (run the Lot Scanner’s <code>setupLotScannerResources()</code> once to create it).</p>';
      viSubs = []; viRefreshOcrBtn();
      return;
    }
    viSubs = res.submissions || [];
    viRefreshOcrBtn();
    if (!viSubs.length) { body.innerHTML = '<p class="vi-empty">No open submissions.</p>'; return; }

    // Group by order batch (field app); legacy/blank-batch rows fall back to one group per dealer.
    var groups = {};
    viGroupNames = [];
    viSubs.forEach(function (s) {
      var key = viGroupKey(s);
      if (!groups[key]) { groups[key] = []; viGroupNames.push(key); }
      groups[key].push(s);
    });
    // Newest-first by the group's first row submission time.
    viGroupNames.sort(function (a, b) { return viGroupTime_(groups[b][0]) - viGroupTime_(groups[a][0]); });

    var html = '';
    viGroupNames.forEach(function (key, gi) {
      var rows = groups[key];
      var isBatch = !!rows[0].batchId;
      var name = rows[0].dealerName || rows[0].dealerKey || '(unknown dealer)';
      var doneCount = rows.filter(function (r) { return r.ocrState !== 'queued'; }).length;
      var validCount = rows.filter(function (r) { return r.valid; }).length;
      // Collapsed by default (no `open` attr) — native <details> = no JS toggle state to manage.
      html += '<details class="vi-batch">';
      html += '<summary>';
      html += '<span class="vi-caret">&#9656;</span>';
      html += '<span class="vi-batch-title"><span class="vi-dealer">' + escHtml(name) + '</span>';
      if (isBatch) {
        html += '<span class="vi-group-sub">' + escHtml(rows[0].email || '') + (rows[0].ts ? (' · ' + escHtml(rows[0].ts)) : '') + '</span>';
      }
      html += '</span>';
      html += '<span class="eomr-chips">';
      html += '<span class="eomr-chip"><b>' + rows.length + '</b> submission' + (rows.length === 1 ? '' : 's') + '</span>';
      if (isBatch && doneCount < rows.length) {
        html += '<span class="tag tone-info">' + doneCount + '/' + rows.length + ' read</span>';
      }
      html += '<span class="eomr-chip"><b>' + validCount + '</b> valid</span>';
      html += '</span>';
      html += '<span class="vi-batch-actions">';
      html += '<button type="button" class="btn-secondary" onclick="viCreateOrder(' + gi + ', event)">Create order</button>';
      html += '<button type="button" class="btn-danger" onclick="viDeleteBatch(' + gi + ', event)">Discard batch</button>';
      html += '</span>';
      html += '</summary>';
      html += '<div class="vi-batch-body"><div class="vi-cards">';
      rows.forEach(function (s) { html += viCard(s); });
      html += '</div></div></details>';
    });
    body.innerHTML = html;
  }

  // Grouping key: batch id when present, else one bucket per dealer (legacy/blank-batch rows).
  function viGroupKey(s) {
    return s.batchId || ('dealer:' + (s.dealerName || s.dealerKey));
  }
  function viGroupTime_(s) {
    return s.tsMs || 0;   // server sends epoch millis; s.ts is a pre-formatted display string
  }

  function viCard(s) {
    // photoFileId / id are system-generated (no quotes) → safe in handlers.
    var thumb = s.photoFileId
      ? '<a href="' + escHtml(s.photoUrl) + '" target="_blank" rel="noopener"><img class="vi-thumb" alt="VIN photo" ' +
        'src="https://drive.google.com/thumbnail?id=' + encodeURIComponent(s.photoFileId) + '&sz=w200" ' +
        'onerror="this.style.display=\'none\'"></a>'
      : '';
    var veh = '';
    if (s.matched) {
      var line = [s.year, s.make, s.model, s.type].filter(Boolean).join(' ');
      if (s.stock) line += ' · Stock ' + s.stock;
      veh = '<div class="vi-veh">' + escHtml(line) + '</div>';
    }
    var meta = '<div class="vi-meta">' + escHtml(s.email || '') + (s.ts ? (' · ' + escHtml(s.ts)) : '') + '</div>';
    var queued = (s.ocrState === 'queued');
    var h = '';
    h += '<div class="vi-card' + (queued || s.matched ? '' : ' miss') + '">';
    h += thumb;
    h += '<div class="vi-info">';
    h += '<div class="vi-vin">' + escHtml(s.vin || (queued ? '(processing…)' : '(no VIN)')) + '</div>';
    h += '<div class="vi-tags">';
    if (queued) {
      h += '<span class="tag tone-neutral">still processing…</span>';
    } else {
      h += '<span class="tag ' + (s.valid ? 'tone-success' : 'tone-danger') + '">' + (s.valid ? 'valid VIN' : 'invalid VIN') + '</span>';
      h += '<span class="tag ' + (s.matched ? 'tone-success' : 'tone-danger') + '">' + (s.matched ? 'in inventory' : 'not in inventory') + '</span>';
    }
    h += '</div>';
    h += veh + meta;
    if (!queued) {
      h += '<div class="vi-actions">';
      h += '<input id="vivin_' + s.id + '" type="text" maxlength="17" value="' + escHtml(s.vin || '') + '" placeholder="Correct VIN…">';
      h += '<button type="button" class="btn-secondary" onclick="viRecheck(\'' + s.id + '\')">Re-check</button>';
      h += '<button type="button" class="btn-secondary" onclick="viDiscard(\'' + s.id + '\')">Discard</button>';
      h += '</div>';
    }
    h += '</div></div>';
    return h;
  }

  function viCreateOrder(gi, evt) {
    // Button lives inside <summary> — a bare click would also toggle the batch open/closed.
    if (evt) { evt.preventDefault(); evt.stopPropagation(); }
    var key = viGroupNames[gi];
    var rows = viSubs.filter(function (s) { return viGroupKey(s) === key; });
    if (!rows.length) return;
    var label = rows[0].dealerName || rows[0].dealerKey || '(unknown dealer)';
    var seen = {}, vins = [];
    rows.forEach(function (s) {
      if (s.vin && s.valid && !seen[s.vin]) { seen[s.vin] = 1; vins.push(s.vin); }
    });
    if (!vins.length) { toast('No valid VINs in this batch', 'info'); return; }
    // window.* property (never a bare var) so `typeof`/truthy checks are safe when
    // Classic loads fragments standalone. ViewRun clears it on dealer switch;
    // viMaybeDiscardBatch consumes it when the order finalizes.
    window.viPendingBatch = {
      ids: rows.map(function (s) { return s.id; }),
      dealerKey: rows[0].dealerKey,
      label: label,
      count: rows.length
    };
    navTo('view-run');
    if (typeof runPrefillFromInbox === 'function') runPrefillFromInbox(rows[0].dealerKey, vins);
  }

  // Called from ViewRun once the batch's run is fully resolved (≥1 card
  // finalized, none pending). Clears the pending link FIRST so the prompt can
  // fire at most once even if invoked twice.
  function viMaybeDiscardBatch() {
    var b = window.viPendingBatch;
    if (!b) return;
    window.viPendingBatch = null;
    if (!confirm('Order generated from batch — discard the batch (' + b.count + ' submissions)?')) return;
    toast('Discarding ' + b.count + ' submissions…', 'info');
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) { toast('Batch discard failed: ' + escHtml((res && res.error) || '?'), 'error'); return; }
        var msg = 'Discarded ' + res.updated + ' submission' + (res.updated === 1 ? '' : 's') + '.';
        if (res.photosFailed > 0) msg += ' (' + res.photosFailed + ' photo(s) couldn\'t be deleted)';
        toast(msg, 'success');
        // No viLoad() here — VIEW_SHOWN['view-vin-inbox'] refreshes on next visit.
      })
      .withFailureHandler(function (e) { toast('Batch discard failed: ' + escHtml((e && e.message) || String(e)), 'error'); })
      .updateVinSubmissionStatuses(b.ids, 'discarded');
  }

  function viAction(sid, status, vin, okMsg) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.ok) {
          if (okMsg) {
            var msg = okMsg, tone = 'success';
            if (res.photoTrashed === false) { msg += ' (photo not deleted)'; tone = 'info'; }
            toast(msg, tone);
          }
          viLoad();
        }
        else { toast('Failed: ' + escHtml((res && res.error) || '?'), 'error'); }
      })
      .withFailureHandler(function (e) { toast('Failed: ' + escHtml((e && e.message) || String(e)), 'error'); })
      .updateVinSubmissionStatus(sid, status, vin || '');
  }

  function viRecheck(sid) {
    var el = document.getElementById('vivin_' + sid);
    viAction(sid, 'submitted', el ? el.value : '', 'VIN updated.');   // keep it open in the queue
  }
  function viDiscard(sid) { if (confirm('Discard this submission?')) viAction(sid, 'discarded', '', 'Discarded.'); }

  function viDeleteBatch(gi, evt) {
    // Button lives inside <summary> — prevent the click from also toggling the batch open/closed.
    if (evt) { evt.preventDefault(); evt.stopPropagation(); }
    var key = viGroupNames[gi];
    var rows = viSubs.filter(function (s) { return viGroupKey(s) === key; });
    if (!rows.length) return;
    if (!confirm('Discard all ' + rows.length + ' submissions in this batch?')) return;
    var btn = evt && evt.currentTarget;
    if (btn) btn.disabled = true;
    toast('Discarding ' + rows.length + ' submissions…', 'info');
    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) btn.disabled = false;
        if (!res || !res.ok) {
          toast('Batch discard failed: ' + escHtml((res && res.error) || '?'), 'error');
          viLoad();
          return;
        }
        var msg = 'Discarded ' + res.updated + ' submission' + (res.updated === 1 ? '' : 's') + '.';
        if (res.photosFailed > 0) msg += ' (' + res.photosFailed + ' photo(s) couldn\'t be deleted)';
        toast(msg, 'success');
        viLoad();
      })
      .withFailureHandler(function (e) {
        if (btn) btn.disabled = false;
        toast('Batch discard failed: ' + escHtml((e && e.message) || String(e)), 'error');
        viLoad();
      })
      .updateVinSubmissionStatuses(rows.map(function (s) { return s.id; }), 'discarded');
  }

  // ── Run OCR — office-side manual trigger (scanner no longer OCRs its own queue) ──
  function viRefreshOcrBtn() {
    var btn = document.getElementById('viOcrBtn');
    if (!btn) return;
    var n = viSubs.filter(function (s) { return s.ocrState === 'queued'; }).length;
    var countEl = document.getElementById('viOcrCount');
    if (countEl) countEl.textContent = n;
    btn.hidden = (n === 0);
  }

  function viRunOcr() {
    var btn = document.getElementById('viOcrBtn');
    if (btn) btn.disabled = true;
    viOcrStep(0);
  }

  function viOcrStep(doneSoFar) {
    google.script.run
      .withSuccessHandler(function (res) {
        var btn = document.getElementById('viOcrBtn');
        if (!res || !res.ok) {
          toast('OCR failed: ' + escHtml((res && res.error) || '?'), 'error');
          if (btn) btn.disabled = false;
          return;
        }
        var total = doneSoFar + res.processed;
        toast('OCR: ' + total + ' done, ' + res.remaining + ' remaining…', 'info');
        if (res.remaining > 0 && res.processed > 0) {
          viOcrStep(total);
        } else {
          if (btn) btn.disabled = false;
          toast('OCR finished — ' + total + ' processed.', 'success');
          viLoad();
        }
      })
      .withFailureHandler(function (e) {
        toast('OCR failed: ' + escHtml((e && e.message) || String(e)), 'error');
        var btn = document.getElementById('viOcrBtn');
        if (btn) btn.disabled = false;
      })
      .runInboxOcr(10);
  }
</script>
