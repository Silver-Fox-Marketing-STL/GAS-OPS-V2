<div class="view" id="view-run" data-layout="data" hidden>

  <div class="rv-wrap app-measure">

    <!-- TOP BAR: left cluster (selects + VIN-log status) | action buttons |
         flow zone (CAO summary / progress / finalize / status — JS toggles
         each panel's display; lays out HORIZONTALLY to keep the topbar short) -->
    <div class="rv-topbar">
      <div class="rv-topbar-main">

        <div class="rv-topbar-inputs">
          <div class="user-select-wrap">
            <label for="userSelect">Running as</label>
            <select id="userSelect">
              <option value="">-- Loading... --</option>
            </select>
          </div>

          <div>
            <label for="runDealerSelect">Dealer</label>
            <select id="runDealerSelect">
              <option value="">-- Loading dealers... --</option>
            </select>
          </div>

          <!-- Deal IDs are entered on the finalization cards after the run
               ("Existing" method) — no pre-run Pipedrive field. -->

          <!-- VIN log status row (shown after dealer selected) -->
          <div id="vinLogStatusRow">
            <span class="log-label">Most recent order in log: <span id="vinLogOrderSpan" class="tag tone-neutral">—</span></span>
            <button id="openVinLogBtn" onclick="openVinLogUpdater()">&#x1F4CB; Update VIN Log</button>
          </div>
        </div>

        <div class="rv-topbar-actions">
          <button id="caoBtn" class="btn-ghost" onclick="prefillFromCAO()" disabled>&#x21BA; Pre-fill from CAO</button>
          <button class="btn-primary" id="runBtn" onclick="runSelected()" disabled>Run Dealer</button>
        </div>

        <div class="rv-flow">
          <div id="caoSummary">
            <div class="summary-row"><span>Total inventory</span><span id="sTotal">—</span></div>
            <div class="summary-row"><span>After filters</span><span id="sFiltered">—</span></div>
            <div id="rejectionRows"></div>
            <hr class="summary-divider">
            <div class="summary-row"><span>Already printed</span><span id="sPrinted">—</span></div>
            <hr class="summary-divider">
            <div class="summary-row summary-net"><span><b>Net new (pre-filled)</b></span><span id="sNetNew">—</span></div>
          </div>

          <!-- Middle cell: progress bar + status banner (idle guidance lives
               in the VIN textarea's placeholder) -->
          <div class="rv-flow-mid">
            <div id="progressSection">
              <div id="progressStep">Starting...</div>
              <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
              </div>
              <div class="progress-meta">
                <span id="progressElapsed"></span>
                <span id="progressPercent">0%</span>
              </div>
            </div>

            <div id="runStatus" class="empty"></div>
          </div>

          <!-- Post-run finalization — shown after successful completion.
               One card per prospective run log entry; each is finalized (deal ID
               required) or abandoned. Nothing is logged until a card is finalized. -->
          <div id="postRunActions">
            <div id="finalizeCards"></div>
            <div class="post-run-btns">
              <a id="driveFolderBtn" class="btn-ghost" href="#" target="_blank">&#128194; Open Output Folder</a>
              <button id="vinLogBtn" onclick="addToVINLog()" disabled>&#10003; Add to VIN Log</button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- BODY: VIN box | data table (the flow zone lives in the topbar now) -->
    <div class="rv-body">

      <div class="rv-vinzone">
        <label for="vinInput">VINs / Stock Numbers</label>
        <textarea id="vinInput" placeholder="Pre-fill from CAO, or paste VINs here — one per line..."></textarea>
        <label class="bypass-label">
          <input type="checkbox" id="bypassFilters" />
          Bypass filtering rules
          <span class="bypass-hint">Use if a vehicle is being incorrectly filtered out</span>
        </label>
        <div class="vin-count" id="runVinCount"></div>
        <div class="rv-matchcount" id="vinMatchCount"></div>
      </div>

      <div class="rv-tablezone">
        <div class="rv-zone-label">Inventory match</div>
        <div class="rv-table-scroll">
          <table id="vinDataTable" class="table-u">
            <thead>
              <tr>
                <th>Year</th><th>Make</th><th>Model</th><th>Type</th>
                <th>Stock</th><th>VIN</th><th>Status</th><th>Link</th>
                <th id="rvFeatHead" style="display:none">Features</th>
              </tr>
            </thead>
            <tbody id="vinDataBody">
              <tr class="rv-empty-row"><td colspan="8">Select a dealer, then enter VINs to check them.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<style>
#view-run * { box-sizing: border-box; }
    #view-run {
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
      font-size: var(--fs-body);
      color: var(--text);
      height: 100%;
      overflow: hidden;
    }

    /* ── Layout: top bar (left cluster | flow zone | actions) + 2-zone body ── */
    #view-run .rv-wrap { display: flex; flex-direction: column; height: 100%; min-height: 0; gap: var(--space-3); padding: var(--space-3); }
    #view-run .rv-topbar { display: flex; flex-direction: column; gap: var(--space-2); }
    /* The topbar takes natural height (the flow zone grows during finalize) and
       .rv-body's flex:1 absorbs the rest — the table shifts down, never overlaps. */
    #view-run .rv-topbar-main { display: grid; grid-template-columns: minmax(300px, 360px) auto 1fr;
                                align-items: start; gap: var(--space-3); }
    #view-run .rv-topbar-inputs { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
    /* Flow zone — HARD RULE: the table/VIN box NEVER shift for run-flow
       elements. The zone is a FIXED-HEIGHT row of up to three equal-height
       cards — [inventory stats] [run status: progress + status] [finalize
       block] — each filling the full height (shared top/bottom gridlines) and
       distributing its contents evenly. Too narrow → the row scrolls
       horizontally; it never wraps or grows taller. min-width:0 is
       load-bearing: long text must wrap/clip, not stretch the 1fr track. */
    #view-run .rv-flow { display: flex; align-items: stretch; gap: var(--space-2); min-width: 0;
                         height: 190px;   /* ponytail: ≈ the input cluster's height — the ONE height knob */
                         overflow-x: auto; overflow-y: hidden; }
    /* Run-status card: progress strip + status banner. */
    #view-run .rv-flow-mid { display: flex; flex-direction: column; justify-content: space-evenly; gap: var(--space-2);
                             flex: 1.5 0 240px; min-width: 240px;
                             padding: 10px 14px; background: var(--surface);
                             border: 1px solid var(--border); border-radius: var(--radius-sm);
                             overflow-y: auto; }
    #view-run .rv-topbar-actions { flex-shrink: 0; display: flex; flex-direction: column; gap: var(--space-2); padding-top: 18px; }
    #view-run .rv-topbar-actions button { width: 100%; white-space: nowrap; }
    #view-run .rv-body { display: grid; grid-template-columns: var(--rv-vin-w) 1fr;
                         grid-template-areas: "vin table"; gap: var(--space-3); flex: 1; min-height: 0; }
    #view-run .rv-vinzone { grid-area: vin; display: flex; flex-direction: column; min-height: 0; }
    #view-run .rv-tablezone { grid-area: table; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
    #view-run .rv-zone-label { font-size: var(--fs-overline); text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); margin-bottom: var(--space-2); }
    #view-run .rv-matchcount { font-size: var(--fs-sm); color: var(--text-2); margin-top: var(--space-2); }

    /* Data table — token-bound, tabular figures, like the dash/runs tables */
    #view-run .rv-table-scroll { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    #view-run #vinDataTable td { white-space: nowrap; }
    #view-run #vinDataTable td.rv-vin { font-family: var(--font-mono); color: var(--text-2); }
    #view-run #vinDataTable tr.rv-empty-row td { color: var(--text-muted); text-align: center; padding: var(--space-4); }
    #view-run #vinDataTable td.rv-link { white-space: nowrap; }
    #view-run #vinDataTable td.rv-link a { color: var(--accent); text-decoration: none; font-size: var(--fs-sm); }
    #view-run #vinDataTable td.rv-link a:hover { text-decoration: underline; }
    /* Features + editable-column text inputs (VersaWorks dealers) */
    #view-run #vinDataTable td.rv-feat { min-width: 16rem; }
    #view-run .rv-feat-input,
    #view-run .rv-edit-input {
      width: 100%; box-sizing: border-box;
      font-size: var(--fs-sm); color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 2px var(--space-2);
    }
    /* Over the column's length budget (`edit<N>` in the schema) — VersaWorks
       will shrink this text; flag it for manual shortening. */
    #view-run .rv-edit-input.rv-over { border-color: var(--danger); color: var(--danger); }

    #view-run label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      margin-top: 14px;
    }
    #view-run label:first-of-type { margin-top: 0; }
    #view-run .user-select-wrap select {
      border-color: var(--accent);
    }
    #view-run .user-select-wrap select:focus {
      outline: none;
      box-shadow: var(--focus-ring);
    }
    #view-run select,
  #view-run textarea,
  #view-run input[type="text"] {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: 1px solid var(--border-2);
      border-radius: var(--radius-sm);
      background: var(--bg);
      color: var(--text);
    }
    #view-run textarea {
      flex: 1;
      min-height: 0;
      resize: none;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      width: 100%;
    }
    #view-run .vin-count { font-size: 11px; color: var(--text-3); margin-top: 4px; min-height: 16px; }
    #view-run .field-hint { font-size: 11px; color: var(--text-3); margin-top: 3px; }
    #view-run .bypass-label {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 8px;
      font-weight: normal;
      font-size: 12px;
      color: var(--text-2);
      cursor: pointer;
      user-select: none;
    }
    #view-run .bypass-label input[type="checkbox"] {
      width: auto;
      margin: 0;
      cursor: pointer;
      accent-color: var(--warning);
    }
    #view-run .bypass-label:has(input:checked) { color: var(--warning); }
    #view-run .bypass-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 2px;
    }

    /* ── VIN log status row ──────────────────────────────────────────────── */
    #view-run #vinLogStatusRow {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-2);
    }
    #view-run #vinLogStatusRow .log-label { flex: 1; }
    /* positioning only — visual spec now owned by .tag.tone-neutral */
    #view-run #vinLogStatusRow .log-label span { margin-left: 4px; }
    #view-run #vinLogStatusRow .tag { font-size: 11.5px; }
    #view-run #openVinLogBtn {
      padding: 7px 14px;
      font-size: 12.5px;
      font-weight: bold;
      background: var(--bg);
      color: var(--accent);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
    }
    #view-run #openVinLogBtn:hover { background: var(--accent-weak); }

    /* ── CAO button (positioning only — visual spec now owned by .btn-ghost) ── */
    #view-run #caoBtn { width: auto; margin: 0; }

    /* ── CAO summary — compact vertical stat card. Fixed width; fills the flow
       row's height, distributing its rows evenly (no dead top/bottom bands);
       a long rejection breakdown scrolls inside. JS shows it with display:flex. */
    #view-run #caoSummary {
      display: none; flex-direction: column; justify-content: space-evenly;
      flex: 1 0 230px; min-width: 230px; overflow-y: auto;
      padding: 10px 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 11px; line-height: 1.6;
    }
    #view-run #caoSummary .summary-row { display: flex; justify-content: space-between; gap: 12px; }
    #view-run #caoSummary .summary-row span:last-child { font-weight: bold; color: var(--text); }
    #view-run #caoSummary .summary-divider { border: none; border-top: 1px solid var(--border); margin: 2px 0; }
    #view-run #caoSummary .summary-net { color: var(--accent); }
    #view-run #caoSummary .summary-net span:last-child { color: var(--accent); }
    #view-run #caoSummary .rejection-detail { color: var(--text-3); font-size: 10.5px; }

    /* ── Progress strip — lives INSIDE the run-status card (no own chrome) ── */
    #view-run #progressSection { display: none; flex-direction: column; justify-content: center; }
    #view-run #progressStep {
      font-size: 12px; color: var(--text); margin-bottom: 8px;
      min-height: 16px;   /* wraps in the narrow middle cell — never clip run info */
    }
    #view-run .progress-track {
      height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
    }
    #view-run .progress-fill {
      height: 100%; background: var(--accent); border-radius: 3px;
      width: 0%; transition: width 0.5s ease, background 0.3s ease;
    }
    #view-run .progress-fill.done { background: var(--success); }
    #view-run .progress-fill.error { background: var(--danger); }
    #view-run .progress-meta {
      display: flex; justify-content: space-between;
      margin-top: 5px; font-size: 11px; color: var(--text-3);
    }
    #view-run #progressPercent { font-weight: bold; color: var(--text-2); }

    /* ── Post-run actions — finalize card(s) with the two action buttons as a
       full-width row along the bottom. JS shows it with display:flex. */
    #view-run #postRunActions {
      display: none;
      flex-direction: column;
      gap: var(--space-2);
      /* shrink 0 + no min-width:0 — cells keep their natural width and the
         flow row scrolls horizontally instead of squishing them. */
      flex: 2.5 0 340px;
    }
    #view-run .post-run-btns {
      display: flex;
      gap: var(--space-2);
      flex-shrink: 0;
    }
    #view-run .post-run-btns > * { flex: 1; }
    /* Drive folder button — an <a> styled as a button; positioning + anchor
       resets only (visual spec now owned by .btn-ghost) */
    #view-run #driveFolderBtn {
      display: block;
      text-align: center;
      text-decoration: none;
      line-height: 1.4;
      white-space: nowrap;
    }
    /* VIN log button */
    #view-run #vinLogBtn {
      padding: 6px 12px;
      background: var(--success);
      color: var(--on-success);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    #view-run #vinLogBtn:hover { background: var(--success); }
    #view-run #vinLogBtn:disabled { background: var(--text-muted); cursor: default; }
    #view-run #vinLogBtn.committed {
      background: var(--bg);
      color: var(--success);
      border: 1.5px solid var(--success);
      cursor: default;
    }

    /* ── Finalization cards — one per prospective run log entry ──────────── */
    /* Side-by-side in the post-run band (billing-split runs show two);
       stretch keeps card edges on the same grid lines as the neighbors.
       nowrap: a second card widens the block into the row's horizontal
       scroll — wrapping would stack it past the fixed height. */
    #view-run #finalizeCards { flex: 1 1 auto; min-height: 0; display: flex; flex-wrap: nowrap; justify-content: flex-start; align-items: stretch; gap: 8px; }
    #view-run .finalize-card {
      flex: 1 1 300px; min-width: 280px;
      display: flex; flex-direction: column; justify-content: space-evenly;
      /* safety valve: a wrapped flex line sizes to its content, so without the
         cap an over-tall card paints PAST the cards zone (under the button
         row) instead of scrolling — max-height pins it to the zone. */
      max-height: 100%; overflow-y: auto;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 10px 14px; background: var(--surface);
    }
    #view-run .finalize-card.finalized { border-color: var(--success); background: var(--success-weak); }
    #view-run .finalize-card.abandoned { opacity: 0.55; background: var(--surface-2); }
    #view-run .finalize-card-head {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 12px;
    }
    #view-run .finalize-card-title { font-size: 14px; font-weight: 600; color: var(--text); }
    #view-run .finalize-card-count { font-size: 12.5px; color: var(--text-2); }
    #view-run .finalize-card-body { display: flex; gap: 8px; }
    #view-run .finalize-card-body input {
      flex: 1; min-width: 0; padding: 6px 8px; font-size: 12px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text);
    }

    /* ── Method selector (New Deal / Existing / Test) ─────────────────────── */
    #view-run .card-methods {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: 8px 20px; margin-bottom: 12px;
    }
    #view-run .card-method {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 13.5px; line-height: 16px;   /* = radio height, so all three labels sit level */
      color: var(--text); cursor: pointer; font-weight: normal;
      margin: 0;
    }
    #view-run .card-method.is-disabled { color: var(--text-muted); cursor: default; }
    #view-run .card-method input[type="radio"] {
      width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: var(--accent);
    }
    #view-run .card-method.is-disabled input[type="radio"] { cursor: default; }
    #view-run .card-method-label { white-space: nowrap; }
    #view-run .card-method-reason { font-size: 10.5px; color: var(--text-muted); font-style: italic; }
    #view-run .card-method-idrow { display: flex; flex-basis: 100%; margin-top: 2px; }
    #view-run .card-method-idrow input {
      flex: 1; min-width: 0; padding: 6px 8px; font-size: 12px;
      border: 1px solid var(--border-2); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text);
    }
    #view-run .card-method-idrow input:focus { outline: none; border-color: var(--accent); }
    #view-run .finalize-card-actions { display: flex; gap: 10px; justify-content: center; }
    #view-run .card-finalize-btn {
      padding: 10px 22px; font-size: 13px; border: none; border-radius: var(--radius-sm);
      background: var(--accent); color: var(--on-accent); cursor: pointer; white-space: nowrap;
    }
    #view-run .card-finalize-btn:hover { background: var(--accent-hover); }
    #view-run .card-finalize-btn:disabled { background: var(--text-muted); cursor: default; }
    #view-run .card-abandon-btn {
      padding: 10px 22px; font-size: 13px; border-radius: var(--radius-sm);
      background: var(--bg); color: var(--danger); border: 1px solid var(--danger);
      cursor: pointer; white-space: nowrap;
    }
    #view-run .card-abandon-btn:hover { background: var(--danger-weak); }
    #view-run .card-abandon-btn:disabled { color: var(--text-muted); border-color: var(--border-2); cursor: default; }
    #view-run .finalize-card-status { font-size: 11px; color: var(--text-2); margin-top: 6px; min-height: 14px; }
    #view-run .finalize-card-status.error { color: var(--danger); }
    #view-run .finalize-card-status.ok { color: var(--success); }

    /* ── Pipedrive push sub-block (inside a finalized card) — single-line;
       it lives in the slot the hidden Finalize/Abandon buttons vacate. ── */
    #view-run .card-push {
      margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border-2);
    }
    #view-run .card-push-modes { display: flex; gap: 14px; margin-bottom: 6px; }
    #view-run .card-push-modes label {
      display: inline-flex; align-items: center; gap: 5px;
      font-weight: normal; font-size: 12px; color: var(--text-2);
      margin: 0; cursor: pointer;
    }
    #view-run .card-push-modes input[type="radio"] {
      width: auto; margin: 0; cursor: pointer; accent-color: var(--accent);
    }
    #view-run .card-push-row { display: flex; gap: 8px; align-items: center; }
    #view-run .card-push-row input[type="text"] {
      flex: 1; min-width: 0; padding: 6px 8px; font-size: 12px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text);
    }
    #view-run .card-push-btn {
      padding: 6px 12px; font-size: 12px; border: none; border-radius: var(--radius-sm);
      background: var(--accent); color: var(--on-accent); cursor: pointer; white-space: nowrap;
    }
    #view-run .card-push-btn:hover { background: var(--accent-hover); }
    #view-run .card-push-btn:disabled { background: var(--text-muted); cursor: default; }
    #view-run .card-push-status { font-size: 11px; color: var(--text-2); margin-top: 6px; min-height: 14px; }
    #view-run .card-push-status.error { color: var(--danger); }
    #view-run .card-push-status.ok { color: var(--success); }
    #view-run .card-push-done {
      font-size: 12px; color: var(--success); font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    /* positioning only — visual spec now owned by .btn-ghost */
    #view-run .card-push-retry { margin-top: 6px; }

    /* ── Status bar ──────────────────────────────────────────────────────── */
    #view-run #runStatus {
      font-size: 12px; min-height: 18px;
      padding: 6px 8px; border-radius: var(--radius-sm);
    }
    #view-run #runStatus.error { background: var(--danger-weak); color: var(--danger); }
    #view-run #runStatus.success { background: var(--success-weak); color: var(--success); }
    #view-run #runStatus.info { background: var(--accent-weak); color: var(--accent); }
    #view-run #runStatus.empty { background: none; color: var(--text-2); }

    /* themed root (overrides the interim .view light guard) */
    #view-run { background: var(--bg); color: var(--text); }

    /* ── Mobile (data-viewport="mobile") — phone ≤760px ─────────────────────
       .rv-body already stacks (App.html). The topbar's 3-column grid (left
       cluster | flow zone | actions) crams on a ~360px screen — stack it to one
       column: cluster, then flow content, then full-width buttons. The VIN
       table is already in .rv-table-scroll (overflow:auto). No-op on desktop. */
    :root[data-viewport="mobile"] #view-run .rv-topbar-main { grid-template-columns: 1fr; }
    :root[data-viewport="mobile"] #view-run .rv-topbar-actions { flex-direction: row; flex-wrap: wrap; padding-top: 0; }
    :root[data-viewport="mobile"] #view-run .rv-topbar-actions button { flex: 1 1 auto; width: auto; }
    /* The fixed-height flow row re-stacks (and un-fixes) on a phone. */
    :root[data-viewport="mobile"] #view-run .rv-flow { flex-direction: column; align-items: stretch; height: auto; overflow: visible; }
    :root[data-viewport="mobile"] #view-run #caoSummary { min-width: 0; }
    :root[data-viewport="mobile"] #view-run #postRunActions { flex-direction: column; align-items: stretch; }
    :root[data-viewport="mobile"] #view-run #finalizeCards { flex-wrap: wrap; }

    /* Full-page scroll on mobile: drop the fixed-height panes so the whole view
       flows naturally and the bottom (post-CAO breakdown, finalize cards) is
       reachable by scrolling the page. The desktop layout (height:100% + internal
       pane scroll) is untouched — everything here is under [data-viewport="mobile"]. */
    :root[data-viewport="mobile"] #view-run { overflow-y: auto; }
    :root[data-viewport="mobile"] #view-run .rv-wrap { height: auto; min-height: 100%; }
    :root[data-viewport="mobile"] #view-run .rv-body { flex: 0 0 auto; min-height: 0; }
    /* min-width:0 is the key: grid items default to min-width:auto, so a wide
       element (the nowrap progress step / finalize-card rows in the flow zone)
       would force the column wider than the viewport and stretch the page
       horizontally. min-width:0 lets the column stay at viewport width and the
       content clip/wrap within it. */
    :root[data-viewport="mobile"] #view-run .rv-vinzone,
    :root[data-viewport="mobile"] #view-run .rv-tablezone,
    :root[data-viewport="mobile"] #view-run .rv-flow { min-height: 0; min-width: 0; }
    /* Keep the VIN textarea usable (~8+ lines) even after a CAO fill shrinks the
       grid row; it's flex:1 on desktop so a floor is all that's needed. */
    :root[data-viewport="mobile"] #view-run textarea { min-height: 220px; }
    /* The data table keeps its OWN internal scroll so it can't dominate the page. */
    :root[data-viewport="mobile"] #view-run .rv-table-scroll { max-height: 55vh; overflow: auto; }
</style>

<script>
    var pollInterval   = null;
    var runStartTime   = null;
    var currentRunId   = null;
    var lastRunResult  = null; // {outputFolderUrl, pendingRuns, dealerName, producedVinCount}
    var lastDealerKey  = null; // dealer key used for the last run
    var dealersByKey   = {};   // key → {key, name, splitDealLabel} from getActiveDealersForUI
    var cardStates     = [];   // per pendingRuns entry: {state, rowIndex, committed}
                               // state: pending → finalizing → finalized | pending → abandoning → abandoned
    var lastConfirmedDealer = ''; // for reverting the dealer select if a discard is cancelled

    // ── Init (lazy — first nav into the view) ────────────────────────────────
    // Dealers + users come from the shared AppData bootstrap (one server call
    // per session, prefetched by the App shell while the user is on Home;
    // Classic standalone triggers the same fetch lazily).
    function initRunView() {
      AppData.get(function(data, err) {
        if (!data) {
          document.getElementById('runDealerSelect').innerHTML = '<option value="">Error loading dealers</option>';
          setRunStatus('Could not load app data: ' + (err && err.message ? err.message : 'unknown error'), 'error');
          return;
        }

        var sel = document.getElementById('runDealerSelect');
        sel.innerHTML = '<option value="">-- Select a dealer --</option>';
        dealersByKey = {};
        data.dealers.forEach(function(d) {
          dealersByKey[d.key] = d;
          var opt = document.createElement('option');
          opt.value = d.key; opt.text = d.name;
          sel.appendChild(opt);
        });

        var usel = document.getElementById('userSelect');
        usel.innerHTML = '<option value="">-- Select user --</option>';
        data.users.profiles.forEach(function(u) {
          var opt = document.createElement('option');
          opt.value = u.key; opt.text = u.name;
          usel.appendChild(opt);
        });
        if (data.users.lastUser) usel.value = data.users.lastUser;

        updateButtons();
      });

      registerRunListeners();
    }

    window.VIEW_INITS = window.VIEW_INITS || {};
    VIEW_INITS['view-run'] = initRunView;

    // Close guards: a live run or un-finalized results should warn on exit.
    if (window.AppGuards) {
      AppGuards.register(function() {
        if (pollInterval) return 'A dealer run is still in progress';
        if (typeof hasUnfinalizedCards === 'function' && hasUnfinalizedCards()) {
          return 'Un-finalized run results (finalize or abandon them first)';
        }
        return null;
      });
    }

    // ── Input listeners (registered once from initRunView) ───────────────────
    function registerRunListeners() {
    document.getElementById('userSelect').addEventListener('change', function() {
      updateButtons();
    });
    document.getElementById('vinInput').addEventListener('input', function() {
      updateRunVinCount(); updateButtons(); hideCaoSummary();
    });
    document.getElementById('vinInput').addEventListener('input', function() {
      if (rvDebounce) clearTimeout(rvDebounce);
      rvDebounce = setTimeout(rvRenderTable, 250);
    });
    // Features + editable-column inputs are re-created on every table render —
    // one delegated listener on the persistent tbody captures typing without
    // re-rendering (the caret never moves; values restore from rvFeatures /
    // rvEdits on rebuild). Over-budget styling toggles live via data-max.
    document.getElementById('vinDataBody').addEventListener('input', function(e) {
      var t = e.target;
      if (!t || !t.classList) return;
      if (t.classList.contains('rv-feat-input')) {
        rvFeatures[t.getAttribute('data-vin')] = t.value;
      } else if (t.classList.contains('rv-edit-input')) {
        var vin = t.getAttribute('data-vin'), code = t.getAttribute('data-code');
        (rvEdits[vin] || (rvEdits[vin] = {}))[code] = t.value;
        var max = t.getAttribute('data-max');
        if (max) t.classList.toggle('rv-over', t.value.length > Number(max));
      }
    });
    document.getElementById('runDealerSelect').addEventListener('change', function() {
      // Switching dealers discards any un-finalized run results — confirm first.
      if (!discardPendingGuard()) {
        this.value = lastConfirmedDealer;
        return;
      }
      var key = this.value;
      lastConfirmedDealer = key;
      // Switching dealers abandons any pending VIN-Inbox batch link (the inbox
      // prefill itself passes this check — same key).
      if (window.viPendingBatch && window.viPendingBatch.dealerKey !== key) window.viPendingBatch = null;
      updateButtons(); hideCaoSummary();
      document.getElementById('vinInput').value = '';
      updateRunVinCount();
      hidePostRunActions();

      rvLoadDealerData(key);

      if (!key) {
        document.getElementById('vinLogStatusRow').style.display = 'none';
        return;
      }
      loadVinLogStatus(key);
    });
    }

    // (The pre-run Pipedrive Deal ID + split-deal fields were removed July 2026 —
    //  deal ids are entered on the finalization cards via the "Existing" method.)

    function getVins() {
      return document.getElementById('vinInput').value
        .split('\n').map(function(v) { return v.trim(); }).filter(function(v) { return v !== ''; });
    }

    // Appends VINs to the textarea WITHOUT clearing what's there, so CAO and
    // manual fills stack into one combined list. (Dedup happens at submit.)
    function appendVins(list) {
      if (!list || !list.length) return;
      var ta  = document.getElementById('vinInput');
      var cur = ta.value.replace(/\s+$/, '');
      ta.value = (cur === '' ? '' : cur + '\n') + list.join('\n');
      updateRunVinCount(); updateButtons();
      rvRenderTable();   // a programmatic .value set does NOT fire the input event, so render the table explicitly (CAO pre-fill)
    }

    // Cross-view jump support (VIN Inbox → "Create order"): select the batch's
    // dealer through the normal change flow, then append its valid VINs.
    // Mirrors vinlogPreselectDealer (ViewVinLog).
    function runPrefillFromInbox(dealerKey, vins) {
      var sel = document.getElementById('runDealerSelect');
      sel.value = dealerKey;
      sel.dispatchEvent(new Event('change'));   // full handler: un-finalized guard, clears textarea, loads dealer data
      if (window.CustomSelect) CustomSelect.refresh(sel);   // sync the enhanced facade to the programmatic value
      // Guard cancelled → the handler reverted the select (also catches a
      // dealerKey with no matching option, which leaves sel.value = '').
      if (sel.value !== dealerKey) { window.viPendingBatch = null; return; }
      appendVins(vins);   // AFTER the change handler cleared the textarea
    }

    // Case-insensitive, order-preserving de-dup of a VIN list.
    function dedupeVins(list) {
      var seen = {}, out = [];
      for (var i = 0; i < list.length; i++) {
        var k = list[i].toUpperCase();
        if (seen[k]) continue;
        seen[k] = 1; out.push(list[i]);
      }
      return out;
    }

    function updateRunVinCount() {
      var count = getVins().length;
      document.getElementById('runVinCount').textContent =
        count > 0 ? count + ' VIN' + (count === 1 ? '' : 's') + ' entered' : '';
    }

    function updateButtons() {
      // Deal IDs are NOT required to run — they are entered (or confirmed) on
      // the finalization cards after the run, once results are known.
      var hasUser   = document.getElementById('userSelect').value !== '';
      var hasDealer = document.getElementById('runDealerSelect').value !== '';
      var hasVins   = getVins().length > 0;
      document.getElementById('caoBtn').disabled = !hasDealer;
      document.getElementById('runBtn').disabled = !(hasUser && hasDealer && hasVins);
    }

    // ── VIN log status ────────────────────────────────────────────────────────
    function loadVinLogStatus(dealerKey) {
      var row  = document.getElementById('vinLogStatusRow');
      var span = document.getElementById('vinLogOrderSpan');
      row.style.display = 'flex';
      span.textContent = '…';

      google.script.run
        .withSuccessHandler(function(result) {
          span.textContent = (result && result.latestOrderId) ? result.latestOrderId : 'none';
        })
        .withFailureHandler(function() {
          span.textContent = '—';
        })
        .getLatestOrderId(dealerKey);
    }

    function openVinLogUpdater() {
      // In the App: instant view switch with the current dealer preselected.
      // Pending finalization state in this view SURVIVES the jump (hidden
      // views keep their DOM + JS state). In the classic standalone context,
      // navTo falls back to the old dialog-replacement behavior.
      var key = document.getElementById('runDealerSelect').value;
      navTo('view-vinlog');
      if (typeof vinlogPreselectDealer === 'function' && key) {
        vinlogPreselectDealer(key);
      }
    }

    // ── CAO pre-fill ──────────────────────────────────────────────────────────
    function prefillFromCAO() {
      var key = document.getElementById('runDealerSelect').value;
      if (!key) return;
      var btn = document.getElementById('caoBtn');
      btn.disabled = true; btn.textContent = '⟳ Loading...';
      setRunStatus('Pulling inventory and applying filters...', 'info');
      hideCaoSummary();

      google.script.run
        .withSuccessHandler(function(result) {
          appendVins(result.vins);
          showCaoSummary(result.summary);
          setRunStatus(result.vins.length === 0
            ? 'No net-new vehicles found after filters and dedup.'
            : 'Added ' + result.vins.length + ' net-new VIN' +
              (result.vins.length === 1 ? '' : 's') + ' from CAO. Review and click Run.',
            result.vins.length === 0 ? 'info' : 'success');
          btn.disabled = false; btn.textContent = '↺ Pre-fill from CAO';
        })
        .withFailureHandler(function(e) {
          setRunStatus('CAO error: ' + e.message, 'error');
          btn.disabled = false; btn.textContent = '↺ Pre-fill from CAO';
        })
        .getCaoVins(key);
    }

    function showCaoSummary(s) {
      document.getElementById('sTotal').textContent    = s.totalInventory;
      document.getElementById('sFiltered').textContent = s.afterFiltering;
      document.getElementById('sPrinted').textContent  = s.alreadyPrinted;
      document.getElementById('sNetNew').textContent   = s.netNew;
      var b = s.rejectionBreakdown;
      var labels = {
        no_stock: 'Missing stock number', no_price: 'Missing or invalid price',
        no_url: 'Missing URL', type: 'Type not allowed',
        status: 'Status excluded', price_low: 'Below min price',
        price_high: 'Above max price', seasoning: 'Not yet seasoned',
        cao_excluded: 'Excluded from CAO (manual-only)'
      };
      function rejectionLabel(k) {
        if (labels[k]) return labels[k];
        if (k.indexOf('cond:') === 0) {
          return 'Condition: ' + k.slice(5).replace(/_/g, ' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
        }
        return k;
      }
      var rows = '';
      var totalRejected = s.totalInventory - s.afterFiltering;
      if (totalRejected > 0) {
        rows += '<div class="rejection-detail">Filtered out (' + totalRejected + '):</div>';
        // Iterate the actual breakdown so new targeting reasons (cond:*, cao_excluded) render too.
        Object.keys(b).forEach(function(k) {
          if (b[k] > 0) rows += '<div class="summary-row rejection-detail"><span>&nbsp;&nbsp;' +
            rejectionLabel(k) + '</span><span>' + b[k] + '</span></div>';
        });
      }
      document.getElementById('rejectionRows').innerHTML = rows;
      document.getElementById('caoSummary').style.display = 'flex';   // horizontal stat strip
    }

    function hideCaoSummary() {
      document.getElementById('caoSummary').style.display = 'none';
    }

    // ── Progress polling ──────────────────────────────────────────────────────
    function startPolling(runId) {
      if (window.AppBusy) AppBusy.set('run', true);
      currentRunId = runId;
      runStartTime = Date.now();
      document.getElementById('progressSection').style.display = 'flex';   // column card, fills the middle cell
      updateProgressUI({ message: 'Starting...', percent: 0, done: false, error: null });

      pollInterval = setInterval(function() {
        var elapsed = Math.round((Date.now() - runStartTime) / 1000);
        document.getElementById('progressElapsed').textContent = elapsed + 's';

        google.script.run
          .withSuccessHandler(function(progress) {
            updateProgressUI(progress);
            if (progress.done) stopPolling();
          })
          .withFailureHandler(function() { /* non-fatal, skip tick */ })
          .getRunProgress(runId);
      }, 1500);
    }

    function stopPolling() {
      if (window.AppBusy) AppBusy.set('run', false);
      if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
      if (currentRunId) {
        google.script.run.clearRunProgress(currentRunId);
        currentRunId = null;
      }
    }

    function updateProgressUI(progress) {
      var fill = document.getElementById('progressFill');
      document.getElementById('progressStep').textContent = progress.message || 'Running...';
      document.getElementById('progressPercent').textContent = (progress.percent || 0) + '%';
      fill.style.width = (progress.percent || 0) + '%';
      fill.classList.remove('done', 'error');
      if (progress.done && !progress.error) fill.classList.add('done');
      if (progress.error)                   fill.classList.add('error');
    }

    // ── Post-run finalization panel ───────────────────────────────────────────
    // One card per prospective RUN_LOG entry. The user picks a Pipedrive METHOD
    // up front, then one button finalizes (and pushes):
    //   • New Deal — creates + finalizes + attaches products in one call (no id).
    //   • Existing — the only method with a deal-id input; attaches to that deal.
    //   • Test order — never touches Pipedrive; logs col D 'test'; not committable.
    // RUN_LOG/ORDER_STATS are written only by Finalize; the VIN log only by the
    // explicit commit button (which excludes test-method cards).

    // Resolve the default method for an entry: New if available, else Test.
    function pdDefaultMethod_(entry) {
      var pm = (entry && entry.pushModes) || {};
      return pm.newDeal ? 'new' : 'test';
    }
    // Primary-button label by method.
    function pdMethodBtnLabel_(method) {
      if (method === 'new')      return 'Create deal & Finalize';
      if (method === 'existing') return 'Finalize & Link';
      return 'Finalize (test)';
    }

    function showFinalizePanel(result) {
      var link = document.getElementById('driveFolderBtn');
      link.href = result.outputFolderUrl;
      link.style.opacity = '';
      link.style.pointerEvents = '';

      var vinBtn = document.getElementById('vinLogBtn');
      vinBtn.disabled = true;
      vinBtn.textContent = '✓ Add to VIN Log';
      vinBtn.className = '';

      cardStates = result.pendingRuns.map(function(entry) {
        return { state: 'pending', rowIndex: null, committed: false,
                 method: pdDefaultMethod_(entry), dealId: '' };
      });

      var html = '';
      result.pendingRuns.forEach(function(entry, i) {
        html += '<div class="finalize-card" id="card' + i + '">' +
          '<div class="finalize-card-head">' +
            '<span class="finalize-card-title">' + escHtml(entry.label) + '</span>' +
            '<span class="finalize-card-count">' + entry.totalMatched + ' unit' +
              (entry.totalMatched === 1 ? '' : 's') + ' / ' + entry.totalOrdered + ' ordered</span>' +
          '</div>' +
          renderCardMethods_(entry, i) +
          '<div class="finalize-card-actions">' +
            '<button class="card-finalize-btn" id="cardFinalize' + i + '" onclick="finalizeCard(' + i + ')">' +
              escHtml(pdMethodBtnLabel_(cardStates[i].method)) + '</button>' +
            '<button class="card-abandon-btn" id="cardAbandon' + i + '" onclick="abandonCard(' + i + ')">Abandon</button>' +
          '</div>' +
          '<div class="finalize-card-status" id="cardStatus' + i + '"></div>' +
          '<div class="card-push" id="cardPush' + i + '" style="display:none;"></div>' +
        '</div>';
      });
      document.getElementById('finalizeCards').innerHTML = html;
      document.getElementById('postRunActions').style.display = 'flex';   // horizontal band
    }

    // The up-front 3-way method selector + (Existing only) the deal-id input.
    // Availability comes from entry.pushModes; Test is always enabled.
    function renderCardMethods_(entry, i) {
      var pm = entry.pushModes || { test: true, newDeal: false, existing: false };
      var method = cardStates[i].method;
      function radio(val, label, enabled, reason) {
        var dis = enabled ? '' : ' disabled';
        var reasonHtml = (!enabled && reason)
          ? '<span class="card-method-reason">' + escHtml(reason) + '</span>' : '';
        return '<label class="card-method' + (enabled ? '' : ' is-disabled') + '">' +
          '<input type="radio" name="cardMethod' + i + '" value="' + val + '"' +
            (method === val ? ' checked' : '') + dis +
            ' onchange="setCardMethod(' + i + ', \'' + val + '\')">' +
          '<span class="card-method-label">' + escHtml(label) + '</span>' + reasonHtml +
        '</label>';
      }
      var newEnabled = !!pm.newDeal;
      var exEnabled  = !!pm.existing;
      // A single shared reason explains why New/Existing are unavailable (e.g. no org).
      var reason = pm.reason || '';
      var idRow =
        '<div class="card-method-idrow" id="cardIdRow' + i + '" style="display:' +
          (method === 'existing' ? 'flex' : 'none') + ';">' +
          '<input type="text" id="cardDeal' + i + '" placeholder="Existing Pipedrive Deal ID" ' +
            'value="' + runEscAttr_(cardStates[i].dealId || '') + '" ' +
            'oninput="setCardDealId(' + i + ', this.value)" />' +
        '</div>';
      return '<div class="card-methods" id="cardMethods' + i + '">' +
        radio('new', 'New Deal', newEnabled, newEnabled ? '' : reason) +
        radio('existing', 'Existing', exEnabled, exEnabled ? '' : reason) +
        radio('test', 'Test order', true, '') +
        idRow +
      '</div>';
    }

    // Attribute-safe escape (escHtml + single-quote-safe). View-prefixed because
    // ViewRules.html already declares a global escAttr_ — the App shell shares one
    // scope, so a duplicate top-level name would clobber the other view.
    function runEscAttr_(v) {
      if (v == null) return '';
      return escHtml(String(v)).replace(/'/g, '&#39;');
    }

    function setCardMethod(i, method) {
      if (!cardStates[i]) return;
      cardStates[i].method = method;
      // Show the deal-id input only for Existing.
      var idRow = document.getElementById('cardIdRow' + i);
      if (idRow) idRow.style.display = (method === 'existing') ? 'flex' : 'none';
      // Retarget the primary button label.
      var btn = document.getElementById('cardFinalize' + i);
      if (btn) btn.textContent = pdMethodBtnLabel_(method);
    }

    function setCardDealId(i, val) {
      if (cardStates[i]) cardStates[i].dealId = val;
    }

    function hidePostRunActions() {
      document.getElementById('postRunActions').style.display = 'none';
      document.getElementById('finalizeCards').innerHTML = '';
      lastRunResult = null;
      cardStates = [];
    }

    // Whether a method radio is available for an entry (Test always; New/Existing
    // per pushModes). Used to restore radio state after a busy cycle.
    function pdMethodAvailable_(entry, val) {
      var pm = (entry && entry.pushModes) || {};
      if (val === 'test') return true;
      if (val === 'new') return !!pm.newDeal;
      if (val === 'existing') return !!pm.existing;
      return false;
    }

    // Enable/disable every interactive control in a card's method block.
    function setCardBusy(i, busy) {
      var entry = lastRunResult.pendingRuns[i];
      var deal = document.getElementById('cardDeal' + i);
      if (deal) deal.disabled = busy;
      document.getElementById('cardFinalize' + i).disabled = busy;
      document.getElementById('cardAbandon' + i).disabled = busy;
      var radios = document.querySelectorAll('input[name="cardMethod' + i + '"]');
      for (var r = 0; r < radios.length; r++) {
        // While busy → disable all; when free → restore to the method's availability.
        radios[r].disabled = busy ? true : !pdMethodAvailable_(entry, radios[r].value);
      }
    }

    function markCardAbandoned(i) {
      document.getElementById('card' + i).className = 'finalize-card abandoned';
      var methods = document.getElementById('cardMethods' + i);
      if (methods) methods.style.display = 'none';
      document.getElementById('cardFinalize' + i).style.display = 'none';
      document.getElementById('cardAbandon' + i).style.display = 'none';
      var statusEl = document.getElementById('cardStatus' + i);
      if (!statusEl.textContent) statusEl.textContent = 'Abandoned — not logged.';
      runNotifyBatchIfDone_();   // covers finalize-one-then-abandon-one split runs
    }

    // VIN-Inbox batch link: once every card is resolved AND at least one was
    // finalized, offer to discard the source batch. viMaybeDiscardBatch
    // self-clears window.viPendingBatch, so this fires at most once per batch;
    // an all-abandoned run (no finalized card) never prompts.
    function runNotifyBatchIfDone_() {
      if (!window.viPendingBatch) return;
      if (hasUnfinalizedCards()) return;
      if (!cardStates.some(function(s) { return s.state === 'finalized'; })) return;
      if (typeof viMaybeDiscardBatch === 'function') viMaybeDiscardBatch();
    }

    function hasUnfinalizedCards() {
      return lastRunResult !== null && cardStates.some(function(s) {
        return s.state === 'pending' || s.state === 'finalizing' || s.state === 'abandoning';
      });
    }

    function discardPendingGuard() {
      if (!hasUnfinalizedCards()) return true;
      return confirm('You have run results that haven\'t been finalized or abandoned. ' +
                     'Discard them? They will never appear in the run log.');
    }

    // Method-first finalize. One server call per method; always capture rowIndex
    // when present (so the card is committable + retryable even if the push step
    // failed). Pushing happens inside the New/Existing finalize calls server-side.
    function finalizeCard(i) {
      var entry    = lastRunResult.pendingRuns[i];
      var statusEl = document.getElementById('cardStatus' + i);
      var method   = cardStates[i].method;

      var existingDealId = '';
      if (method === 'existing') {
        var input = document.getElementById('cardDeal' + i);
        existingDealId = input ? input.value.trim() : '';
        if (!existingDealId) {
          statusEl.textContent = 'Enter the existing Pipedrive Deal ID.';
          statusEl.className = 'finalize-card-status error';
          return;
        }
      }

      cardStates[i].state = 'finalizing';
      setCardBusy(i, true);
      statusEl.textContent = (method === 'test')
        ? 'Logging test run…'
        : (method === 'new' ? 'Creating deal & finalizing…' : 'Finalizing & linking…');
      statusEl.className = 'finalize-card-status';

      var runner = google.script.run
        .withSuccessHandler(function(res) { onFinalizeResult_(i, method, existingDealId, res || {}); })
        .withFailureHandler(function(e) {
          // A thrown error means nothing was written (e.g. bad existing id / test
          // throw) — revert to pending so the user can adjust the method/id.
          cardStates[i].state = 'pending';
          setCardBusy(i, false);
          statusEl.textContent = 'Error: ' + e.message;
          statusEl.className = 'finalize-card-status error';
        });

      if (method === 'new')      runner.finalizeRunNewDeal(lastDealerKey, entry);
      else if (method === 'existing') runner.finalizeRunExisting(lastDealerKey, entry, existingDealId);
      else                        runner.finalizeRun(lastDealerKey, entry, 'test');
    }

    // Shared result handler for all three finalize methods.
    //   • rowIndex present → the RUN_LOG row exists: mark finalized (committable),
    //     lock the method block, and (New/Existing) reflect the push outcome.
    //   • no rowIndex on !ok → finalize itself failed (e.g. Existing bad id,
    //     stage:'deal') → stay pending, show the error.
    function onFinalizeResult_(i, method, existingDealId, res) {
      var statusEl = document.getElementById('cardStatus' + i);
      var hasRow = (res.rowIndex != null);
      var ok = (res.ok !== false);   // finalizeRun (test) returns no `ok` → treat as ok

      if (!hasRow) {
        // Nothing logged — typically a rejected Existing deal id (stage 'deal').
        cardStates[i].state = 'pending';
        setCardBusy(i, false);
        statusEl.textContent = res.message || 'Finalize failed — nothing was logged.';
        statusEl.className = 'finalize-card-status error';
        return;
      }

      // Row written → finalized + committable.
      cardStates[i].state    = 'finalized';
      cardStates[i].rowIndex = res.rowIndex;
      document.getElementById('card' + i).className = 'finalize-card finalized';
      lockFinalizedCard_(i);
      statusEl.textContent = 'Logged ✓ (run log row ' + res.rowIndex + ')';
      statusEl.className = 'finalize-card-status ok';
      updateVinLogBtn();

      if (method === 'test') { runNotifyBatchIfDone_(); return; }   // never touches Pipedrive

      // New/Existing: reflect the push outcome in the push sub-block.
      var wrap = document.getElementById('cardPush' + i);
      if (wrap) wrap.style.display = 'block';
      if (ok) {
        try { renderPushDone(i, res); } catch (e) {}
      } else {
        // Finalize succeeded but the push step failed → keep the card finalized and
        // offer Retry (or the fix-mapping nudge for a deactivated product).
        var pushMode = (method === 'new') ? 'create' : 'link';
        try {
          if (wrap) {
            wrap.innerHTML = '<div class="card-push-status" id="pushStatus' + i + '"></div>';
          }
          var msg = 'Pipedrive: ' + (res.message || 'Push failed.');
          if (res.stage === 'inactive_product') {
            msg += ' Fix the product mapping in Dealer Rules → Pipedrive, then push again.';
          }
          setCardPushStatus(i, msg, 'error');
          if (res.retryable) renderPushRetry(i, pushMode, existingDealId);
        } catch (e) {}
      }
      runNotifyBatchIfDone_();   // after the push block renders, so the confirm doesn't block a half-drawn card
    }

    // Lock a finalized card's method controls (kept visible, read-only) and hide
    // the Finalize/Abandon buttons.
    function lockFinalizedCard_(i) {
      var methods = document.getElementById('cardMethods' + i);
      if (methods) {
        var inputs = methods.querySelectorAll('input');
        for (var k = 0; k < inputs.length; k++) inputs[k].disabled = true;
      }
      var fb = document.getElementById('cardFinalize' + i);
      var ab = document.getElementById('cardAbandon' + i);
      if (fb) fb.style.display = 'none';
      if (ab) ab.style.display = 'none';
    }

    // ── Pipedrive push retry engine (kept from the prior flow) ────────────────
    // After a finalize-ok / push-fail, doPush retries against the run's rowIndex.
    // Idempotent server-side (dup-guards) — a retry never creates a second deal.
    function doPush(i, mode, existingDealId) {
      var btn = document.getElementById('pushBtn' + i);
      if (btn) { btn.disabled = true; btn.textContent = 'Pushing...'; }
      setCardPushStatus(i, 'Pushing to Pipedrive...', '');

      google.script.run
        .withSuccessHandler(function(res) {
          res = res || {};
          if (res.ok) {
            renderPushDone(i, res);
          } else {
            if (btn) { btn.disabled = false; btn.textContent = 'Push to Pipedrive'; }
            // A deactivated mapped product blocks the push BEFORE any deal is made;
            // retrying won't help until the mapping is fixed in Dealer Rules, so add
            // a nudge and never offer Retry (retryable is false for this stage).
            var msg = res.message || 'Push failed.';
            if (res.stage === 'inactive_product') {
              msg += ' Fix the product mapping in Dealer Rules → Pipedrive, then push again.';
            }
            setCardPushStatus(i, msg, 'error');
            if (res.retryable) renderPushRetry(i, mode, existingDealId);
          }
        })
        .withFailureHandler(function(e) {
          if (btn) { btn.disabled = false; btn.textContent = 'Push to Pipedrive'; }
          setCardPushStatus(i, 'Push error: ' + e.message, 'error');
          renderPushRetry(i, mode, existingDealId);   // network/transient — offer retry
        })
        .pushRunToPipedrive(lastDealerKey, cardStates[i].rowIndex, mode, existingDealId || null);
    }

    // Collapse the controls to a done state showing the deal the run landed on.
    // ONE line — the push block fills the slot the hidden Finalize/Abandon
    // buttons vacate, so a finalized card never grows past the fixed flow row.
    function renderPushDone(i, res) {
      var wrap = document.getElementById('cardPush' + i);
      if (!wrap) return;
      var dealTxt = res.dealId != null ? ('#' + res.dealId) : '';
      wrap.innerHTML =
        '<div class="card-push-done">✓ ' + escHtml(res.message || 'Pushed to Pipedrive deal ' + dealTxt) + '</div>';
    }

    function renderPushRetry(i, mode, existingDealId) {
      var wrap = document.getElementById('cardPush' + i);
      if (!wrap) return;
      // Avoid stacking multiple retry buttons.
      var existing = document.getElementById('pushRetry' + i);
      if (existing) return;
      var btn = document.createElement('button');
      btn.className = 'card-push-retry btn-ghost';
      btn.id = 'pushRetry' + i;
      btn.textContent = 'Retry';
      btn.onclick = (function(idx, m, d) { return function() {
        var rb = document.getElementById('pushRetry' + idx);
        if (rb) rb.remove();
        doPush(idx, m, d);
      }; })(i, mode, existingDealId);
      wrap.appendChild(btn);
    }

    function setCardPushStatus(i, msg, type) {
      var el = document.getElementById('pushStatus' + i);
      if (!el) return;
      el.textContent = msg;
      el.className = 'card-push-status' + (type ? ' ' + type : '');
    }

    function abandonCard(i) {
      var statusEl = document.getElementById('cardStatus' + i);

      // If any sibling card is finalized or still live, the shared output doc
      // and QR codes must be kept — this abandon is bookkeeping only.
      var siblingsAlive = cardStates.some(function(s, j) {
        return j !== i && s.state !== 'abandoned';
      });

      if (siblingsAlive) {
        if (!confirm('Abandon this entry? It will never appear in the run log or order stats. ' +
                     'The output document is kept — the other entry still uses it.')) return;
        cardStates[i].state = 'abandoned';
        markCardAbandoned(i);
        updateVinLogBtn();
        return;
      }

      // Last live card and nothing finalized — abandoning deletes the run's artifacts.
      if (!confirm('Abandon this run? Nothing will be logged, and the output document ' +
                   'and QR codes will be deleted (moved to Drive trash).')) return;

      cardStates[i].state = 'abandoning';
      setCardBusy(i, true);
      statusEl.textContent = 'Deleting output doc and QR codes...';
      statusEl.className = 'finalize-card-status';

      google.script.run
        .withSuccessHandler(function(res) {
          cardStates[i].state = 'abandoned';
          statusEl.textContent = 'Abandoned — output doc and ' + res.trashedQrs +
                                 ' QR PNG' + (res.trashedQrs === 1 ? '' : 's') + ' moved to Drive trash.';
          markCardAbandoned(i);
          var link = document.getElementById('driveFolderBtn');
          link.removeAttribute('href');
          link.style.opacity = '0.5';
          link.style.pointerEvents = 'none';
          updateVinLogBtn();
        })
        .withFailureHandler(function(e) {
          cardStates[i].state = 'pending';
          setCardBusy(i, false);
          statusEl.textContent = 'Error: ' + e.message;
          statusEl.className = 'finalize-card-status error';
        })
        .abandonRun(lastDealerKey, lastRunResult.pendingRuns[i].outputDocId,
                    lastRunResult.pendingRuns[i].qrFileIds || null);
    }

    function getCommittableRows() {
      var rows = [];
      cardStates.forEach(function(s, i) {
        // Test-method cards are NEVER committable (the server throws for a `test`
        // deal id), so the UI must never offer them to the VIN log.
        if (s.method === 'test') return;
        if (s.state === 'finalized' && !s.committed &&
            lastRunResult.pendingRuns[i].producedVins.length > 0) {
          rows.push(s.rowIndex);
        }
      });
      return rows;
    }

    function updateVinLogBtn() {
      var vinBtn = document.getElementById('vinLogBtn');
      if (vinBtn.className === 'committed') return;
      vinBtn.disabled = getCommittableRows().length === 0;
    }

    function addToVINLog() {
      var rowIndexes = getCommittableRows();
      if (!lastDealerKey || rowIndexes.length === 0) {
        setRunStatus('No finalized entries to commit.', 'error');
        return;
      }
      var vinBtn = document.getElementById('vinLogBtn');
      vinBtn.disabled = true;
      vinBtn.textContent = 'Adding...';
      setRunStatus('', 'empty');

      google.script.run
        .withSuccessHandler(function(result) {
          cardStates.forEach(function(s) {
            if (s.state === 'finalized' && s.method !== 'test') s.committed = true;
          });
          vinBtn.textContent = '✓ Added ' + result.committed + ' VINs';
          vinBtn.className = 'committed';
          setRunStatus(result.committed + ' VINs committed to the ' +
            lastRunResult.dealerName + ' VIN log' +
            (rowIndexes.length > 1 ? ' (' + rowIndexes.length + ' deals)' : '') + '.', 'success');
        })
        .withFailureHandler(function(e) {
          vinBtn.disabled = false;
          vinBtn.textContent = '✓ Add to VIN Log';
          setRunStatus('VIN log error: ' + e.message, 'error');
        })
        .commitRunRows(lastDealerKey, rowIndexes);
    }

    // ── Run handler ───────────────────────────────────────────────────────────
    function runSelected() {
      var userSel = document.getElementById('userSelect');
      var userKey = userSel.value;
      var sel    = document.getElementById('runDealerSelect');
      var key    = sel.value;
      var name   = sel.options[sel.selectedIndex].text;
      var rawVins = getVins();
      var vins    = dedupeVins(rawVins);     // no VIN ever submitted twice
      var dupsRemoved = rawVins.length - vins.length;
      var runBtn = document.getElementById('runBtn');

      if (!userKey)          { setRunStatus('Please select a user.', 'error'); return; }
      if (!key)              { setRunStatus('Please select a dealer.', 'error'); return; }
      if (vins.length === 0) { setRunStatus('Please enter at least one VIN.', 'error'); return; }

      // Features gate (mirrors the authoritative server check in pasteVinsAndRun):
      // every found VIN whose type resolves to a FEATURES schema needs text.
      var missingFeat = [];
      var featuresMap = {};
      vins.forEach(function(v) {
        var vKey = v.toUpperCase();
        var d = rvVinData.map[vKey];
        if (!d || !rvVinData.featuresTypes[d.type]) return;
        var txt = (rvFeatures[vKey] || '').trim();
        if (txt) featuresMap[vKey] = txt;
        else missingFeat.push(v);
      });
      if (missingFeat.length) {
        setRunStatus('Enter Features for ' + missingFeat.length + ' row' +
          (missingFeat.length === 1 ? '' : 's') + ' before running: ' +
          missingFeat.join(', '), 'error');
        return;
      }

      // Editable-column overrides: send ONLY values the user actually changed
      // from their seed — untouched rows keep the authoritative template
      // formula value in the CSV (seeds are advisory previews).
      var editsMap = {};
      vins.forEach(function(v) {
        var vKey = v.toUpperCase();
        var d = rvVinData.map[vKey];
        var typed = rvEdits[vKey];
        if (!d || !typed) return;
        Object.keys(typed).forEach(function(code) {
          if (!rvTypeHasEditCode(d.type, code)) return;
          var val = String(typed[code] == null ? '' : typed[code]).trim();
          var seeds = rvVinData.editSeeds[vKey];
          var seed = (seeds && seeds[code] != null) ? String(seeds[code]) : '';
          if (val !== '' && val !== seed) {
            (editsMap[vKey] || (editsMap[vKey] = {}))[code] = val;
          }
        });
      });
      if (dupsRemoved > 0) {
        toast('Removed ' + dupsRemoved + ' duplicate VIN' + (dupsRemoved === 1 ? '' : 's') +
              ' from the order.', 'info');
      }

      // Mutual exclusion with imports: an import rewrites SCRAPERDATA, which
      // this run is about to read.
      if (window.AppBusy && AppBusy.is('import')) {
        setRunStatus('A data import is in progress (or has unresolved conflicts) — finish it before running.', 'error');
        return;
      }

      // Starting a new run discards any un-finalized results from the last one.
      if (!discardPendingGuard()) return;

      var runId  = String(Date.now());
      lastDealerKey = key;
      lastRunResult = null;
      hidePostRunActions();

      runBtn.disabled = true;
      runBtn.textContent = 'Running...';
      setRunStatus('', 'empty');
      startPolling(runId);

      var bypass = document.getElementById('bypassFilters').checked;

      google.script.run
        .withSuccessHandler(function(result) {
          stopPolling();
          lastRunResult = result;
          updateProgressUI({ message: 'Complete!', percent: 100, done: true, error: null });
          setRunStatus('Done! ' + name + ' order complete — finalize or abandon below.', 'success');
          runBtn.textContent = 'Run Dealer';
          updateButtons();
          if (result) showFinalizePanel(result);
        })
        .withFailureHandler(function(e) {
          stopPolling();
          updateProgressUI({ message: 'Error: ' + e.message, percent: 0, done: true, error: e.message });
          setRunStatus('Error: ' + e.message, 'error');
          runBtn.disabled = false;
          runBtn.textContent = 'Run Dealer';
        })
        .pasteVinsAndRun(key, vins, '', runId, bypass, userKey, null, featuresMap, editsMap);
    }

    function setRunStatus(msg, type) {
      var el = document.getElementById('runStatus');
      el.textContent = msg; el.className = type || 'empty';
    }

    // ── Run Order live VIN table ──────────────────────────────────────────────
    var rvVinData = { dealerKey: '', map: {}, featuresTypes: {}, editCodes: {}, editSeeds: {} };
    var rvFeatures = {};   // {VIN(upper) → text} — survives table re-renders
    var rvEdits = {};      // {VIN(upper) → {code → text}} — editable-column values (seeded)
    var rvDebounce = null;

    function rvLoadDealerData(dealerKey) {
      if (rvVinData.dealerKey !== dealerKey) { rvFeatures = {}; rvEdits = {}; }   // new dealer → stale text out
      rvVinData = { dealerKey: dealerKey, map: {}, featuresTypes: {}, editCodes: {}, editSeeds: {} };   // clear immediately
      rvRenderTable();
      if (!dealerKey) return;
      google.script.run
        .withSuccessHandler(function(res) {
          // ignore a stale response if a newer load superseded this one (compare
          // internal state, NOT the DOM — the native select is hidden behind the
          // CustomSelect enhancer, so reading its .value here is unreliable)
          if (rvVinData.dealerKey !== dealerKey) return;
          rvVinData = {
            dealerKey: dealerKey,
            map: (res && res.vinData) || {},
            featuresTypes: (res && res.featuresTypes) || {},
            editCodes: (res && res.editCodes) || {},
            editSeeds: (res && res.editSeeds) || {}
          };
          rvRenderTable();
        })
        .withFailureHandler(function() {})
        .getDealerVinData(dealerKey);
    }

    // Union of edit-flagged codes across the dealer's types, first-seen order:
    // one table column per code. Returns [{code, max}] (max = strictest budget).
    function rvEditColumns() {
      var out = [], byCode = {};
      Object.keys(rvVinData.editCodes).forEach(function(type) {
        rvVinData.editCodes[type].forEach(function(c) {
          if (!byCode[c.code]) { byCode[c.code] = { code: c.code, max: c.max }; out.push(byCode[c.code]); }
          else if (c.max != null && (byCode[c.code].max == null || c.max < byCode[c.code].max)) byCode[c.code].max = c.max;
        });
      });
      return out;
    }

    // Does this row's type get an input for this code?
    function rvTypeHasEditCode(type, code) {
      var list = rvVinData.editCodes[type];
      if (!list) return false;
      for (var i = 0; i < list.length; i++) if (list[i].code === code) return true;
      return false;
    }

    // Current value for an edit input: user-typed if present, else the seed.
    function rvEditValue(vinKey, code) {
      if (rvEdits[vinKey] && rvEdits[vinKey][code] != null) return rvEdits[vinKey][code];
      var seeds = rvVinData.editSeeds[vinKey];
      return (seeds && seeds[code] != null) ? seeds[code] : '';
    }

    function rvRenderTable() {
      var body = document.getElementById('vinDataBody');
      var countEl = document.getElementById('vinMatchCount');
      if (!body) return;
      // Safety net: if the loaded data doesn't match the currently-selected dealer
      // (a missed change event, a pre-selected dealer, or a CAO-before-load race),
      // (re)load it — rvLoadDealerData re-renders on success.
      var sel = document.getElementById('runDealerSelect');
      var curDealer = sel ? sel.value : '';
      if (curDealer && rvVinData.dealerKey !== curDealer) { rvLoadDealerData(curDealer); return; }
      var raw = (document.getElementById('vinInput').value || '').split(/\r?\n/);
      var lines = [];
      for (var i = 0; i < raw.length; i++) { var v = raw[i].trim(); if (v) lines.push(v); }

      // Features column: shown only when this dealer has a schema listing FEATURES.
      // Inputs render on rows whose type needs it; values live in rvFeatures so a
      // re-render (VIN textarea edits) never loses typed text.
      var rvHasFeatures = Object.keys(rvVinData.featuresTypes).length > 0;
      var featHead = document.getElementById('rvFeatHead');
      if (featHead) featHead.style.display = rvHasFeatures ? '' : 'none';

      // Editable formula columns (`CODE:HEADER:edit` schema cells — VersaWorks
      // text-fit): one dynamic column per code, seeded with the computed value.
      // Header cells are rebuilt each render (marked .rv-edit-head).
      var editCols = rvEditColumns();
      var headRow = featHead ? featHead.parentNode : null;
      if (headRow) {
        var stale = headRow.querySelectorAll('.rv-edit-head');
        for (var h = 0; h < stale.length; h++) headRow.removeChild(stale[h]);
        editCols.forEach(function(c) {
          var th = document.createElement('th');
          th.className = 'rv-edit-head';
          th.textContent = c.code;
          headRow.appendChild(th);
        });
      }
      var cols = (rvHasFeatures ? 9 : 8) + editCols.length;

      if (!lines.length) {
        body.innerHTML = '<tr class="rv-empty-row"><td colspan="' + cols + '">' +
          (rvVinData.dealerKey ? 'Enter VINs to check them against this dealer.' : 'Select a dealer, then enter VINs to check them.') +
          '</td></tr>';
        if (countEl) countEl.textContent = '';
        return;
      }

      var html = '', found = 0;
      for (var j = 0; j < lines.length; j++) {
        var key = lines[j].toUpperCase();
        var d = rvVinData.map[key];
        if (d) {
          found++;
          var urlCell = (d.url && d.url !== '*')
            ? '<a href="' + escHtml(d.url) + '" target="_blank" rel="noopener">Vehicle URL</a>'
            : '—';
          var featCell = '';
          if (rvHasFeatures) {
            featCell = rvVinData.featuresTypes[d.type]
              ? '<td class="rv-feat"><input type="text" class="rv-feat-input" data-vin="' + escHtml(key) +
                '" value="' + escHtml(rvFeatures[key] || '') + '" placeholder="Features…"></td>'
              : '<td>—</td>';
          }
          var editCells = '';
          editCols.forEach(function(c) {
            if (rvTypeHasEditCode(d.type, c.code)) {
              var val = rvEditValue(key, c.code);
              var over = c.max != null && val.length > c.max;
              editCells += '<td class="rv-feat"><input type="text" class="rv-edit-input' +
                (over ? ' rv-over' : '') + '" data-vin="' + escHtml(key) +
                '" data-code="' + escHtml(c.code) + '"' +
                (c.max != null ? ' data-max="' + c.max + '"' : '') +
                ' value="' + escHtml(val) + '"></td>';
            } else {
              editCells += '<td>—</td>';
            }
          });
          html += '<tr>' +
            '<td>' + escHtml(d.year)  + '</td>' +
            '<td>' + escHtml(d.make)  + '</td>' +
            '<td>' + escHtml(d.model) + '</td>' +
            '<td>' + rvTypePill(d.type) + '</td>' +
            '<td>' + escHtml(d.stock) + '</td>' +
            '<td class="rv-vin">' + escHtml(lines[j]) + '</td>' +
            '<td>' + escHtml(d.status) + '</td>' +
            '<td class="rv-link">' + urlCell + '</td>' +
            featCell +
            editCells +
          '</tr>';
        } else {
          var blankEdit = '';
          editCols.forEach(function() { blankEdit += '<td>—</td>'; });
          html += '<tr class="row-danger">' +
            '<td>—</td><td>—</td><td>—</td><td>—</td><td>—</td>' +
            '<td class="rv-vin">' + escHtml(lines[j]) + '</td>' +
            '<td>⚠ not in this dealer</td>' +
            '<td>—</td>' +
            (rvHasFeatures ? '<td>—</td>' : '') +
            blankEdit +
          '</tr>';
        }
      }
      body.innerHTML = html;
      if (countEl) countEl.textContent = lines.length + ' VINs · ' + found + ' found · ' + (lines.length - found) + ' not found';
    }

    // Reuse the themed type-pill classes (.pill + .type-*) so it themes everywhere.
    function rvTypePill(type) {
      var t = String(type || '').trim();
      var cls = t.toUpperCase() === 'NEW' ? 'type-new'
              : t.toUpperCase() === 'PO'  ? 'type-po'
              : t.toUpperCase() === 'CPO' ? 'type-cpo'
              : t.toUpperCase() === 'CPO-EL' ? 'type-cpoel' : '';
      if (!t) return '';
      return '<span class="pill ' + cls + ' active" style="cursor:default">' + escHtml(t) + '</span>';
    }
</script>
